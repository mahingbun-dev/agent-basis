/* 品牌层映射：插件面读 --et-*；别名从 body 继承，独立挂载时退回浅色兜底。
   注意选择器只做映射、不重定义 --dsw-alias-*——否则元素自持浅色别名，深色失效。 */
body, [data-eterna-ui] {
  --et-bg: var(--dsw-alias-bg-base, #f4f2ec);
  --et-surface: var(--dsw-alias-bg-layer-1, #fbfaf6);
  --et-surface-2: var(--dsw-alias-bg-layer-2, #efede5);
  --et-surface-3: var(--dsw-alias-bg-layer-3, #e6e3d9);
  --et-fg: var(--dsw-alias-label-primary, #1b1e1c);
  --et-fg-2: var(--dsw-alias-label-secondary, #3c423e);
  --et-muted: var(--dsw-alias-label-tertiary, #5f655f);
  --et-meta: var(--dsw-alias-label-dimmed, #6f756e);
  --et-border: var(--dsw-alias-border-l2, #dcd8cd);
  --et-border-soft: var(--dsw-alias-border-l1, #eae6dc);
  --et-accent: var(--dsw-alias-state-business-primary, #2b6272);
  --et-accent-hover: color-mix(in oklab, var(--et-accent), black 14%);
  --et-accent-active: color-mix(in oklab, var(--et-accent), black 24%);
  /* 宿主的 business-primary 是浅色强调字色，直接当白字按钮底对比度不足；
     混黑 38% 后白字约 5.4:1。深色主题下 accent 本身已够浅，走独立兜底。 */
  --et-accent-fill: var(--dsw-alias-button-primary-fill, #2b6272);
  --et-accent-fill-hover: var(--dsw-alias-button-primary-hover, #224f5c);
  --et-accent-on: #fbfaf6;
  --et-accent-soft: color-mix(in oklab, var(--et-accent), transparent 90%);
  --et-success: var(--dsw-alias-state-success-primary, #2d7a55);
  --et-warn: var(--dsw-alias-state-warn-primary, #94661c);
  --et-danger: var(--dsw-alias-state-error-primary, #a63d2e);
  --et-danger-soft: color-mix(in oklab, var(--et-danger), transparent 90%);
  --et-jade: var(--dsw-alias-state-done-primary, #3f7d6a);
  --et-sand: #c2a179;
  --et-bevel: inset 0 1px 0 color-mix(in oklab, #fff, transparent 30%);
  --et-focus-ring: 0 0 0 3px color-mix(in oklab, var(--et-accent), transparent 74%);
  --et-selection: color-mix(in oklab, var(--et-accent), transparent 78%);
  --et-scrim: var(--dsw-alias-bg-mask-1, rgba(22, 25, 23, 0.42));
  --et-overlay: var(--dsw-alias-bg-mask-1, rgba(22, 25, 23, 0.42));
  /* v4 阴影阶梯:组件(卡面/浮层)按 r1..r4 取值,桥接模式此前整档缺失——
   * 组件引用解析为空,应用内卡面与下拉弹层无阴影。宿主 ui-theme 只提供
   * lv1..lv3,第四档以 lv3 收口;深浅主题由宿主 lv 值自带切换。 */
  --et-shadow-r1: var(--dsw-shadow-lv1, 0 1px 2px rgba(38, 42, 36, 0.05), 0 2px 6px rgba(38, 42, 36, 0.04));
  --et-shadow-r2: var(--dsw-shadow-lv2, 0 1px 2px rgba(38, 42, 36, 0.05), 0 8px 24px rgba(38, 42, 36, 0.07));
  --et-shadow-r3: var(--dsw-shadow-lv3, 0 2px 6px rgba(38, 42, 36, 0.07), 0 16px 40px rgba(38, 42, 36, 0.1));
  --et-shadow-r4: var(--dsw-shadow-lv3, 0 4px 12px rgba(38, 42, 36, 0.09), 0 24px 64px rgba(38, 42, 36, 0.18));
  /* v3 兼容别名(v4 tokens.ts 同口径:指向 r2)。 */
  --et-shadow: var(--et-shadow-r2);
  --et-shadow-raised: var(--et-shadow-r2);
}

/* —— T1.5 条目详情(元数据卡 + 风险标注警示区 + 分型值区;2026-11-13 起住进编辑 tab,不吃页级节奏) —— */
[data-ps-entry-detail] { margin: 0; display: flex; flex-direction: column; gap: 12px; }
[data-ps-entry-title] { overflow-wrap: anywhere; }
[data-ps-entry-badges] { display: inline-flex; gap: 6px; flex-wrap: wrap; margin-top: -6px; }
[data-ps-entry-note] { margin: 0; font-size: var(--et-text-caption); line-height: 20px; color: var(--et-fg-2); }
/* 2026-11-12 作用说明区(registry description,用户要求每个提示词有中文说明)。 */
[data-ps-entry-description] {
  display: flex; flex-direction: column; gap: 6px; padding: var(--et-space-3) var(--et-space-4); border-radius: var(--et-radius-md);

}

/* 2026-11-12 红线锚点预检查(编辑器内;missing=警示态,ok=业务态胶囊)。 */
[data-ps-redline] {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;

}

  background: color-mix(in srgb, var(--et-warn) 8%, transparent);
}
[data-ps-redline][data-ps-redline-state='ok'] {
  background: color-mix(in srgb, var(--et-accent) 5%, transparent);
}
[data-ps-redline-title] { font-size: var(--et-text-caption); font-weight: var(--et-weight-display); color: var(--et-warn); }
[data-ps-redline-list] { margin: 0; padding: 0; display: flex; gap: 6px; flex-wrap: wrap; list-style: none; }
[data-ps-redline-missing-item] {
  font-size: var(--et-text-meta); color: var(--et-warn);

}
[data-ps-redline-insert] {
  align-self: center; padding: var(--et-space-1) var(--et-space-3); border-radius: var(--et-radius-sm);

}
/* T2.2 生效条件区(radius 胶囊 + 实测注记;matrix=docs/dev/ps-v2-hot-effect-matrix.md)。 */
[data-ps-entry-effect] {
  display: flex; flex-direction: column; gap: 6px; padding: var(--et-space-3) var(--et-space-4); border-radius: var(--et-radius-md);

}

}

/* 读值失败警示区(patch 值型 value.text=null:不冒充空内容,problems 就地明示)。 */
[data-ps-entry-value-error] {
  display: flex; flex-direction: column; gap: 6px; padding: 14px 18px; border-radius: var(--et-radius-md);
  border: 1px solid var(--et-danger);
  background: color-mix(in srgb, var(--et-danger) 6%, transparent);
}
[data-ps-entry-value-error-note] { margin: 0; font-size: var(--et-text-caption); line-height: var(--et-leading-snug); color: var(--et-fg-2); }
[data-ps-entry-problem-item] {
  margin: 0; font-size: var(--et-text-caption); line-height: var(--et-leading-snug);

}

[data-ps-chain-error] {

/* —— T2.3 会话快照查看(只读:会话行卡列表 + 冻结详情;2026-11-13 起住进快照 tab) —— */
[data-ps-session-snapshot] { display: flex; flex-direction: column; gap: 12px; margin: 0; }

}

  font-size: var(--et-text-meta); color: var(--et-muted);

  display: flex; flex-direction: column; gap: 10px; padding: var(--et-space-4) var(--et-space-5); border-radius: var(--et-radius-md);
  background: var(--et-surface);
  border: 1px solid var(--et-border);
}

[data-ps-snapshot-note] { margin: 0; font-size: var(--et-text-caption); line-height: var(--et-leading-snug); color: var(--et-fg-2); }
[data-ps-snapshot-meta] {
  display: flex; gap: 16px; flex-wrap: wrap; font-size: var(--et-text-meta);
  color: var(--et-muted); font-variant-numeric: tabular-nums;
}
[data-ps-snapshot-checksum] { overflow-wrap: anywhere; }
[data-ps-snapshot-entry-list] { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; }
[data-ps-snapshot-entry] {
  display: flex; flex-direction: column; gap: 6px; padding: 10px 0;
  border-bottom: 1px solid var(--et-border-soft);
}
[data-ps-snapshot-entry-list] > li:last-child { border-bottom: 0; }
[data-ps-snapshot-entry-head] { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
[data-ps-snapshot-entry-id] { font-size: var(--et-text-caption); font-weight: var(--et-weight-display); color: var(--et-fg); overflow-wrap: anywhere; }
[data-ps-snapshot-pointer] {
  font-size: var(--et-text-meta); color: var(--et-fg-2);
  font-variant-numeric: tabular-nums; overflow-wrap: anywhere;
}
[data-ps-snapshot-entry-note] { margin: 0; font-size: var(--et-text-caption); line-height: var(--et-leading-snug); color: var(--et-fg-2); }
[data-ps-snapshot-entry-problem] { font-size: var(--et-text-caption); line-height: var(--et-leading-snug); color: var(--et-danger); }
[data-ps-snapshot-entry] details { font-size: var(--et-text-meta); color: var(--et-fg-2); }
[data-ps-snapshot-entry] summary { cursor: pointer; }
[data-ps-snapshot-entry-text] {
  margin: 8px 0 0; padding: var(--et-space-3) var(--et-space-3); overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere;
  font-size: var(--et-text-caption); line-height: var(--et-leading-snug); border-radius: var(--et-radius-md);
  background: var(--et-surface-2);
  border: 1px solid var(--et-border-soft);
}
[data-ps-snapshot-error] {
  margin: 0; font-size: var(--et-text-caption); line-height: 20px;
  color: var(--et-danger); overflow-wrap: anywhere;
}
/* 快照主从视图:返回列表按钮(详情顶格,列表隐藏) */
[data-ps-snapshot-back] {
  align-self: flex-start;
  padding: 5px 14px; font: inherit; font-size: var(--et-text-meta); cursor: pointer;
  color: var(--et-fg-2); background: transparent;
  border: 1px solid var(--et-border); border-radius: var(--et-radius-sm);
}

[data-ps-transfer-inline] { margin: 4px 0 0; padding: 10px 0 0; border-top: 1px dashed var(--et-border-soft); }

[data-ps-ai-status] { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

[data-ps-ai-error] {
  margin: 0; font-size: var(--et-text-caption); line-height: 20px;

}
[data-ps-ai-draft-card] {
  display: flex; flex-direction: column; gap: 12px; padding: var(--et-space-4) var(--et-space-5); border-radius: var(--et-radius-md);

  border: 1px solid var(--et-border);
}

}

  border: 1px solid var(--et-border);
}
[data-ps-ai-draft-actions] { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
[data-ps-ai-propose-btn] {
  padding: 0 var(--et-space-4); height: 40px; min-height: 40px; font: inherit; font-size: var(--et-text-body); font-weight: var(--et-weight-display); cursor: pointer;
  color: var(--et-accent-on);

/* —— AI 审核报告卡(T3.3:问题清单+建议列表;仅展示不拦截,对照润色建议稿卡形态) —— */
[data-ps-ai-review-input-row] { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  padding: 0 var(--et-space-4); height: 40px; min-height: 40px; font: inherit; font-size: var(--et-text-body); font-weight: var(--et-weight-display); cursor: pointer;

}

[data-ps-ai-review-error] {
  margin: 0; font-size: var(--et-text-caption); line-height: 20px;

}

  display: flex; flex-direction: column; gap: 12px; padding: var(--et-space-4) var(--et-space-5); border-radius: var(--et-radius-md);

  font-size: var(--et-text-meta); color: var(--et-muted);
  font-family: var(--et-font-mono); overflow-wrap: anywhere;
}
[data-ps-ai-review-message] { margin: 0; font-size: var(--et-text-caption); line-height: 20px; color: var(--et-fg); overflow-wrap: anywhere; }
[data-ps-ai-review-suggestion] { margin: 0; font-size: var(--et-text-caption); line-height: var(--et-leading-snug); color: var(--et-fg-2); overflow-wrap: anywhere; }
[data-ps-ai-review-empty] { margin: 0; font-size: var(--et-text-meta); color: var(--et-muted); }
[data-ps-ai-review-note] { margin: 0; font-size: var(--et-text-caption); line-height: var(--et-leading-snug); color: var(--et-muted); overflow-wrap: anywhere; }

/* —— 键盘可达与触控目标(AGENTS.md 前端铁律 4) —— */
[data-t7-studio-root] button,
[data-t7-trace-root] button,
[data-t7-studio-root] input,
[data-t7-studio-root] textarea,
[data-t7-studio-root] select {
  transition: background-color var(--et-motion-fast) var(--et-ease),
    border-color var(--et-motion-fast) var(--et-ease),
    color var(--et-motion-fast) var(--et-ease),
    box-shadow var(--et-motion-fast) var(--et-ease);
}
[data-t7-studio-root] button:focus-visible,
[data-t7-trace-root] button:focus-visible,
[data-t7-studio-root] input:focus-visible,
[data-t7-studio-root] textarea:focus-visible,
[data-t7-studio-root] select:focus-visible,
[data-t7-editor]:focus-visible,
[data-t7-save-summary]:focus-visible {
  outline: none; box-shadow: var(--et-focus-ring);
}
/* 紧凑胶囊按钮的视觉节奏保持不变,经 ::after 外扩命中区到 ≥36px 级(access 开关同款手法)。 */
[data-t7-version-actions] button, [data-t7-export-latest], [data-t7-import-btn],
[data-t7-diff-close], [data-t7-refresh], [data-ps-entry-row], [data-ps-snapshot-session-row],
[data-ps-ai-polish-btn], [data-ps-ai-propose-btn], [data-ps-ai-discard-btn],
[data-ps-ai-review-btn], [data-ps-ai-review-close-btn] { position: relative; }
[data-t7-version-actions] button::after, [data-t7-export-latest]::after, [data-t7-import-btn]::after,
[data-t7-diff-close]::after, [data-t7-refresh]::after, [data-ps-entry-row]::after, [data-ps-snapshot-session-row]::after,
[data-ps-ai-polish-btn]::after, [data-ps-ai-propose-btn]::after, [data-ps-ai-discard-btn]::after,
[data-ps-ai-review-btn]::after, [data-ps-ai-review-close-btn]::after {
  content: ""; position: absolute; inset: -6px;
}

/* —— 2026-11-13 原型改版:三栏工作台(库 / 编辑器 / AI 助手) —— */
.ps-page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 20px; }
.ps-page-head-text { min-width: 0; }
.ps-eyebrow {
  margin: 0 0 8px; font-size: var(--et-text-caption); font-weight: var(--et-weight-display);
  letter-spacing: 0.14em; color: var(--et-accent);
}
.ps-page-actions { flex: none; display: flex; gap: 10px; padding-top: 4px; }
.ps-page-actions [data-t7-refresh] {
  padding: 7px 16px; font-size: var(--et-text-caption);
  color: var(--et-fg-2); background: transparent;
  border: 1px solid var(--et-border); border-radius: var(--et-radius-sm);
}
.ps-page-actions [data-t7-refresh]:hover { background: var(--et-surface-2); color: var(--et-fg); }

[data-ps-workspace] {
  /* 42 号 §8:工坊三栏 320 / 1fr / 320 */
  display: grid; grid-template-columns: 320px minmax(0, 1fr) 320px;
  gap: 12px; align-items: start;
}
.ps-panel {
  background: var(--et-surface);
  border: 1px solid var(--et-border-soft);
  border-radius: var(--et-radius-lg);
  box-shadow: var(--et-shadow-r1);
  min-width: 0;
}
.ps-panel-head { padding: var(--et-space-4) var(--et-space-4) var(--et-space-3); min-width: 0; }
.ps-panel-body { padding: var(--et-space-3) var(--et-space-4) var(--et-space-4); display: flex; flex-direction: column; gap: var(--et-space-3); min-width: 0; }
.ps-head-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.ps-panel-title {
  margin: 0; font-size: var(--et-text-body); line-height: var(--et-leading-snug);
  font-weight: var(--et-weight-display); color: var(--et-fg); letter-spacing: 0;
}
.ps-count-pill {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 24px; height: 24px; padding: 0 var(--et-space-2); border-radius: var(--et-radius-pill);
  background: var(--et-surface-2); border: 1px solid var(--et-border-soft);
  font-size: var(--et-text-meta); font-weight: var(--et-weight-display); color: var(--et-muted); font-variant-numeric: tabular-nums;
}
.ps-visually-hidden {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* 左栏:搜索 + 层筛选 chips + 分组列表(内部滚动) */
.ps-list-panel { display: flex; flex-direction: column; overflow: hidden; }
[data-ps-search] {
  /* v4 §6:输入 = surface-3 凹槽 + sm(12) + 40 高 + 15px */
  width: 100%; height: 40px; padding: 0 var(--et-space-3); font: inherit; font-size: var(--et-text-body);
  color: var(--et-fg); background: var(--et-surface-3);
  border: 1px solid var(--et-border); border-radius: var(--et-radius-sm);
}
[data-ps-search]:hover { border-color: var(--et-fg-2); }
[data-ps-search]::placeholder { color: var(--et-muted); }
.ps-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
.ps-chip {
  height: 32px; padding: 0 var(--et-space-3); border-radius: var(--et-radius-pill);
  background: transparent; border: 1px solid var(--et-border);
  color: var(--et-muted); font: inherit; font-size: var(--et-text-meta); font-weight: var(--et-weight-body);
  cursor: pointer;
}
.ps-chip:hover { border-color: var(--et-fg-2); color: var(--et-fg); }
.ps-chip[aria-pressed='true'] {
  background: var(--et-accent-soft); border-color: transparent; color: var(--et-accent-hover); font-weight: var(--et-weight-display);
}
.ps-library-list {
  padding: var(--et-space-1) var(--et-space-2) 10px;
  max-height: min(620px, 72vh);
  overflow-y: auto; overscroll-behavior: contain;
  border-top: 1px solid var(--et-border-soft);
  min-width: 0;
}
[data-ps-list-panel] [data-ps-group-nav] { grid-template-columns: 1fr; gap: 14px; margin: 0; }
.ps-empty-inline { margin: 8px 4px; font-size: var(--et-text-caption); line-height: var(--et-leading-body); color: var(--et-muted); }
/* 条目行:名称行(含未保存草稿圆点) */
[data-ps-entry-row-line] { display: flex; align-items: center; gap: 6px; min-width: 0; }
[data-ps-entry-dirty-dot] {
  display: none; flex: none; width: 6px; height: 6px; border-radius: var(--et-radius-pill);
  background: var(--et-warn);
}
[data-ps-entry-row][data-ps-entry-dirty='true'] [data-ps-entry-dirty-dot] { display: block; }

/* 中栏:编辑器(标题行 + 版本徽标 + 胶囊 + 三 tab) */
.ps-editor-panel { display: flex; flex-direction: column; }
.ps-editor-title-row { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
.ps-editor-title {
  margin: 0; font-size: var(--et-text-h3); line-height: var(--et-leading-snug); font-weight: var(--et-weight-display);
  letter-spacing: 0; color: var(--et-fg);
  min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
.ps-badge {
  display: inline-flex; align-items: center; flex: none;
  padding: 2px 7px; border-radius: var(--et-radius-sm);
  background: var(--et-accent-soft); color: var(--et-accent-hover);
  font-size: var(--et-text-caption); font-weight: var(--et-weight-display); font-variant-numeric: tabular-nums;
}
.ps-editor-pills { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.ps-tabs {
  display: inline-flex; align-items: center; gap: 2px;
  margin-top: 12px; padding: 2px;
  background: var(--et-surface-2); border: 1px solid var(--et-border-soft); border-radius: var(--et-radius-sm);
  max-width: 100%; overflow-x: auto;
}
.ps-tab {
  display: inline-flex; align-items: center; gap: 5px;
  height: 27px; padding: 0 12px; border: 0; border-radius: var(--et-radius-sm);
  background: transparent; color: var(--et-muted);
  font: inherit; font-size: var(--et-text-caption); font-weight: var(--et-weight-body); white-space: nowrap;
  cursor: pointer;
}
.ps-tab:hover { color: var(--et-fg); }
.ps-tab[aria-selected='true'] { background: var(--et-surface); color: var(--et-fg); font-weight: var(--et-weight-display); border: 1px solid var(--et-border-soft); }
.ps-tab-count { font-size: var(--et-text-meta); color: var(--et-muted); font-variant-numeric: tabular-nums; }
.ps-tab[aria-selected='true'] .ps-tab-count { color: var(--et-accent); }
.ps-editor-body { padding: 14px 18px 16px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.ps-editor-body [data-t7-section] { margin: 0; }
.ps-governance {
  border: 1px solid var(--et-border-soft); border-radius: var(--et-radius-md);
  padding: var(--et-space-3) var(--et-space-4); display: flex; flex-direction: column; gap: var(--et-space-3);
  background: var(--et-surface-2);
}
.ps-governance > summary {
  cursor: pointer; font-size: var(--et-text-caption); font-weight: var(--et-weight-display); color: var(--et-fg-2);
}
/* 保存栏(原型 editor-foot:摘要 + 保存;随面板文档流——sticky 悬浮会遮挡
   textarea 并拦截点击,2026-11-13 实测后回退为 in-flow) */
.ps-editor-foot {
  display: flex; align-items: center; gap: var(--et-space-3);
  padding: var(--et-space-3) var(--et-space-4);
  background: var(--et-surface-2);
  border-top: 1px solid var(--et-border-soft);
  border-radius: 0 0 var(--et-radius-lg) var(--et-radius-lg);
}
.ps-foot-dirty {
  display: inline-flex; align-items: center; gap: 6px; flex: none;
  font-size: var(--et-text-caption); color: var(--et-warn); font-weight: var(--et-weight-display);
}
.ps-foot-dirty::before { content: ""; width: 6px; height: 6px; border-radius: var(--et-radius-pill); background: var(--et-warn); }
.ps-foot-dirty[hidden] { display: none; }
[data-ps-editor-reset] {
  padding: var(--et-space-2) var(--et-space-3); height: 40px; min-height: 40px; font: inherit; font-size: var(--et-text-body); cursor: pointer;
  color: var(--et-fg-2); background: transparent;
  border: 1px solid var(--et-border); border-radius: var(--et-radius-md);
}
[data-ps-editor-reset]:hover:not(:disabled) { background: var(--et-surface); color: var(--et-fg); }
[data-ps-editor-reset]:disabled { opacity: 0.45; cursor: default; }
.ps-editor-foot [data-t7-save-summary] { flex: 1 1 160px; min-width: 0; }

/* 版本对比(原型 compare 形态:双下拉 + 交换/重置 + 左右版本卡 + 双栏行号 diff) */
.ps-compare { display: flex; flex-direction: column; gap: 10px; padding: 0; border: 0; background: transparent; margin: 0; }
.ps-compare-bar { display: flex; align-items: flex-end; gap: 8px; flex-wrap: wrap; }
.ps-compare-pick { display: grid; gap: 4px; flex: 1 1 150px; min-width: 0; max-width: 260px; }
.ps-compare-pick > span {
  font-size: var(--et-text-caption); font-weight: var(--et-weight-display);
  color: var(--et-muted); letter-spacing: 0.02em;
}
.ps-compare-pick select {
  height: 40px; padding: 0 var(--et-space-3); font: inherit; font-size: var(--et-text-body);
  color: var(--et-fg); background: var(--et-surface);
  border: 1px solid var(--et-border); border-radius: var(--et-radius-sm);
  min-width: 0; text-overflow: ellipsis;
}
.ps-compare-swap, .ps-compare-reset {
  height: 40px; padding: 0 var(--et-space-3); flex: none;
  font: inherit; font-size: var(--et-text-body); cursor: pointer;
  color: var(--et-fg-2); background: transparent;
  border: 1px solid var(--et-border); border-radius: var(--et-radius-sm);
}
.ps-compare-swap:hover, .ps-compare-reset:hover { background: var(--et-surface-2); color: var(--et-fg); }
.ps-compare-stat {
  margin-left: auto; display: inline-flex; align-items: center; gap: 8px; padding-bottom: 8px;
  font-size: var(--et-text-meta); color: var(--et-muted); white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.ps-compare-stat b { color: var(--et-fg-2); font-weight: var(--et-weight-display); }
.ps-compare-grid {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  column-gap: 1px; background: var(--et-border-soft);
  border: 1px solid var(--et-border-soft); border-radius: var(--et-radius-sm);
  /* 长 diff 必须自身可滚(2026-11-18):宿主面板给 .ps-compare 限定高度时,本 grid
     作为 flex 子项被压缩且 overflow≠visible 使自动最小尺寸归零——曾因 overflow:hidden
     硬裁剪且无处滚动,diff 看不全。max-height+overflow-y:auto 为库列表(.ps-library-list)
     同款惯用法;overflow-x:hidden 保留圆角裁剪职责。 */
  max-height: min(620px, 72vh);
  overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain;
}
.ps-compare-grid > * { background: var(--et-surface); min-width: 0; }
.ps-compare-grid .ps-compare-side { padding: 12px; border-bottom: 0; }
.ps-compare-side { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ps-compare-side-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ps-version-badge {
  display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: var(--et-radius-sm);
  background: var(--et-accent-soft); color: var(--et-accent-hover);
  font-size: var(--et-text-caption); font-weight: var(--et-weight-display); font-variant-numeric: tabular-nums;
}
.ps-version-source-badge {
  display: inline-flex; align-items: center; padding: 1px 10px; border-radius: var(--et-radius-pill);
  background: var(--et-surface-2); color: var(--et-fg-2);
  font-size: var(--et-text-caption); font-weight: var(--et-weight-display);
}
[data-t7-version-item][data-t7-version-source='initial'] .ps-version-source-badge { color: var(--et-accent); }
[data-t7-version-item][data-t7-version-source='rollback'] .ps-version-source-badge { color: var(--et-warn); }
.ps-tag-current {
  display: inline-flex; align-items: center; padding: 1px 6px; border-radius: var(--et-radius-sm);
  border: 1px solid color-mix(in srgb, var(--et-success) 35%, transparent);
  color: var(--et-success); font-size: var(--et-text-caption); font-weight: var(--et-weight-display);
}
.ps-compare-side-meta { margin: 0; font-size: var(--et-text-meta); color: var(--et-muted); font-variant-numeric: tabular-nums; }
.ps-compare-side-summary { margin: 0; font-size: var(--et-text-caption); line-height: var(--et-leading-snug); color: var(--et-fg-2); overflow-wrap: anywhere; }
.ps-compare-side-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.ps-compare-side-actions button { padding: 3px 10px; font-size: var(--et-text-meta); }
.ps-compare-side-content { margin: 4px 0 0; }
.ps-compare-section {
  grid-column: 1 / -1;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: var(--et-space-1) var(--et-space-3); background: var(--et-surface-2);
  border-top: 1px solid var(--et-border-soft);
  font-size: var(--et-text-caption); font-weight: var(--et-weight-display); color: var(--et-muted);
}
.ps-compare-section-meta { font-weight: var(--et-weight-body); color: var(--et-muted); font-variant-numeric: tabular-nums; }
.ps-compare-line {
  display: flex; align-items: flex-start; gap: 8px; padding: 1px 10px;
  font-family: var(--et-font-mono);
  font-size: var(--et-text-caption); line-height: var(--et-leading-snug); color: var(--et-fg-2);
}
.ps-compare-ln {
  flex: none; width: 22px; text-align: right;
  color: var(--et-muted); opacity: 0.65; user-select: none; font-variant-numeric: tabular-nums;
}
.ps-compare-lc { min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.ps-compare-line[data-ps-compare-kind='same'] { color: var(--et-muted); }
.ps-compare-line[data-ps-compare-column='a'][data-ps-compare-kind='mod'],
.ps-compare-line[data-ps-compare-column='a'][data-ps-compare-kind='del'] {
  background: color-mix(in srgb, var(--et-danger) 12%, transparent);
}
.ps-compare-line[data-ps-compare-column='b'][data-ps-compare-kind='mod'],
.ps-compare-line[data-ps-compare-column='b'][data-ps-compare-kind='add'] {
  background: color-mix(in srgb, var(--et-success) 15%, transparent);
}
/* 单边空列(仅删/仅增的另一侧):斜纹占位,不是内容 */
.ps-compare-line[data-ps-compare-kind='add'][data-ps-compare-column='a'],
.ps-compare-line[data-ps-compare-kind='del'][data-ps-compare-column='b'] {
  background-image: repeating-linear-gradient(135deg, transparent 0 5px, var(--et-surface-2) 5px 6px);
}
.ps-compare-truncated {
  grid-column: 1 / -1; margin: 0; padding: var(--et-space-2) var(--et-space-3);
  font-size: var(--et-text-meta); color: var(--et-muted);
  background: var(--et-surface);
}
.ps-compare-note { margin: 0; font-size: var(--et-text-meta); color: var(--et-muted); }
/* 版本区条目信息块(所属插件/作用/生效条件;registry 单一事实源直读) */
.ps-version-entry-info {
  display: flex; flex-direction: column; gap: 8px;
  padding: var(--et-space-3) var(--et-space-4); border-radius: var(--et-radius-md);
  background: var(--et-surface-2);
  border: 1px solid var(--et-border-soft);
}
.ps-entry-info-row { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 10px; align-items: baseline; }
.ps-entry-info-label { font-size: var(--et-text-meta); color: var(--et-muted); white-space: nowrap; }
.ps-entry-info-value {
  min-width: 0; font-size: var(--et-text-caption); line-height: 20px; color: var(--et-fg-2);
  overflow-wrap: anywhere;
}
.ps-entry-info-value [data-ps-pill] { margin-right: 8px; }
.ps-entry-info-note { color: var(--et-muted); }
.ps-compare-single { display: flex; flex-direction: column; gap: 6px; padding: var(--et-space-3) var(--et-space-4); border-radius: var(--et-radius-sm); background: var(--et-surface); border: 1px solid var(--et-border-soft); }
.ps-compare-single .ps-empty-inline { margin: 2px 0; }

/* 右栏:AI 助手(输入行纵向堆叠;无可编辑条目时 hint-box) */
.ps-ai-input-row { display: flex; flex-direction: column; align-items: stretch; gap: 8px; }
.ps-hint-box {
  display: grid; justify-items: center; gap: 8px; text-align: center;
  padding: 22px 16px; border: 1px dashed var(--et-border); border-radius: var(--et-radius-sm);
}
.ps-hint-box p { margin: 0; font-size: var(--et-text-caption); line-height: var(--et-leading-body); color: var(--et-muted); }
.ps-ai-panel [data-ps-ai-instruction] { flex: 1 1 auto; }
.ps-ai-panel [data-ps-ai-polish-btn],
.ps-ai-panel [data-ps-ai-review-btn] { align-self: stretch; }

/* R3 审批横幅(root 滚动容器顶部 sticky 常驻——position:fixed 会被宿主壳的
   transform 祖先劫持定位(2026-11-13 实测 top 跑飞),sticky 贴滚动容器顶边,
   任何滚动位置都可见可决) */
.ps-approval-layer {
  position: sticky; top: 12px; z-index: 40;
  max-width: 760px;
  margin: 0 0 12px;
}
.ps-approval-layer [data-t7-approval] {
  margin: 0; box-shadow: var(--et-shadow-raised);
  background: var(--et-surface); /* 不透明表面:sticky 悬浮层不得透出下层内容 */
}

/* —— 响应式(640px 断点单列自适应;布局本就单列,收边距与字号) —— */
@media (max-width: 640px) {
  [data-t7-studio-root], [data-t7-trace-root] { padding: var(--et-space-6) var(--et-space-4) var(--et-space-12); }
  [data-t7-heading] { font-size: var(--et-text-h3); line-height: var(--et-leading-tight); }
  [data-t7-stat-row] { gap: var(--et-space-5); }
  [data-ps-layer-group] { padding: var(--et-space-1) var(--et-space-4) var(--et-space-2); }
  [data-ps-entry-row] { margin: 0 -6px; padding: var(--et-space-3) 6px; }
  [data-ps-layer-group-hint] { display: none; }
}

/* —— 循环轨迹:会话列表 —— */
[data-t7-trace-pipeline] { margin: 0 0 16px; font-size: var(--et-text-meta); color: var(--et-muted); }
[data-t7-trace-pipeline-name] { font-weight: var(--et-weight-display); }
[data-t7-session-list] {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px;
  border: 0; padding: 0; background: none;
}
[data-t7-session-item] {
  width: 100%; display: flex; flex-direction: column; gap: 6px; text-align: left;
  padding: 16px; font: inherit; cursor: pointer; background: var(--et-surface); border: 1px solid var(--et-border-soft);
  border-radius: var(--et-radius-md);
  transition: border-color var(--et-motion-fast) var(--et-ease), background var(--et-motion-fast) var(--et-ease);
}
[data-t7-session-item]:last-child { border-bottom: 1px solid var(--et-border-soft); padding-bottom: 16px; }
[data-t7-session-item]:hover { border-color: var(--et-border); background: var(--et-surface-2); }
[data-t7-session-item]:hover [data-t7-session-id] { color: var(--et-accent); }
[data-t7-session-id] { font-size: var(--et-text-caption); font-weight: var(--et-weight-display); color: var(--et-fg); overflow-wrap: anywhere; }
[data-t7-session-metrics] {
  display: flex; gap: 14px; flex-wrap: wrap; font-size: var(--et-text-meta);
  color: var(--et-muted); font-variant-numeric: tabular-nums;
}
[data-t7-session-last] { font-size: var(--et-text-meta); color: var(--et-muted); }

/* —— 循环轨迹:轮次树 —— */
[data-t7-trace-toolbar] { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
[data-t7-trace-back] {
  padding: 5px 14px; font: inherit; font-size: var(--et-text-meta); cursor: pointer;
  color: var(--et-fg-2); background: transparent;
  border: 1px solid var(--et-border); border-radius: var(--et-radius-sm);
}
[data-t7-trace-back]:hover { background: var(--et-surface-2); color: var(--et-fg); }
[data-t7-trace-session-id] { font-size: var(--et-text-caption); font-weight: var(--et-weight-display); color: var(--et-fg); overflow-wrap: anywhere; }
[data-t7-trace-events] { font-size: var(--et-text-meta); color: var(--et-muted); }
[data-t7-trace-turns] { display: grid; grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); gap: 16px; align-items: start; }
[data-t7-trace-node] {
  border-radius: var(--et-radius-md); padding: 16px 18px;
  background: var(--et-surface);
  border: 1px solid var(--et-border-soft);
}
[data-t7-trace-node-head] { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
[data-t7-trace-turn] { font-size: var(--et-text-caption); font-weight: var(--et-weight-display); color: var(--et-fg); }
[data-t7-trace-duration] { font-size: var(--et-text-caption); font-variant-numeric: tabular-nums; color: var(--et-fg-2); }
[data-t7-trace-tokens] { font-size: var(--et-text-meta); font-variant-numeric: tabular-nums; color: var(--et-muted); }
[data-t7-turn-reason-badge] {
  font-size: var(--et-text-meta); padding: 2px 10px; border-radius: var(--et-radius-pill);
  color: var(--et-muted); background: var(--et-surface-2);
}
[data-t7-trace-node][data-t7-turn-reason='end_turn'] [data-t7-turn-reason-badge],
[data-t7-trace-node][data-t7-turn-reason='complete'] [data-t7-turn-reason-badge] {
  color: var(--et-success); background: color-mix(in oklab, var(--et-success), transparent 88%);
}
[data-t7-trace-node][data-t7-turn-reason='tool_use'] [data-t7-turn-reason-badge] {
  color: var(--et-accent); background: var(--et-accent-soft);
}
[data-t7-trace-node][data-t7-turn-reason='error'] [data-t7-turn-reason-badge],
[data-t7-trace-node][data-t7-turn-reason='aborted'] [data-t7-turn-reason-badge] {
  color: var(--et-danger); background: var(--et-danger-soft);
}
[data-t7-trace-tools] { display: flex; flex-direction: column; margin-top: 10px; }
[data-t7-trace-tool] {
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  padding: 8px 0; font-size: var(--et-text-meta); border-bottom: 1px solid var(--et-border-soft);
}
[data-t7-trace-tool]:last-child { border-bottom: 0; }
[data-t7-tool-name] { font-weight: var(--et-weight-display); color: var(--et-fg-2); }
[data-t7-tool-duration] { font-variant-numeric: tabular-nums; color: var(--et-muted); }
[data-t7-tool-args] { font-size: var(--et-text-caption); color: var(--et-muted); overflow-wrap: anywhere; }
[data-t7-trace-tool][data-t7-tool-error='true'] [data-t7-tool-name] { color: var(--et-danger); }
[data-t7-tool-error-name] {
  font-size: var(--et-text-caption); font-weight: var(--et-weight-display); padding: 1px 10px; border-radius: var(--et-radius-pill);
  color: var(--et-danger);
  background: color-mix(in srgb, var(--et-danger) 12%, transparent);
}
[data-t7-trace-approvals] { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
[data-t7-approval-point] {
  display: flex; align-items: baseline; gap: 12px; padding: var(--et-space-2) var(--et-space-3); border-radius: var(--et-radius-md);
  font-size: var(--et-text-meta);
  color: var(--et-warn);
  background: color-mix(in srgb, var(--et-warn) 10%, transparent);
}
[data-t7-approval-point-name] { font-weight: var(--et-weight-display); }
[data-t7-approval-point-time] { font-size: var(--et-text-meta); color: var(--et-muted); }

@media (prefers-reduced-motion: reduce) {
  [data-t7-studio-root] button,
  [data-t7-trace-root] button,
  [data-t7-studio-root] input,
  [data-t7-studio-root] textarea,
  [data-t7-studio-root] select { transition: none; }
}
@media (max-width: 1100px) {
  [data-t7-studio-root], [data-t7-trace-root] { padding: var(--et-space-8) var(--et-space-6) var(--et-space-12); }
  [data-ps-group-nav] { grid-template-columns: 1fr; }
  [data-t7-session-list] { grid-template-columns: 1fr; }
  [data-t7-trace-turns] { grid-template-columns: 1fr; }
  /* 三栏 → 两栏:库 + 编辑器同排,AI 助手整宽落底(左栏保持 320 与桌面同宽) */
  [data-ps-workspace] { grid-template-columns: 320px minmax(0, 1fr); }
  [data-ps-ai-panel] { grid-column: 1 / -1; }
  .ps-library-list { max-height: 420px; }
}
@media (max-width: 760px) {
  /* 两栏 → 单列:库/编辑器/AI 依次纵向堆叠 */
  [data-ps-workspace] { grid-template-columns: 1fr; }
  .ps-page-head { flex-direction: column; gap: var(--et-space-3); }
  .ps-page-actions { padding-top: 0; }
  .ps-compare-grid { grid-template-columns: 1fr; row-gap: 1px; }
}
@media (max-width: 640px) {
  [data-t7-studio-root], [data-t7-trace-root] { padding: var(--et-space-6) var(--et-space-4) 48px; }
  [data-t7-heading] { font-size: var(--et-text-h3); line-height: var(--et-leading-tight); }
}
@keyframes et-fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { [data-eterna-panel='root'], [data-eterna-usage-stats], [data-t7-studio-root], [data-t7-trace-root] { animation: none; } }

[data-eterna-usage-stats] {
  animation: et-fade-in var(--et-motion-base) var(--et-ease) both;
  box-sizing: border-box;
  width: 100%;
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-gutter: stable;
  max-width: none;
  margin: 0 auto;
  padding: 48px 48px 96px;
  color: var(--et-fg);
  font-family: var(--et-font-body);
  font-size: var(--et-text-body);
  font-weight: var(--et-weight-body);
  line-height: var(--et-leading-body);
}
[data-eterna-usage-stats] * { box-sizing: border-box; min-width: 0; }
[data-eterna-usage-stats] .us-head { display: flex; align-items: baseline; gap: var(--et-space-3); flex-wrap: wrap; margin: 0 0 var(--et-space-6); }
[data-eterna-usage-stats] .us-title { margin: 0; font-size: var(--et-text-h2); line-height: var(--et-leading-tight); font-weight: var(--et-weight-display); letter-spacing: var(--et-tracking-display); font-family: var(--et-font-display); }
[data-eterna-usage-stats] .us-scope { font-size: var(--et-text-caption); color: var(--et-muted); }
[data-eterna-usage-stats] .us-cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--et-space-4); margin-bottom: var(--et-space-8); }
[data-eterna-usage-stats] .us-card { padding: var(--et-space-5); border: 1px solid var(--et-border-soft); border-radius: var(--et-radius-md); box-shadow: var(--et-shadow-r1); background: var(--et-surface); }
[data-eterna-usage-stats] .us-kicker { font-size: var(--et-text-meta); line-height: var(--et-leading-snug); letter-spacing: var(--et-tracking-caps); color: var(--et-muted); margin-bottom: var(--et-space-1); }
[data-eterna-usage-stats] /* v4:字号只走阶梯,不做 vw 插值(阶梯外值一律打回) */
[data-eterna-usage-stats] .us-value { font-size: var(--et-text-h1); line-height: var(--et-leading-tight); font-weight: var(--et-weight-display); font-family: var(--et-font-display); font-variant-numeric: tabular-nums; color: var(--et-fg); white-space: nowrap; }

[data-eterna-panel='section-count'] {
  flex: none; padding: 2px 10px; border-radius: var(--et-radius-pill);
  font-size: var(--et-text-meta); font-weight: var(--et-weight-body); color: var(--et-fg-2);
  background: var(--et-surface-2); font-variant-numeric: tabular-nums;
}
[data-eterna-panel='section-actions'] { margin-left: auto; display: flex; align-items: center; gap: var(--et-space-2); flex: none; }
[data-eterna-panel='section-note'] { margin: calc(var(--et-space-3) * -1) 0 0; font-size: var(--et-text-caption); line-height: var(--et-leading-body); color: var(--et-muted); }

/* —— 按钮体系:ghost 描边(刷新/纠正/查看摘要/展开详情) —— */
[data-eterna-panel='refresh'],
[data-eterna-panel='portrait-correct'],
[data-eterna-panel='checkpoint-toggle'],
[data-eterna-panel='mem-pending-detail-toggle'] {
  flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  padding: 5px 12px; min-height: 32px; font: inherit; font-size: var(--et-text-caption); font-weight: var(--et-weight-body);
  white-space: nowrap; cursor: pointer;
  color: var(--et-fg-2); background: transparent;
  border: 1px solid var(--et-border); border-radius: var(--et-radius-sm);
  transition: border-color var(--et-motion-fast) var(--et-ease), color var(--et-motion-fast) var(--et-ease), background var(--et-motion-fast) var(--et-ease);
}
/* 纵向 flex(待审行卡)里的 ghost 钮不被 stretch 成整行宽 */
[data-eterna-panel='mem-pending-row'] > [data-eterna-panel='mem-pending-detail-toggle'] { align-self: flex-start; }
[data-eterna-panel='refresh']:hover:not(:disabled),
[data-eterna-panel='portrait-correct']:hover:not(:disabled),
[data-eterna-panel='checkpoint-toggle']:hover:not(:disabled),
[data-eterna-panel='mem-pending-detail-toggle']:hover:not(:disabled) { border-color: var(--et-fg-2); color: var(--et-fg); }
[data-eterna-panel='refresh']:disabled,
[data-eterna-panel='checkpoint-toggle']:disabled { opacity: 0.6; cursor: default; }

/* —— 实心 accent 钮(待审「记住」) —— */
[data-eterna-panel='mem-approve'] {
  flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 5px 14px; min-height: 32px; font: inherit; font-size: var(--et-text-caption); font-weight: var(--et-weight-display);
  white-space: nowrap; cursor: pointer;
  color: var(--et-accent-on); background: var(--et-accent-fill);
  border: 0; border-radius: var(--et-radius-sm);
  transition: background var(--et-motion-fast) var(--et-ease);
}
[data-eterna-panel='mem-approve']:hover:not(:disabled) { background: var(--et-accent-fill-hover); }
[data-eterna-panel='mem-approve']:disabled { opacity: 0.6; cursor: default; }

/* —— 文字链钮(显示全文;::after 扩大命中区) —— */
[data-eterna-panel='mem-expand'] {
  position: relative; margin-top: 6px; padding: 0; font: inherit; font-size: var(--et-text-meta); cursor: pointer;
  color: var(--et-accent); background: none; border: 0;
}
[data-eterna-panel='mem-expand']::after { content: ""; position: absolute; inset: -10px -8px; }
[data-eterna-panel='mem-expand']:hover { text-decoration: underline; text-underline-offset: 3px; }

/* —— 统一 focus 光圈 —— */
[data-eterna-panel='refresh']:focus-visible,
[data-eterna-panel='portrait-correct']:focus-visible,
[data-eterna-panel='checkpoint-toggle']:focus-visible,
[data-eterna-panel='mem-pending-detail-toggle']:focus-visible,
[data-eterna-panel='mem-approve']:focus-visible,
[data-eterna-panel='mem-expand']:focus-visible,
[data-eterna-panel='prompt-copy']:focus-visible,
[data-eterna-panel='chip']:focus-visible,
[data-eterna-panel='mem-pending-actions'] button:focus-visible { outline: none; box-shadow: var(--et-focus-ring); }

/* —— 服务状态卡片 —— */
[data-eterna-panel='cards'] { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: var(--et-space-4); }
[data-eterna-panel='card'] {
  display: flex; flex-direction: column; gap: var(--et-space-3); min-width: 0;
  padding: var(--et-space-5); border: 1px solid var(--et-border-soft); border-radius: var(--et-radius-md);
  background: var(--et-surface);
}
[data-eterna-panel='card-kicker'] { font-size: var(--et-text-body); line-height: var(--et-leading-snug); font-weight: var(--et-weight-display); color: var(--et-fg); }
[data-eterna-panel='card-count'] { color: var(--et-meta); font-weight: var(--et-weight-body); }
[data-eterna-panel='tile-row'] { display: flex; align-items: flex-start; gap: var(--et-space-8); flex-wrap: wrap; }
[data-eterna-panel='metric'] { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
[data-eterna-panel='metric-value'] { display: block; font-size: var(--et-text-h2); line-height: 1.15; font-weight: var(--et-weight-display); font-variant-numeric: tabular-nums; letter-spacing: 0; color: var(--et-fg); }
[data-eterna-panel='metric-label'] { display: block; font-size: var(--et-text-meta); line-height: var(--et-leading-snug); color: var(--et-muted); }
[data-eterna-panel='kv'] { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; align-items: center; }
[data-eterna-panel='kv-key'] { font-size: var(--et-text-caption); line-height: var(--et-leading-snug); color: var(--et-muted); }
[data-eterna-panel='kv-value'] { font-size: var(--et-text-caption); line-height: var(--et-leading-snug); color: var(--et-fg-2); overflow-wrap: anywhere; }
[data-eterna-panel='status-pill'] {
  display: inline-flex; align-items: center; padding: 2px 10px; border-radius: var(--et-radius-pill);
  font-size: var(--et-text-meta); font-weight: var(--et-weight-body); white-space: nowrap;
}
[data-eterna-panel-status='ok'] { color: var(--et-success); background: color-mix(in oklab, var(--et-success), transparent 88%); }
[data-eterna-panel-status='error'] { color: var(--et-danger); background: var(--et-danger-soft); }
[data-eterna-panel-status='not-mounted'] { color: var(--et-muted); background: var(--et-surface-2); }

/* —— 记忆子卡共享骨架(待审/画像/功能域/指标) —— */
[data-eterna-panel='mem-pending'],
[data-eterna-panel='portrait'],
[data-eterna-panel='domain-browse'],
[data-eterna-panel='mem-metrics'] {
  display: flex; flex-direction: column; gap: var(--et-space-3); min-width: 0;
  padding: var(--et-space-5); border: 1px solid var(--et-border-soft); border-radius: var(--et-radius-md);
  background: var(--et-surface);
}
[data-eterna-panel='mem-pending-head'] {
  display: flex; align-items: center; gap: var(--et-space-2); min-width: 0;
  padding-bottom: var(--et-space-3); border-bottom: 1px solid var(--et-border-soft);
}
[data-eterna-panel='mem-pending-title'] { display: inline-flex; align-items: center; gap: var(--et-space-2); min-width: 0; font-size: var(--et-text-caption); font-weight: var(--et-weight-display); color: var(--et-fg); }
[data-eterna-panel='sub-icon'] { display: inline-flex; flex: none; color: var(--et-fg-2); }
[data-eterna-panel='mem-pending-count'],
[data-eterna-panel='portrait-version'] {
  flex: none; margin-left: auto; padding: 2px 10px; border-radius: var(--et-radius-pill);
  font-size: var(--et-text-meta); font-weight: var(--et-weight-body); color: var(--et-fg-2);
  background: var(--et-surface-2); font-variant-numeric: tabular-nums;
}
[data-eterna-panel='mem-pending-hint'] { margin: 0; font-size: var(--et-text-caption); line-height: var(--et-leading-snug); color: var(--et-muted); }

/* —— 待审记忆队列(危险色调卡 + surface 行卡;审批闭环) —— */
[data-eterna-panel='mem-pending'] {
  background: var(--et-danger-soft);
  border-color: color-mix(in oklab, var(--et-danger), transparent 75%);
}
[data-eterna-panel='mem-pending'] [data-eterna-panel='mem-pending-head'] { border-bottom-color: color-mix(in oklab, var(--et-danger), transparent 80%); }
[data-eterna-panel='mem-pending'] [data-eterna-panel='mem-pending-count'] { color: var(--et-danger); background: color-mix(in oklab, var(--et-danger), transparent 86%); }
[data-eterna-panel='mem-pending-row'] {
  display: flex; flex-direction: column; gap: var(--et-space-2); min-width: 0;
  padding: var(--et-space-3) var(--et-space-4);
  background: var(--et-surface);
  border: 1px solid var(--et-border-soft); border-radius: var(--et-radius-md);
}
[data-eterna-panel='mem-pending-top'] { display: flex; align-items: center; gap: var(--et-space-2); flex-wrap: wrap; }
[data-eterna-panel='mem-entity-key'] {
  display: inline-block; max-width: 100%; padding: 2px 8px; border-radius: var(--et-radius-sm);
  background: var(--et-surface-2); font-family: var(--et-font-mono); font-size: var(--et-text-meta);
  font-weight: var(--et-weight-display); color: var(--et-fg-2); overflow-wrap: anywhere;
}
[data-eterna-panel='mem-pending-compaction'] {
  flex: none; padding: 2px 10px; border-radius: var(--et-radius-pill);
  font-size: var(--et-text-meta); color: var(--et-accent); background: var(--et-accent-soft);
}
[data-eterna-panel='mem-pending-meta'] {
  display: flex; flex-wrap: wrap; row-gap: 2px; min-width: 0;
  font-size: var(--et-text-meta); color: var(--et-meta); font-variant-numeric: tabular-nums;
}
[data-eterna-panel='mem-pending-meta'] > * + *::before { content: '·'; margin: 0 var(--et-space-2); }
[data-eterna-panel='mem-pending-error'] { font-size: var(--et-text-caption); color: var(--et-danger); overflow-wrap: anywhere; }
[data-eterna-panel='mem-pending-actions'] { display: flex; align-items: center; justify-content: flex-end; gap: var(--et-space-2); margin-top: var(--et-space-1); }
[data-eterna-panel='mem-pending-actions'] button.eterna-panel-danger {
  color: var(--et-fg-2); background: transparent;
  border: 1px solid var(--et-border); border-radius: var(--et-radius-sm);
  transition: border-color var(--et-motion-fast) var(--et-ease), background var(--et-motion-fast) var(--et-ease), color var(--et-motion-fast) var(--et-ease);
}
[data-eterna-panel='mem-pending-actions'] button.eterna-panel-danger:hover:not(:disabled) { border-color: var(--et-danger); color: var(--et-danger); }
[data-eterna-panel='mem-pending-actions'] button.eterna-panel-danger.is-armed {
  border-color: var(--et-danger); color: var(--et-accent-on); background: var(--et-danger);
}
[data-eterna-panel='mem-pending-actions'] button:disabled { opacity: 0.6; cursor: default; }

/* —— 记忆条目(分组列表) —— */
[data-eterna-panel='mem-group'] {
  border-radius: var(--et-radius-md); padding: var(--et-space-2) var(--et-space-5) var(--et-space-3);
  background: var(--et-surface); border: 1px solid var(--et-border-soft);
}
[data-eterna-panel='mem-group'] + [data-eterna-panel='mem-group'] { margin-top: var(--et-space-4); }
[data-eterna-panel='mem-subject'] {
  display: flex; align-items: center; gap: var(--et-space-2); min-width: 0;
  padding: var(--et-space-3) 0 var(--et-space-2); font-size: var(--et-text-caption); font-weight: var(--et-weight-display);
  color: var(--et-fg); border-bottom: 1px solid var(--et-border-soft);
}
[data-eterna-panel='mem-count'] { margin-left: auto; flex: none; font-size: var(--et-text-meta); font-weight: var(--et-weight-body); color: var(--et-meta); font-variant-numeric: tabular-nums; }
[data-eterna-panel='mem-group-desc'] { margin: var(--et-space-2) 0 0; font-size: var(--et-text-caption); line-height: var(--et-leading-snug); color: var(--et-muted); }
[data-eterna-panel='mem-entity'] { padding: var(--et-space-3) 0; border-bottom: 1px solid var(--et-border-soft); }
[data-eterna-panel='mem-entity']:last-child { border-bottom: 0; padding-bottom: var(--et-space-1); }
[data-eterna-panel='mem-entity-head'] { display: flex; align-items: center; gap: var(--et-space-2); min-width: 0; margin-bottom: var(--et-space-2); }
[data-eterna-panel='mem-entity-time'] { margin-left: auto; flex: none; font-size: var(--et-text-meta); color: var(--et-meta); font-variant-numeric: tabular-nums; white-space: nowrap; }
[data-eterna-panel='mem-entity-content'] { font-size: var(--et-text-caption); line-height: var(--et-leading-snug); color: var(--et-fg); white-space: pre-wrap; overflow-wrap: anywhere; }
[data-eterna-panel='mem-entity-content'][data-eterna-panel-clamped='true'] {
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}

/* —— 你的画像(2 列分节栅格;窄容器降 1 列) —— */
[data-eterna-panel='portrait-grid'] { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--et-space-4) var(--et-space-8); }
[data-eterna-panel='portrait-section'] { display: flex; flex-direction: column; gap: var(--et-space-2); min-width: 0; padding-top: var(--et-space-2); border-top: 1px dashed var(--et-border-soft); }
[data-eterna-panel='portrait-section-head'] { display: flex; align-items: center; gap: var(--et-space-3); min-width: 0; }
[data-eterna-panel='portrait-section-title'] { font-size: var(--et-text-caption); font-weight: var(--et-weight-display); color: var(--et-fg-2); }
[data-eterna-panel='portrait-correct'] { margin-left: auto; }
[data-eterna-panel='portrait-line'] { font-size: var(--et-text-caption); line-height: var(--et-leading-snug); color: var(--et-fg-2); overflow-wrap: anywhere; }
[data-eterna-panel='portrait-line'][data-eterna-panel-portrait-empty='true'] { color: var(--et-meta); }
[data-eterna-panel='portrait-corrected'] { font-size: var(--et-text-meta); color: var(--et-success); }

/* —— 功能域(行卡:label + 状态 pill + 计数 chips) —— */
[data-eterna-panel='domain-row'] {
  display: flex; align-items: center; gap: var(--et-space-2); flex-wrap: wrap; min-width: 0;
  padding: var(--et-space-2) 0; border-bottom: 1px solid var(--et-border-soft);
}
[data-eterna-panel='domain-row']:last-child { border-bottom: 0; }
[data-eterna-panel='domain-label'] { display: inline-flex; align-items: center; gap: var(--et-space-2); min-width: 0; max-width: 100%; font-size: var(--et-text-caption); font-weight: var(--et-weight-display); color: var(--et-fg); }
[data-eterna-panel='domain-name'] { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
[data-eterna-panel='domain-candidate-flag'] {
  flex: none; padding: 1px 8px; border-radius: var(--et-radius-pill);
  font-size: var(--et-text-meta); font-weight: var(--et-weight-body);
  color: var(--et-muted); background: var(--et-surface-2);
}
[data-eterna-panel='domain-meta'] {
  margin-left: auto; display: flex; align-items: center; gap: var(--et-space-1); flex-wrap: wrap;
  font-size: var(--et-text-meta); color: var(--et-muted); font-variant-numeric: tabular-nums;
}
[data-eterna-panel='domain-stat'] { padding: 2px 8px; border-radius: var(--et-radius-sm); background: var(--et-surface-2); color: var(--et-fg-2); }
[data-eterna-panel='domain-pending'] { padding: 2px 8px; border-radius: var(--et-radius-sm); color: var(--et-warn); background: color-mix(in oklab, var(--et-warn), transparent 88%); }

/* —— 记忆指标(stat tile 栅格) —— */
[data-eterna-panel='mem-metrics-grid'] { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--et-space-2); font-variant-numeric: tabular-nums; }
[data-eterna-panel='mem-metrics-grid'] [data-eterna-panel='metric'] { padding: var(--et-space-3); background: var(--et-surface-2); border-radius: var(--et-radius-sm); }
[data-eterna-panel='mem-metrics-grid'] [data-eterna-panel='metric-value'] { font-size: var(--et-text-lead); line-height: 1.2; }
[data-eterna-panel='mem-metrics-grid'] [data-eterna-panel='metric'][data-eterna-panel-muted='true'] [data-eterna-panel='metric-value'] { color: var(--et-meta); font-weight: var(--et-weight-body); }
[data-eterna-panel='mem-metrics-grid'] [data-eterna-panel='metric-label'] { font-size: var(--et-text-meta); line-height: var(--et-leading-snug); color: var(--et-muted); }

/* —— 工具清单 —— */
[data-eterna-panel='card'][data-eterna-panel-card='event-tools'] { grid-column: 1 / -1; }
[data-eterna-panel='tool-list'] { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
[data-eterna-panel='tool'] {
  display: flex; align-items: flex-start; gap: var(--et-space-4);
  padding: var(--et-space-3) 0; border-bottom: 1px solid var(--et-border-soft);
}
[data-eterna-panel='tool']:last-child { border-bottom: 0; }
[data-eterna-panel='tool-head'] { display: flex; flex-direction: column; gap: 1px; flex: none; width: 220px; }
[data-eterna-panel='tool-label'] { font-size: var(--et-text-caption); line-height: var(--et-leading-snug); font-weight: var(--et-weight-display); color: var(--et-fg); }
[data-eterna-panel='tool-id'] { font-size: var(--et-text-caption); color: var(--et-meta); overflow-wrap: anywhere; font-family: var(--et-font-mono); }
[data-eterna-panel='tool-desc'] { flex: 1; font-size: var(--et-text-caption); line-height: var(--et-leading-snug); color: var(--et-fg-2); }
[data-eterna-panel='risk'] {
  flex: none; align-self: center; margin-left: auto;
  font-size: var(--et-text-caption); font-weight: var(--et-weight-display); line-height: var(--et-leading-snug); padding: 2px 8px;
  border-radius: var(--et-radius-sm);
}
[data-eterna-panel-risk='R3'] { color: var(--et-danger); background: var(--et-danger-soft); }
[data-eterna-panel-risk='R2'] { color: var(--et-warn); background: color-mix(in oklab, var(--et-warn), transparent 88%); }
[data-eterna-panel-risk='R1'] { color: var(--et-muted); background: var(--et-surface-2); }

/* —— 三步上手(并入指南区;数字方块步骤条) —— */
[data-eterna-panel='steps'] {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--et-space-4);
  margin: 0; padding: var(--et-space-4); background: var(--et-surface-2); border: 0; border-radius: var(--et-radius-md);
}
[data-eterna-panel='step'] { display: flex; align-items: flex-start; gap: var(--et-space-2); min-width: 0; }
[data-eterna-panel='step-no'] {
  flex: none; width: 26px; height: 26px; display: grid; place-items: center;
  border: 1px solid var(--et-border); border-radius: var(--et-radius-sm); background: var(--et-surface);
  font-size: var(--et-text-caption); font-weight: var(--et-weight-display); color: var(--et-fg-2); font-variant-numeric: tabular-nums;
}
[data-eterna-panel='step-text'] { font-size: var(--et-text-caption); line-height: var(--et-leading-snug); color: var(--et-fg-2); padding-top: 3px; }

/* —— 操作指引(示例卡;320px 下限避免宽屏出现过多窄列) —— */
[data-eterna-panel-section='guide'] [data-eterna-panel='cards'] { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
[data-eterna-panel='prompt'] {
  display: flex; flex-direction: column; gap: 6px; min-width: 0;
  padding: var(--et-space-4); border-radius: var(--et-radius-md);
  background: var(--et-surface); border: 1px solid var(--et-border-soft);
}
[data-eterna-panel='prompt-head'] { display: flex; align-items: center; gap: var(--et-space-2); flex-wrap: wrap; min-width: 0; }
[data-eterna-panel='prompt-title'] { font-size: var(--et-text-caption); font-weight: var(--et-weight-display); color: var(--et-fg); }
[data-eterna-panel='prompt-capability'] { font-size: var(--et-text-meta); color: var(--et-muted); }
[data-eterna-panel='prompt-copy'] {
  position: relative; margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px; font: inherit; font-size: var(--et-text-meta); font-weight: var(--et-weight-body); cursor: pointer;
  white-space: nowrap; color: var(--et-accent); background: var(--et-accent-soft);
  border: 0; border-radius: var(--et-radius-sm);
  transition: background var(--et-motion-fast) var(--et-ease);
}
[data-eterna-panel='prompt-copy']:hover { background: color-mix(in oklab, var(--et-accent), transparent 82%); }
[data-eterna-panel='prompt-text'] { margin: 0; font-size: var(--et-text-caption); line-height: var(--et-leading-snug); color: var(--et-fg-2); overflow-wrap: anywhere; }
[data-eterna-panel='prompt-note'] { margin: 0; font-size: var(--et-text-caption); line-height: var(--et-leading-snug); color: var(--et-danger); }

/* —— 用量观测(单卡行列表;id 单行省略) —— */
[data-eterna-panel='session-list'] {
  display: flex; flex-direction: column; min-width: 0;
  padding: var(--et-space-1) var(--et-space-5);
  background: var(--et-surface); border: 1px solid var(--et-border-soft); border-radius: var(--et-radius-md);
}
[data-eterna-panel='session'] { display: flex; flex-direction: column; gap: var(--et-space-2); min-width: 0; padding: var(--et-space-3) 0; border-bottom: 1px solid var(--et-border-soft); }
[data-eterna-panel='session']:last-child { border-bottom: 0; }
[data-eterna-panel='session-id'] {
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-family: var(--et-font-mono); font-size: var(--et-text-meta); color: var(--et-fg-2);
}
[data-eterna-panel='session-metrics'] { display: flex; gap: var(--et-space-1); flex-wrap: wrap; }
[data-eterna-panel='session-metrics'] > span {
  padding: 2px 8px; border-radius: var(--et-radius-sm); background: var(--et-surface-2);
  font-size: var(--et-text-meta); color: var(--et-muted); font-variant-numeric: tabular-nums;
}
[data-eterna-panel='session-metrics'] > [data-eterna-panel='cache-hit-rate'] { color: var(--et-accent); background: var(--et-accent-soft); }
[data-eterna-panel='session-last'] { font-size: var(--et-text-meta); color: var(--et-meta); font-variant-numeric: tabular-nums; }

/* —— 上下文压缩 checkpoint —— */
[data-eterna-panel-card='checkpoint'] [data-eterna-panel='kv'] { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); align-items: first baseline; }
[data-eterna-panel='checkpoint-summary'] { margin: var(--et-space-2) 0 0; padding: var(--et-space-3); border: 1px solid var(--et-border-soft); border-radius: var(--et-radius-sm); background: var(--et-surface-2); font-family: var(--et-font-mono, var(--et-font-body)); font-size: var(--et-text-caption); line-height: var(--et-leading-snug); white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow: auto; }

/* —— 占位/错误 —— */
[data-eterna-panel='placeholder'] { font-size: var(--et-text-caption); color: var(--et-muted); }
[data-eterna-panel='placeholder'][data-eterna-panel-error='true'] { color: var(--et-danger); overflow-wrap: anywhere; }

/* —— chips(conversation.input.dock:composer 卡上方整宽常驻条) ——
   几何与官方 GoalBar/TodoPanel 同式:两侧让出 side-clearance,dock 内缩 4 个
   dock-inset,上限跟随 composer 卡宽;宿主变量缺席时按同值兜底(独立宿主仍可用,
   不给宿主留像素依赖)。容器查询按条自身宽度降级:窄条先省略再隐藏 label,
   chips 自动换行,任何宽度都不越出卡片/视口(2026-11-17 溢出修复)。 */
[data-eterna-panel='chips'] {
  box-sizing: border-box;
  flex: none;
  width: calc(100% - 2 * var(--dsh-composer-side-clearance, 16px) - 4 * var(--dsh-composer-dock-inset, 8px));
  max-width: calc(var(--dsh-composer-card-max-width, 952px) - 4 * var(--dsh-composer-dock-inset, 8px));
  margin: 0 auto;
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--et-space-2);
  padding: 6px var(--et-space-3);
  border: 1px solid var(--et-border-soft); border-radius: var(--et-radius-md);
  background: var(--et-surface);
  container-type: inline-size;
}
[data-eterna-panel='chips-label'] {
  flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: var(--et-text-meta); color: var(--et-muted);
}
[data-eterna-panel='chip'] {
  position: relative; flex: 0 0 auto; padding: 5px 12px; font: inherit; font-size: var(--et-text-meta);
  line-height: var(--et-leading-snug); cursor: pointer; white-space: nowrap;
  color: var(--et-accent);
  background: var(--et-accent-soft);
  border: 0; border-radius: var(--et-radius-sm);
  transition: background var(--et-motion-fast) var(--et-ease);
}
[data-eterna-panel='chip']::after { content: ""; position: absolute; inset: -5px -4px; }
[data-eterna-panel='chip']:hover:not(:disabled) { background: color-mix(in oklab, var(--et-accent), transparent 82%); }
[data-eterna-panel='chip']:disabled { opacity: 0.45; cursor: default; }
@container (max-width: 680px) {
  /* 条内容宽 < 680px 时 label(约 217px)+ 4 chips(约 470px)+ 间距(约 40px)
     放不下一行:先牺牲说明文字换单行,chips 保持一眼可点(1080 窗条内容宽
     实测 634px → 隐藏;1440 窗 716px → 显示且单行)。label 的完整语义仍在
     toolbar 的 aria-label 里。 */
  [data-eterna-panel='chips-label'] { display: none; }
}

/* —— 容器断点(面板嵌在宿主窄列时按容器宽度降级;不依赖视口) —— */
@container eterna-panel (max-width: 900px) {
  [data-eterna-panel='portrait-grid'] { grid-template-columns: 1fr; }
  [data-eterna-panel='domain-meta'] { margin-left: 0; }
}
@container eterna-panel (max-width: 760px) {
  [data-eterna-panel='root'] { padding: 32px 20px 64px; }
  [data-eterna-panel='steps'] { grid-template-columns: 1fr; gap: var(--et-space-4); }
  [data-eterna-panel='tool'] { flex-direction: column; gap: 6px; }
  [data-eterna-panel='tool-head'] { width: auto; }
  [data-eterna-panel='risk'] { align-self: flex-start; margin-left: 0; }
}
@container eterna-panel (max-width: 640px) {
  [data-eterna-panel='root'] { padding: 24px 16px 48px; }
  [data-eterna-panel='heading'] { font-size: var(--et-text-h3); }
  [data-eterna-panel='steps'] { grid-template-columns: 1fr; gap: var(--et-space-4); }
  [data-eterna-panel='cards'] { grid-template-columns: 1fr; }
  [data-eterna-panel='card'] { padding: var(--et-space-4); }
  [data-eterna-panel='tile-row'] { gap: var(--et-space-6); }
}

/* —— 视口断点(容器查询不可用时的兜底) —— */
@media (max-width: 760px) {
  [data-eterna-panel='root'] { padding: 32px 20px 64px; }
  [data-eterna-panel='steps'] { grid-template-columns: 1fr; gap: var(--et-space-4); }
  [data-eterna-panel='tool'] { flex-direction: column; gap: 6px; }
  [data-eterna-panel='tool-head'] { width: auto; }
  [data-eterna-panel='risk'] { align-self: flex-start; margin-left: 0; }
}
@media (max-width: 640px) {
  [data-eterna-panel='root'] { padding: 24px 16px 48px; }
  [data-eterna-panel='heading'] { font-size: var(--et-text-h3); }
  [data-eterna-panel='steps'] { grid-template-columns: 1fr; gap: var(--et-space-4); }
  [data-eterna-panel='cards'] { grid-template-columns: 1fr; }
  [data-eterna-panel='card'] { padding: var(--et-space-4); }
  [data-eterna-panel='tile-row'] { gap: var(--et-space-6); }
}
@media (prefers-reduced-motion: reduce) {
  [data-eterna-panel='refresh'], [data-eterna-panel='chip'],
  [data-eterna-panel='portrait-correct'], [data-eterna-panel='checkpoint-toggle'],
  [data-eterna-panel='mem-pending-detail-toggle'], [data-eterna-panel='mem-approve'],
  [data-eterna-panel='prompt-copy'] { transition: none; }
}
@keyframes et-fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { [data-eterna-panel='root'], [data-eterna-usage-stats], [data-t7-studio-root], [data-t7-trace-root] { animation: none; } }

[data-eterna-access-root] { width: 100%; font-family: var(--et-font-body); font-size: var(--et-text-body); font-weight: var(--et-weight-body); line-height: var(--et-leading-body); color: var(--et-fg); max-width: none; }
[data-eterna-access-root], [data-eterna-access-root] *, [data-eterna-access-root] *::before, [data-eterna-access-root] *::after { box-sizing: border-box; }
[data-eterna-access-root] * { min-width: 0; overflow-wrap: anywhere; }
[data-eterna-access-root] .ea-lead { margin: 0 0 16px; color: var(--et-muted); font-size: var(--et-text-caption); }
[data-eterna-access-root] .ea-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--et-space-4); }
/* v4 §6:设置卡片 = lg(22) + r1 阴影 + space-5 内距(卡片是最外层容器,圆弧最大) */
[data-eterna-access-root] .ea-card { border: 1px solid var(--et-border-soft); border-radius: var(--et-radius-lg); padding: var(--et-space-5);
  background: var(--et-surface); box-shadow: var(--et-shadow-r1); }
[data-eterna-access-root] .ea-card.ea-card-wide { grid-column: 1 / -1; }

/* 设置弹窗:所有分区共用同一固定尺寸,切换页面不再伸缩;导航 200 固定,
   内容区保留单一纵向滚动轴(滚动条常驻槽位,避免切换时宽度抖动)。 */
@media (min-width: 760px) {
  [data-shortcut-modal="settings"] {
    --ea-settings-width: 880px;
    --ea-settings-height: 720px;
    --ea-settings-inset: 48px;
    width: min(var(--ea-settings-width), calc(100vw - var(--ea-settings-inset))) !important;
    max-width: min(var(--ea-settings-width), calc(100vw - var(--ea-settings-inset))) !important;
    height: min(var(--ea-settings-height), calc(100vh - 2 * max(24px, var(--dsh-frame-overlay-top, 24px)))) !important;
    height: min(var(--ea-settings-height), calc(100dvh - 2 * max(24px, var(--dsh-frame-overlay-top, 24px)))) !important;
    max-height: min(var(--ea-settings-height), calc(100vh - 2 * max(24px, var(--dsh-frame-overlay-top, 24px)))) !important;
    max-height: min(var(--ea-settings-height), calc(100dvh - 2 * max(24px, var(--dsh-frame-overlay-top, 24px)))) !important;
    grid-template-columns: 200px minmax(0, 1fr) !important;
  }
}

/* 内容区滚动条:细、圆角、随主题取 24% 前景色;轨道透明,稳定占位。 */
[data-shortcut-modal="settings"] > [class$="_options"] {
  scrollbar-gutter: stable;
  scrollbar-width: thin;
  scrollbar-color: color-mix(in oklab, var(--et-fg) 24%, transparent) transparent;
  overscroll-behavior: contain;
}
[data-shortcut-modal="settings"] > [class$="_options"]::-webkit-scrollbar {
  width: 12px;
  height: 12px;
}
[data-shortcut-modal="settings"] > [class$="_options"]::-webkit-scrollbar-track {
  background: transparent;
}
[data-shortcut-modal="settings"] > [class$="_options"]::-webkit-scrollbar-thumb {
  border: 3px solid transparent;
  border-radius: var(--et-radius-pill);
  background: color-mix(in oklab, var(--et-fg) 24%, transparent);
  background-clip: content-box;
}
[data-shortcut-modal="settings"] > [class$="_options"]::-webkit-scrollbar-thumb:hover {
  background: color-mix(in oklab, var(--et-fg) 40%, transparent);
  background-clip: content-box;
}
[data-eterna-access-root] .ea-card h3 { margin: 0 0 var(--et-space-2); font-size: var(--et-text-body); font-weight: var(--et-weight-display); letter-spacing: 0; }
[data-eterna-access-root] label.ea-label { display: block; font-size: var(--et-text-meta); color: var(--et-fg-2); margin: var(--et-space-3) 0 var(--et-space-1); }
[data-eterna-access-root] input.ea-input, [data-eterna-access-root] select.ea-input {
  /* v4 §6:输入 = surface-3 凹槽底 + sm(12) + 高 40 + 15px 正文(13px 输入框偏小) */

[data-eterna-access-root] .ea-btn:disabled { opacity: .5; cursor: not-allowed; }

[data-eterna-access-root] .ea-btn-danger { background: transparent; color: var(--et-danger); border-color: color-mix(in oklab, var(--et-danger), transparent 70%); }
[data-eterna-access-root] .ea-btn-danger:hover:not(:disabled) { background: var(--et-danger-soft); }

[data-eterna-access-root] .ea-hint { color: var(--et-muted); font-size: var(--et-text-meta); line-height: var(--et-leading-body); }

[data-eterna-access-root] .ea-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

/* 工作区行「+ 新建会话」常驻(2026-11-12 用户反馈:hover-only 发现性差=「不见了」;
   上游 Rows.tsx 的 rowActions 由 CSS hover 显隐,access 全局样式强制可见) */
[data-row-key^="workspace:"] button[aria-label*="新建会话"] {
  opacity: 1 !important;
  visibility: visible !important;
  pointer-events: auto !important;
}

/* 思考强度滑杆(2026-11-12,ZCode composer-thought-slider 同构):
   原生 range 透明叠加在可视轨道上——track/thumb 全透,确保首尾档位与
   点击/拖动坐标对齐;交互事件由组件层 stopPropagation。 */
.et-thought-slider {
  position: relative;
  height: 32px;
}
.et-thought-slider[data-disabled="true"] {
  opacity: 0.5;
}
.et-thought-slider:has(input:focus-visible) {
  outline: 2px solid var(--et-accent-soft);
  outline-offset: 2px;
}
.et-thought-range {
  position: absolute;
  inset: 0;
  margin: 0;
  width: 100%;
  height: 32px;
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
  background: transparent;
  outline: none;
}
.et-thought-range[aria-disabled="true"] {
  cursor: default;
}
.et-thought-range::-webkit-slider-runnable-track {
  height: 32px;
  background: transparent;
}
.et-thought-range::-webkit-slider-thumb {
  appearance: none;
  -webkit-appearance: none;
  width: 28px;
  height: 28px;
  margin-top: 2px;
  border: 0;
  border-radius: 50%;
  background: transparent;
}
.et-thought-range::-moz-range-track {
  height: 32px;
  background: transparent;
}
.et-thought-range::-moz-range-thumb {
  width: 28px;
  height: 28px;
  border: 0;
  border-radius: 50%;
  background: transparent;
}
.et-thought-range::-moz-range-progress {
  background: transparent;
}

/* max 档气泡流动(ZCode composer-thought-bubbles 同构,白色小圆自右向左漂) */
.et-thought-bubble {
  opacity: 0;
  animation: et-thought-bubble-flow linear infinite;
}
@keyframes et-thought-bubble-flow {
  0% { transform: translateX(104%); opacity: 0; }
  15%, 80% { opacity: 0.4; }
  100% { transform: translateX(-4%); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .et-thought-slider * {
    transition: none !important;
  }
  .et-thought-bubble {
    animation: none !important;
    opacity: 0 !important;
  }
}

/* 模型菜单思考偏置行(2026-11-18 V2):chip 显示本会话有效偏置 + 「重置」两击确认。
   菜单根挂在 document.body(不在 [data-eterna-access-root] 内),故全局类名;
   全 --et-* 令牌,深浅主题经桥接自动跟随。 */
.ea-bias-chip {
  flex-shrink: 0;
  font-size: var(--et-text-meta);
  line-height: 20px;
  font-weight: var(--et-weight-emphasis);
  padding: 1px 10px;
  border-radius: var(--et-radius-pill);
  border: 1px solid var(--et-border);
  background: var(--et-surface-2);
  color: var(--et-muted);
  white-space: nowrap;
}
/* 自动选档关闭时的可见说明(偏置此时不参与判档;不再只藏在 title 里)。 */
.ea-bias-hint { font-size: var(--et-text-meta); color: var(--et-muted); white-space: nowrap; }
/* 调深=偏高档(slider 高档侧 accent);调浅=偏低档(success) */
.ea-bias-chip[data-sign='up'] {
  background: var(--et-accent-soft);
  border-color: var(--et-accent);
  color: var(--et-accent);
}
.ea-bias-chip[data-sign='down'] {
  background: color-mix(in oklab, var(--et-success), transparent 88%);
  border-color: var(--et-success);
  color: var(--et-success);
}
.ea-bias-reset {
  font: inherit;
  font-size: var(--et-text-caption);
  line-height: 20px;
  /* 触控目标 ≥36px(frontend-style.md);内联 padding 让按钮在偏置行里不显臃肿 */
  min-height: 36px;
  padding: 0 12px;
  display: inline-flex;
  align-items: center;
  border-radius: var(--et-radius-pill);
  border: 1px solid var(--et-border-soft);
  background: transparent;
  color: var(--et-muted);
  cursor: pointer;
  white-space: nowrap;
  transition: color var(--et-motion-fast) var(--et-ease), border-color var(--et-motion-fast) var(--et-ease);
}
.ea-bias-reset:hover:not(:disabled) { color: var(--et-fg); border-color: var(--et-border); }
.ea-bias-reset:focus-visible { outline: none; box-shadow: var(--et-focus-ring); }
.ea-bias-reset:disabled { opacity: 0.6; cursor: default; }
.ea-bias-reset-armed { color: var(--et-danger); border-color: var(--et-danger); }
/* armed 态必须压过 :hover(首击后鼠标仍停在按钮上,否则红色确认态被 hover 色盖掉) */
.ea-bias-reset-armed:hover:not(:disabled) { color: var(--et-danger); border-color: var(--et-danger); }
.ea-bias-error { font-size: var(--et-text-meta); color: var(--et-danger); min-width: 0; }
@media (prefers-reduced-motion: reduce) {
  .ea-bias-reset { transition: none; }
}

e" aria-hidden="true"><path d="M2.33203 10.4054V13.1681C2.33229 13.444 2.55605 13.6681 2.83203 13.6681H5.49512V14.6681H2.83203C2.00376 14.6681 1.33229 13.9963 1.33203 13.1681V10.4054H2.33203ZM14.6689 13.1681C14.6687 13.996 13.9968 14.6676 13.1689 14.6681H10.4951V13.6681H13.1689C13.4445 13.6676 13.6687 13.4437 13.6689 13.1681V10.4054H14.6689V13.1681ZM13.1689 1.33118C13.9969 1.33163 14.6688 2.00315 14.6689 2.83118V5.4054H13.6689V2.83118C13.6688 2.55544 13.4446 2.33162 13.1689 2.33118H10.4951V1.33118H13.1689ZM5.49512 2.33118H2.83203C2.55598 2.33118 2.33218 2.55516 2.33203 2.83118V5.4054H1.33203V2.83118C1.33218 2.00288 2.00369 1.33118 2.83203 1.33118H5.49512V2.33118Z" fill="currentColor"></path></svg></button><button type="button" class="P3OORG_iconButton" aria-label="收起右侧边栏" aria-keyshortcuts="Shift+Meta+B" data-sidebar-right-toggle="true"><svg width="16" height="16" class="P3OORG_collapseGlyph" data-icon="dsw-icon-panel-left-outline-regular" aria-hidden="true"><use href="#dsw-icon-panel-left-outline-regular"></use></svg></button></div></div><div class="_paneBody_123xe_610"><p class="_empty_123xe_145">空面板</p></div></section></div></div></div></div></div></div></div></div></div><div class="pI_x6G_bottomRow" data-shell-bottom="true"><div data-slot="shell.bottom" style="display: contents;"></div></div><div class="pI_x6G_overlayLayer" data-shell-overlay="true"><div data-slot="shell.overlay" style="display: contents;"><span class="_root_70kcw_1" style="anchor-name: --dsh-menu-trigger-rr; position: fixed; left: 0px; top: 0px; width: 0px; height: 0px;"></span></div></div><div class="pI_x6G_handle" data-side="sidebar" style="left: 280px;"></div></div></div></div>
  <script>
(function(){
  var meAccount=null
  fetch('/access/api/me',{credentials:'same-origin'}).then(function(r){
    if(r.status===401){location.replace('/login');return null}
    return r.ok?r.json():null
  }).then(function(u){
    if(!u||!u.account)return
    meAccount=u.account
    scheduleRecover()
  }).catch(function(){})

  // 租户引导:session/create 的拒绝帧默认只有手动点击路径会弹 toast(客户端自带),
  // 自动引导(首屏连他人工作区被拒)是静默重试——这里补一条可见的引导条(30s 去重)。
  // 落座兜底(2026-11-11 E2E 重写):空会话输入框([aria-label="选择工作区"])在场即调度,
  // 1.2s/3.5s/7s 三次点击自己工作区头行的「+ 新建会话」按钮(上游 Rows.tsx aria=
  // 在“{name}”中新建会话——走 startSession→openWorkspace,上游复用已开通 blank 会话;
  // 旧实现点 treeitem 工作区行=仅折叠/展开,永不落座)。9s 仍空转 → 一次性 reload:
  // 上游 navigation connectBlank 的僵尸 inflight attempt 会静默吞掉后续一切点击,
  // 客户端无解,重载后 restoreSelection 沿已建会话(dsh.sessions.current)直接落座;
  // sessionStorage 旗标防循环,落座成功即清。
  var lastGuide=0
  var seatTries=0
  var RELOAD_FLAG='eternaSeatReload'
  function composerInert(){
    return !!document.querySelector('[aria-label="选择工作区"]')
  }
  function recoverSeat(){
    if(seatTries>=3||!meAccount||!composerInert())return
    seatTries++
    var btns=document.querySelectorAll('button[aria-label]')
    for(var i=0;i<btns.length;i++){
      var al=btns[i].getAttribute('aria-label')||''
      if(al.indexOf(meAccount)!==-1&&al.indexOf('新建会话')!==-1){btns[i].click();break}
    }
  }
  function scheduleRecover(){
    setTimeout(recoverSeat,1200)
    setTimeout(recoverSeat,3500)
    setTimeout(recoverSeat,7000)
    setTimeout(function(){
      if(!meAccount)return
      if(!composerInert()){try{sessionStorage.removeItem(RELOAD_FLAG)}catch(e){}return}
      var reloaded=false
      try{reloaded=!!sessionStorage.getItem(RELOAD_FLAG)}catch(e){}
      if(!reloaded){
        try{sessionStorage.setItem(RELOAD_FLAG,'1')}catch(e){}
        location.reload()
      }
    },9000)
  }
  function guideToast(text){
    var t=document.createElement('div')
    /* v4 §7a.3:toast 只在顶部中央,z=1500(产品级最高);圆角/字阶走令牌 */
    t.style.cssText='position:fixed;left:50%;top:max(16px,env(safe-area-inset-top));transform:translateX(-50%);z-index:1500;max-width:min(560px,calc(100vw - 32px));background:var(--dsw-alias-toast-bg);color:var(--dsw-alias-toast-label);border:1px solid var(--dsw-alias-state-business-primary);border-radius:var(--et-radius-md);padding:12px 16px;font-size:var(--et-text-caption);line-height:var(--et-leading-snug);font-family:var(--et-font-body);box-shadow:var(--et-shadow-r3)'
    t.setAttribute('role','status')
    t.textContent=text
    document.body.appendChild(t)
    var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches
    setTimeout(function(){
      if(!reduce){t.style.transition='opacity .4s';t.style.opacity='0'}
      setTimeout(function(){t.remove()},reduce?0:450)
    },6000)
  }
  var origFetch=window.fetch
  window.fetch=function(input,init){
    var p=origFetch.apply(this,arguments)
    try{
      var url=typeof input==='string'?input:(input&&input.url)||''
      if(url.indexOf('/api/session/create')!==-1){
        p.then(function(r){
          if(!r.ok)return
          r.clone().json().then(function(d){
            var err=d&&d.result&&d.result.ok===false&&d.result.error
            if(err&&err.code==='tenant/denied'&&Date.now()-lastGuide>30000){
              lastGuide=Date.now()
              guideToast(err.message||'该工作区不属于你，请在左侧点击你自己的工作区（家目录）新建会话')
              scheduleRecover()
            }
          }).catch(function(){})
        }).catch(function(){})
      }
      // 模型切换即时回显(2026-11-12):上游 selectModel 成功后等 control 流回推
      // modelSelection 投影——多用户 mux 环境下投影帧不达,模型按钮恒显旧模型
      // (=用户观感「切换不生效」;轨迹实证服务端与回合真实生效)。视觉层修补:
      // 成功响应后直接改按钮 aria-label 与内部文本;下次 React 重渲染(face
      // 更新或重载)自会以正确值覆盖,无持久分叉。
      if(url.indexOf('api/session/selectModel')!==-1){
        p.then(function(r){
          if(!r.ok)return
          r.clone().json().then(function(d){
            var sel=d&&d.result&&d.result.ok===true&&d.result.value&&d.result.value.selected
            if(!sel||!sel.provider||!sel.model)return
            var effort=sel.reasoningEffort||'Default'
            var display=sel.model
            var btns=document.querySelectorAll('button[aria-label]')
            for(var i=0;i<btns.length;i++){
              var al=btns[i].getAttribute('aria-label')||''
              if(al.indexOf('选择模型')===0){
                btns[i].setAttribute('aria-label','选择模型，当前 '+display+'，推理等级 '+effort)
                var seen=0
                var kids=btns[i].children
                for(var j=0;j<kids.length;j++){
                  var t=(kids[j].textContent||'').trim()
                  if(t==='')continue
                  if(seen===0){kids[j].textContent=display}
                  else if(seen===1){kids[j].textContent=effort}
                  seen++
                  if(seen>=2)break
                }
                break
              }
            }
          }).catch(function(){})
        }).catch(function(){})
      }
      // /permission 命令清单过滤(2026-11-12):权限选择器已随 P1-T3 禁用(cordis.patch.yml
      // 模板 ui-permission disabled,档位固定 workspace-write+ask),但宿主 /permission
      // 命令由 interaction/permission-presets 无条件注册(上游只读,无从关)——客户端
      // 装饰弹窗已死,/ 菜单残留一条裸命令。此处重写 commands/list 响应滤除该描述符,
      // 使菜单不渲染;直接键入 /permission 仍可执行,但目录仅剩只读/工作区写入两档
      // 安全沙箱档,无提权面。若日后恢复选择器,须同步移除本过滤(与模板行成对)。
      if(url.indexOf('commands/list')!==-1){
        return p.then(function(r){
          if(!r.ok||r.status===204)return r
          return r.clone().json().then(function(d){
            var v=d&&d.result&&d.result.ok===true?d.result.value:null
            if(!Array.isArray(v))return r
            var filtered=v.filter(function(c){return !(c&&c.name==='permission')})
            if(filtered.length===v.length)return r
            d.result.value=filtered
            return new Response(JSON.stringify(d),{status:r.status,headers:{'content-type':'application/json'}})
          }).catch(function(){return r})
        })
      }
    }catch(e){}
    return p
  }
})()
</script>
