- insert:
    # ── base 挂载面 16 行（2026-11-18 对齐 super 模板，FORM001 按序一致）───────
    # 行序=apply 序=pre-execute 瀑布序（与 super 模板「验收挂载」块同源）；本地
    # dev boot 需按 docs/eterna-web-profile.md symlink 对应包，缺链行 Loader 静默跳过。
    - id: eterna-governance
      name: '@eterna/glue/governance-plugin'
    - id: eterna-audit
      name: '@eterna/glue/audit-plugin'
    - id: eterna-egress
      name: '@eterna/glue/egress-plugin'
    # 记忆/知识底座（2026-11-11 E2E 回归补挂）：记忆 = @eterna/glue/memory-plugin；
    # 知识底座 = @eterna/knowledge-admin 单宿主（2026-11-19 融合：四工具 + 知识库工作台）。插件登记册
    # 自始列此二项——挂载清单补行前 UI 宣称已启用、会话内却无 memory_*/knowledge_* 工具。
    - id: eterna-memory
      name: '@eterna/glue/memory-plugin'
    - id: eterna-knowledge
      name: '@eterna/knowledge-admin'
    - id: eterna-llm-doctor
      name: '@eterna/llm-doctor'
    - id: eterna-brand
      name: '@eterna/brand'
    - id: eterna-access
      name: '@eterna/access'
    - id: eterna-prompt-studio
      name: '@eterna/prompt-studio'
    - id: eterna-usage-stats
      name: '@eterna/usage-stats'
    - id: eterna-panel
      name: '@eterna/panel'
    # Subagent 工作台(38 号 WS-D;super 专属 Tier2):双面插件——Host 半边 M3 无端点,
    # 浏览器半边 lib/client.js 注册 sidebar.panellist「工作台」入口 + main keyed 面板。
    # symlink 由 entrypoint/verify 守卫式补链承担(目录存在才建)。
    - id: eterna-workbench
      name: '@eterna/workbench'
    # 附件入口双面插件(2026-11-12):浏览器半边在输入框工具行(conversation.input.left)
    # 贡献常驻「附件」按钮,经 uiConversation.createDrafts 注册草稿附件(上传/预览/
    # 重试全在上游 file-upload/ui-attachment,本包不自建管线);Host 半边 idle 载具
    # 仅为客户端双面包提供宿主 Loader 条目。前置:profile node_modules symlink
