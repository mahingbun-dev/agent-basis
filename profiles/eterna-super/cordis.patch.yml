    # lib/client.js 组进 window.__DSH_BOOT__ 花名册)。本行 idle 挂载仅为客户端
    # 半边提供宿主 Loader 条目;数据面=下方 eterna-memory-admin(+生产档的
    # eterna-memory 行提供引擎)。
    - id: eterna-memory-client
      name: '@eterna/memory'
    # 设置分区「记忆」/域 chip/Sources 行的数据面:eternaMemory/* SRC 端点
    # (配置文件桥/域清单/会话域切换)必须宿主层挂载(compaction admin 同款
    # 结论:api-gateway SRC 发现只解析宿主 reflect);sqlite/overrides 走
    # cwd/.eterna 缺省约定,会话域面经 ctx.get('eternaMemorySession')
    # 机会读取(glue eterna-memory 行未挂载时端点如实回 unavailable)。
    - id: eterna-memory-admin
      name: '@eterna/memory/admin-plugin'
    # ── super 形态专属挂载行(2026-11-17 挂载收口;40 号 S-3 纪律 2)──────────
    # 四行均为 super 模板登记、base 模板不挂(31 号 §2.1 super=base⊕… 的加法面)。
    # 2026-11-19 已落地转绿:四行装配半边全部在案且 verify-eterna-super 断言 active
    # ——tasks(packages/tasks/src/plugin.ts:1036 defineTasksPlugin default export,
