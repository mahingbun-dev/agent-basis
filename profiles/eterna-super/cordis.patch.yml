    # 装配:channels-plugin.ts:197/interact-plugin.ts:81 default export)、toolkit
    # (packages/toolkit/src/plugin.ts:105 default export;同日按 40 号 §9 Q5 登记
    # tier1)。verify-eterna-super「挂一行、验一行」口径维持(行集派生自 super 模板)。
    - id: eterna-tasks
      name: '@eterna/tasks'
      # realm 对齐登录账号名(单租户验收;多租户经 glue 注入账号 realm 后移除本行):
