# ── super 形态挂载清单（eterna-super，40 号 S-3）───────────────────────────
# 初始内容 = profiles/eterna-web/cordis.patch.yml 原样拷贝（2026-11-17；31 号 §2.1
# super=base⊕tasks+channels+interact+workbench+toolkit，Tier2 挂载行为空集——挂不存
# 在的包必 boot failed，各包落地 PR 必须同步改 super 模板与本清单两处并双跑 G1-1+G1-2）。
# 装载形态：DSH profile `$DSH_HOME/profiles/eterna-super`（ETERNA_FORM=super）。
# 漂移守卫：与 docker/profile/cordis.super.patch.yml.template 的挂载行一致由
# `packctl form-check`（FORM001）看护；super 裁切面继承 base（不回加 base 裁切行）。
# 2026-11-18 挂载面收口：insert 块 @eterna 挂载行集与 docker/profile/
# cordis.super.patch.yml.template 逐行一致（20 行，FORM001 按序口径）——S-3 纪律 2
# 「同步改模板与清单两处」的清单半边（2026-11-17 挂载收口只落了模板半边，form-check
# FORM001 漂移在案）。其余正文仍与 profiles/eterna-web/cordis.patch.yml 逐字一致
# （2026-11-19 起例外：base 清单对同步新增 P1-T5 成对行——directory-picker disabled
# 覆写 + directory-picker-host insert；super 清单按「不回加 base 裁切行」惯例继承
# 不重述，此段为唯一正文差）；
# base 清单对同步（模板独有 10 行）仍按 40 号 §9 Q1 走独立 PR，不在本文件先行。
# 2026-11-19 super 收尾（A5 契约）：super 专属块注释刷新为四行已落地事实；eterna-tasks
# 行补 config.realm=admin 与容器模板同款对齐（单租户验收，realm=部署账号；行内 config
# 的机器比对口径见 tools/packctl/src/form.ts 头注演进项）。
# Eterna enterprise Web 档（eterna-web）：dsh-base + dsh-web-app 之上的企业裁切层。
#
# 装载形态：DSH profile `$DSH_HOME/profiles/eterna-web`，其 package.json 声明
# dsh.profile.bundles = ["@deepseek-ai/dsh-base", "@deepseek-ai/dsh-web-app",
# "@deepseek-ai/dsh-deepseek-chat-import", "@deepseek-ai/dsh-experimental-session-search",
# "@deepseek-ai/dsh-experimental-plugin-market-bundle",
# "@deepseek-ai/dsh-experimental-terminal-bundle"]（rc.5 默认集；开发档与容器模板同源，
# 生产渲染源=docker/profile/cordis.patch.yml.template），
# 本文件作为该 profile 的 cordis.patch.yml（用户层，最后写赢）。裁切=按 id 覆写
# 既有行并置 disabled: true（补丁语义：裸 id 行只覆写既有行且整份替换 config，
# 覆写 config 的行重述全部键；新增行必须用 "- insert:"——见
# packages/glue/cordis.patch.yml 的 E2E 教训）。裁切/回加全部为覆写行；文末另有两个
# "- insert:" 新增块（mcp-browser / eterna-prompt-studio），见各自段注。
#
# 权威依据：plans/2026-11-06-dsh企业agent路线定案.md §11（§11.7 图纸复核、
# §11.8 二次裁定为准）。行 id 核对自 deepseek-harness 两个 bundle patch 的
# 装品版本（@deepseek-ai/dsh-base 0.2.2-rc.5、@deepseek-ai/dsh-web-app 0.2.2-rc.5，
# 即实际 boot 的补丁文本；仓库检出略超前，差异见 docs/eterna-web-profile.md）。
# rc.5 增量（本开发档）：删 rc.5 已无的 account-controller/office-to-pdf 覆写；
# 补 mcp-manager.servers、terminal panel 覆写、ui-account-notifications/
# workspace-dependencies 禁用；两预设补 tool-subagent-control interrupt:false、
# tool-office、skill-filesystem customSkillDirs（与容器模板 rc.5 行集对齐）。
#
# 两条已知偏差（对 §11.2/§11.8 的字面清单）：
# 1. `credentials` 行保留不裁：client-connection（web 传输层，必需行
#    requiredStartupEntryIds 成员）插件级 inject = ["credentials"]
#    （dsh-client-connection lib/index.js:1013；BrowserAuth 用它持久化浏览器
#    会话签名密钥 lib/index.js:391-401）。实测裁掉即启动失败 "connection
#    (required) missing credentials"。该文档仅承载浏览器会话签名 record，
#    无模型密钥写入路径（账号/凭据解析行均已裁）。
# 2. agent 平面行在预设（preset）内装载，仅裁宿主行不够：shipped
#    standard 预设的 delegation 组原样启用 workflow-ptc/tool-workflow，
#    ptc 预设启用 tool-executor-ptc（真 boot 的 pluginInventory 已实测）。
#    故本层按官方机制重述 preset-standard 的整份 config（Web 编辑器同款：
#    "Edits saved from the Web editor override this row's config.plugins by id
#    from the profile patch"），并整体禁用 preset-ptc；preset-cordis（创造模式）
#    于 2026-11-09 用户裁定回加（重要：Agent 可编写插件/创建模式），整份重述见下。
#
# 回加方式：删除对应行的覆写块（或把 disabled 改回），见
# docs/eterna-web-profile.md「如何回加」。

# ── 遥测（§11.8：裁后无隐式外联；§11.2：外联 dsh-otel-collector 合规红线）─────
- id: otel
  disabled: true

- id: session-telemetry-otel
  disabled: true

- id: desktop-product-telemetry
  disabled: true

- id: product-analytics
  disabled: true

# ── 凭据解析与账号体系（§11.2/§11.8：密钥走环境变量/自建路由层，不落地 DSH）──
# credentials 保留，见文件头「已知偏差 1」。
- id: authorization
  disabled: true

- id: deepseek-account
  disabled: true

- id: llm-deepseek
  disabled: true

- id: llm-deepseek-account
  disabled: true

# 账号 API：account-controller 行 rc.5 已整体删除（47 §2.2）——旧覆写行删除；
# include 对不存在 id 只 warn 跳过，死行会让「absent 即通过」的门禁假绿。
- id: ui-settings-account
  disabled: true

# rc.5 行集（50 §3.2 第 3 条「禁」）：
# - ui-account-notifications：上游新增账号通知面；产品通知中心在设置分区
#   （AGENTS 前端铁律 3），该行禁用。
# - workspace-dependencies：Desktop 专属（上游 disabled 表达式只认
#   profile=desktop 且 DSH_PRIMARY_RUNTIME 非空）；Web 档显式钉死禁用。
- id: ui-account-notifications
  disabled: true

- id: workspace-dependencies
  disabled: true

# ── MCP 系统层（rc.5 mcp-manager；B14）──────────────────────────────────────
# 行由 web-app bundle 提供（name/inject 沿用上游）；本层只写系统层 config.servers
# 基线（默认空），admin 经设置弹窗写回本行，非 admin 在 settings/describe 过滤。
- id: mcp-manager
  config:
    servers: {}

# ── 终端（rc.5 terminal bundle；B20）────────────────────────────────────────
# terminal 行集由 @deepseek-ai/dsh-experimental-terminal-bundle 引入（insert 组
# optional-persistent-terminals 内）；本档覆写按 id 递归命中组内行。容器内固定
# bash、关闭「读取用户自建终端」面（多租户共享容器，用户终端不跨账号暴露）。
- id: optional-terminal-panel
  config:
    preferredShells:
      - bash
    readUserTerminals: false

# ── ptc/workflow 家族·宿主行（2026-11-09 修订：创造模式（preset-cordis）回加后，
# workflow-ptc 硬依赖 ptcRuntime 服务（static inject 含 ptcRuntime，且强制
# TypeScript 运行时）——ptc-runtime/workflow-ptc/tool-workflow 三行宿主回加；
# 默认标准会话仍经 preset-standard 内 disabled 不可见，仅创造模式启用。
# tool-executor-ptc 维持裁切（仅 ptc 会话使用，创造模式不声明）。
# ptc-runtime 包名 @deepseek-ai/dsh-ptc-runtime-node=Node TS 运行时。──────────
- id: ptc-runtime
  disabled: false

- id: workflow-ptc
  disabled: false

- id: tool-workflow
  disabled: false

- id: tool-executor-ptc
  disabled: true

- id: fs-observation-policy
  disabled: true

- id: tool-plugin-manager
  disabled: true

- id: ui-workflow-run
  disabled: true

# ── Session Log 上传（2026-11-09 用户裁定：去掉通用设置里的该开关；宿主行+
#    客户端行成对裁,上传能力与设置开关一并消失——契合「数据不出内网」红线）─────
- id: session-log-deepseek
  disabled: true

- id: ui-settings-session-log
  disabled: true

# ── 场景裁切（§11.3/§11.8 确认维持）─────────────────────────────────────────
# office-to-pdf 行 rc.5 已删除（web-app 行漂移：office-kit / skill-office /
# workspace-dependencies 替代）——旧覆写行删除（死 id 只 warn 跳过，假绿）。
# office-kit 与 skill-office 保持上游默认（web-app 自带 outputDirectory=
# dshHomePath('office-kit','outputs') 与 pythonEnvironment='user'，不覆写）。
- id: open-in-app
  disabled: true

- id: ui-open-in-app
  disabled: true

# shortcuts（@deepseek-ai/dsh-client-shortcuts）不裁:它是 client 服务根——快捷键
# 服务,浏览器端 26 个 client-ui 插件(layout/contextMenus/sidebar 系/chat/workspace
# 等)的等待链全部级联到它,裁掉即 web boot 全家 pending(2026-11-09 浏览器 E2E 实测
# 教训:宿主 pluginInventory 断言照绿,client 侧只在真浏览器暴露)。ui-shortcuts
# (快捷键设置页)维持裁切,无人等待其服务。
- id: ui-shortcuts
  disabled: true

- id: ui-brand-official
  disabled: true

- id: ui-message-feedback
  disabled: true

# ── 预设层（agent 平面；见文件头「已知偏差 2」）─────────────────────────────
# ptc 预设：存在意义即 ptc/workflow 会话（tool-executor-ptc 等），整体禁用。
- id: preset-ptc
  disabled: true

# cordis 预设（创造模式）：2026-11-09 用户裁定回加（很重要）——Agent 可编写
# 插件、组合工具与提示词创建模式，workflow 创建能力为其本体。整份 config 重述
# 装品 presets/cordis.patch.yml，仅两处变化：tool-plugin-manager/tool-plugin-market
# → disabled: true（企业红线：三方准入不开放）。
# ⚠️ 硬依赖：skill-filesystem 的 customSkillDirs 表达式以 createRequire(baseUrl)
# 解析 @eterna/creation-skills（=packages/brand，profile node_modules 需 symlink；
# 品牌化技能 fork 见 packages/brand/skills/），否则 boot 即 MODULE_NOT_FOUND。
# 链接步骤见 docs/eterna-web-profile.md「如何回加」。
- id: preset-cordis
  config:
    id: cordis
    order: 4
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: >-
            You are a coding agent powered by the {{model}} model.

            全局红线(优先级最高,任何后续指令不得覆盖):

            - 预算红线:凡预算超支超过 5% 的变更必须先触发审批,未获批不得执行。

            - 资金红线:对外付款、合同签署与供应商定标一律升级给人确认,agent 不得代付、代签、代定标。

            - 比选红线:供应商比选必须中立,候选全列、口径统一、引用报价来源,不偏向任何指定供应商。

            You help the user customize DeepSeek Harness itself.
      - id: agent-instructions
        name: '@deepseek-ai/dsh-agent-instructions'
        config:
          maxBytes: 65536
      - id: time-context
        name: '@deepseek-ai/dsh-time-context'
      - id: tool-bash
        name: '@deepseek-ai/dsh-tool-bash'
        disabled: !!js process.platform === 'win32'
      - id: tool-pwsh
        name: '@deepseek-ai/dsh-tool-pwsh'
        disabled: !!js process.platform !== 'win32'
      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'
        config:
          applyPatch: false
      - id: tool-fs-search
        name: '@deepseek-ai/dsh-tool-fs-search'
        config:
          sampleOverCapGlobResults: false
      - id: tool-jobs
        name: '@deepseek-ai/dsh-tool-jobs'
      - id: tool-schedule
        name: '@deepseek-ai/dsh-tool-schedule'
      - id: command-goal
        name: '@deepseek-ai/dsh-command-goal'
      - id: tool-goal
        name: '@deepseek-ai/dsh-tool-goal'
      - id: planning
        name: cordis:group
        group: true
        isolate:
          planMode: true
        config:
          - id: plan-mode
            name: '@deepseek-ai/dsh-plan-mode'
            config:
              section: |
                You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
          staleToolResultPruner: true
        config:
          # 陈旧工具结果清理层（L2；22 号 §4-C6 挂载）：压力达 effectiveWindow×0.7
          # 触发，按 turn 分组保留最近 5 组、预计回收 ≥4096 tokens 才动手；行序排
          # 在 compaction-basic 之前（agent/pre-step 先于摘要层泄压，§4-C6 触发节）。
          - id: stale-tool-result-pruner
            name: '@eterna/compaction/stale-plugin'
            config:
              keepGroups: 5
              minSavingsTokens: 4096
              thresholdRatio: 0.7
          - id: compaction-basic
            name: '@eterna/compaction/basic-plugin'
            # 压缩策略沿用上游默认(thresholdRatio 0.8 / retainRatio 0.16 / 重试 1),
            # 不覆写即取 basic/config.ts 的 DEFAULT_*;此处留空 config 而非省略整行,
            # 便于后续按部署调参时直接加键。
            config: {}
          - id: command-compact
            name: '@eterna/compaction/command-plugin'
          - id: tool-result-pruner
            name: '@eterna/compaction/pruner-plugin'
            config:
              thresholdChars: 8192
              headChars: 4096
              tailChars: 1024
      - id: delegation
        name: cordis:group
        group: true
        isolate:
          workflowEngine: true
        config:
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
            # rc.5 默认 interrupt:false（base 行与装品 standard/cordis preset 均显式声明）
            config:
              interrupt: false
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              modelSelection: true
              modelDiscovery: true
          - id: tool-subagent-fork
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: fork
              toolName: subagent_fork
          - id: workflow-ptc
            name: '@deepseek-ai/dsh-workflow-ptc'
            config:
              provider: spawn
          - id: tool-workflow
            name: '@deepseek-ai/dsh-tool-workflow'
      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'
        # timed 止血(2026-11-17):legacy 阻塞模式无超时,提问挂死无出口。
        config:
          mode: timed
          timeout: 300
      - id: tool-todo
        name: '@deepseek-ai/dsh-tool-todo'
        config:
          allowParallelInProgress: true
      - id: tool-web
        name: '@deepseek-ai/dsh-tool-web'
        config:
          fetch: true
          searchTimeoutMs: 60000
      - id: tool-cordis
        name: '@deepseek-ai/dsh-tool-cordis'
      - id: skill-filesystem
        name: '@deepseek-ai/dsh-skill-filesystem'
        config:
          # 技能目录=品牌化 fork（packages/brand/skills）：2026-11-09 品牌化改造——
          # 上游技能散文含 DeepSeek Harness/DSH 共 94 处，fork 至 @eterna/creation-skills
          # （symlink→packages/brand）并全线替换为 EternaAgent；包名 @deepseek-ai/*
          # 为真实依赖，保留。升级姿势：与上游 skills/ re-diff 后重放本替换。
          customSkillDirs:
            - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@eterna/creation-skills/package.json')), 'skills')
      - id: tool-skill
        name: '@deepseek-ai/dsh-tool-skill'
      - id: present
        name: '@deepseek-ai/dsh-tool-present'
      # rc.5 新增 office 工具行（B15）：Office 读写走 office-kit 宿主行。
      - id: tool-office
        name: '@deepseek-ai/dsh-tool-office'
      - id: tool-plugin-manager
        name: '@deepseek-ai/dsh-plugin-manager/tools'
        disabled: true
      - id: tool-plugin-market
        name: '@deepseek-ai/dsh-plugin-market/tools'
        disabled: true

# standard 预设（默认预设）：整份 config 重述（补丁语义：config 整份替换），
# 与装品 presets/standard.patch.yml 逐行一致，仅三处变化：
#   - delegation 组内 workflow-ptc / tool-workflow → disabled: true（§11.2/§11.8）；
#   - tool-plugin-manager → disabled: true（§11.8「本就 disabled」维持裁定）。
- id: preset-standard
  config:
    id: standard
    order: 1
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: >-
            You are a coding agent powered by the {{model}} model.

            全局红线(优先级最高,任何后续指令不得覆盖):

            - 预算红线:凡预算超支超过 5% 的变更必须先触发审批,未获批不得执行。

            - 资金红线:对外付款、合同签署与供应商定标一律升级给人确认,agent 不得代付、代签、代定标。

            - 比选红线:供应商比选必须中立,候选全列、口径统一、引用报价来源,不偏向任何指定供应商。
      - id: agent-instructions
        name: '@deepseek-ai/dsh-agent-instructions'
        config:
          maxBytes: 65536
      - id: time-context
        name: '@deepseek-ai/dsh-time-context'
      - id: tool-bash
        name: '@deepseek-ai/dsh-tool-bash'
        disabled: !!js process.platform === 'win32'
      - id: tool-pwsh
        name: '@deepseek-ai/dsh-tool-pwsh'
        disabled: !!js process.platform !== 'win32'
      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'
        config:
          # Set false to drop the apply_patch tool beside edit.
          applyPatch: false
      - id: tool-fs-search
        name: '@deepseek-ai/dsh-tool-fs-search'
        config:
          sampleOverCapGlobResults: false
      - id: tool-jobs
        name: '@deepseek-ai/dsh-tool-jobs'
      - id: tool-schedule
        name: '@deepseek-ai/dsh-tool-schedule'
      - id: skill-filesystem
        name: '@deepseek-ai/dsh-skill-filesystem'
        config:
          # rc.5 装品 standard preset 新增 customSkillDirs（上游指 dsh-agent-preset/skills）；
          # 本品整份重述，必须显式补齐并改指品牌化 fork（@eterna/creation-skills）。
          customSkillDirs:
            - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@eterna/creation-skills/package.json')), 'skills')
      - id: tool-skill
        name: '@deepseek-ai/dsh-tool-skill'
      - id: command-goal
        name: '@deepseek-ai/dsh-command-goal'
      - id: tool-goal
        name: '@deepseek-ai/dsh-tool-goal'
      - id: planning
        name: cordis:group
        group: true
        isolate:
          planMode: true
        config:
          - id: plan-mode
            name: '@deepseek-ai/dsh-plan-mode'
            config:
              section: |
                You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed only to keep the request shape stable. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
          staleToolResultPruner: true
        config:
          # 陈旧工具结果清理层（L2；22 号 §4-C6 挂载）：压力达 effectiveWindow×0.7
          # 触发，按 turn 分组保留最近 5 组、预计回收 ≥4096 tokens 才动手；行序排
          # 在 compaction-basic 之前（agent/pre-step 先于摘要层泄压，§4-C6 触发节）。
          - id: stale-tool-result-pruner
            name: '@eterna/compaction/stale-plugin'
            config:
              keepGroups: 5
              minSavingsTokens: 4096
              thresholdRatio: 0.7
          - id: compaction-basic
            name: '@eterna/compaction/basic-plugin'
            # 压缩策略沿用上游默认(thresholdRatio 0.8 / retainRatio 0.16 / 重试 1),
            # 不覆写即取 basic/config.ts 的 DEFAULT_*;此处留空 config 而非省略整行,
            # 便于后续按部署调参时直接加键。
            config: {}
          - id: command-compact
            name: '@eterna/compaction/command-plugin'
          - id: tool-result-pruner
            name: '@eterna/compaction/pruner-plugin'
            config:
              thresholdChars: 8192
              headChars: 4096
              tailChars: 1024
      - id: delegation
        name: cordis:group
        group: true
        isolate:
          workflowEngine: true
        config:
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
            # rc.5 默认 interrupt:false（base 行与装品 standard/cordis preset 均显式声明）
            config:
              interrupt: false
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              modelSelection: true
              modelDiscovery: true
          - id: tool-subagent-fork
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: fork
              toolName: subagent_fork
          - id: workflow-ptc
            name: '@deepseek-ai/dsh-workflow-ptc'
            disabled: true
            config:
              provider: spawn
          - id: tool-workflow
            name: '@deepseek-ai/dsh-tool-workflow'
            disabled: true
      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'
        # timed 止血(2026-11-17):legacy 阻塞模式无超时,提问挂死无出口。
        config:
          mode: timed
          timeout: 300
      - id: tool-todo
        name: '@deepseek-ai/dsh-tool-todo'
        config:
          allowParallelInProgress: true
      - id: tool-web
        name: '@deepseek-ai/dsh-tool-web'
        config:
          fetch: true
          searchTimeoutMs: 60000
      - id: present
        name: '@deepseek-ai/dsh-tool-present'
      # rc.5 新增 office 工具行（B15）：Office 读写走 office-kit 宿主行。
      - id: tool-office
        name: '@deepseek-ai/dsh-tool-office'
      - id: tool-plugin-manager
        name: '@deepseek-ai/dsh-plugin-manager/tools'
        disabled: true
      - id: tool-plugin-market
        name: '@deepseek-ai/dsh-plugin-market/tools'
        disabled: true

# ── 回加（§11.8：内嵌浏览器为 web 档 opt-in，web-app 层默认 disabled）────────
- id: ui-sidebar-browser
  disabled: false

# ── Companion 浏览器执行面挂载（E1；plans/2026-11-10-companion扩展开发计划与测试门禁.md）──
# dsh-mcp-client 把本仓 browser-relay 的 MCP stdio server 工具注册为 mcp__browser__*。
# 前置：① relay 先行运行（node packages/browser-relay/dist/cli.mjs start，默认 127.0.0.1:9310）；
#      ② @deepseek-ai/dsh-mcp-client 需 symlink 进 profile node_modules（verify-eterna-web.mjs
#        与 docs/eterna-web-profile.md 物化流程同款）；③ 用户浏览器已加载 Eterna Companion 扩展。
# args 相对路径以 harness 进程 cwd=仓库根为基准（verify 脚本 spawn cwd=repoRoot 实测）；
# 部署形态用 ETNA_BROWSER_MCP_ENTRY 指向绝对路径。移除=删本段。
- insert:
    - id: mcp-browser
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: browser
        transport: stdio
        command: node
        args:
          - packages/browser-relay/dist/mcp.mjs
        env:
          ETNA_RELAY_BASE: http://127.0.0.1:9310
        toolCallTimeoutMs: 120000

# ── 提示词工作室挂载（T1.2；plans/2026-11-11-提示词工作室全景化改造计划.md）────
# @eterna/prompt-studio 双面插件（与 packages/prompt-studio/cordis.patch.yml 同款
# insert 行——裸 id 行只覆写既有行，基础树无 eterna-* 行会被 applyPatches 丢弃）：
# Host 半边 name 解析到本包 exports "."（loopPrompt/* Typert SRC 端点），浏览器
# 半边 package.json 的 dsh.client(platform: web) 声明把 lib/client.js 组进
