    # 逐字漂移由 packages/tasks/tests/preset.spec.ts「super 模板/开发档 profile ≡ 包源」
    # 深等断言守卫;G1-2 断言面同步扩(verify-eterna-super roster 含双 preset)。
    - id: eterna-tasks-worker-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: eterna-tasks-worker
        name: Eterna tasks 执行器
        description: "@eterna/tasks 的 worker(工单执行)Session 专用;前台命令与任务等待超时转后台,只含执行工作所需工具。"
        order: 90
        plugins:
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          # 前台命令等待上限(SA 值 5000;35 号 §12-12 未拍板,见文件头注)。
          - id: shell
            name: cordis:group
            group: true
            isolate:
              shell: true
            config:
              - id: bash-sandbox
                name: '@deepseek-ai/dsh-bash-sandbox'
                disabled: !!js process.platform === 'win32'
                config:
                  timeoutMs: 5000
                  maxTimeoutMs: 5000
              - id: pwsh-sandbox
                name: '@deepseek-ai/dsh-pwsh-sandbox'
                disabled: !!js process.platform !== 'win32'
                config:
                  timeoutMs: 5000
                  maxTimeoutMs: 5000
              - id: tool-bash
                name: '@deepseek-ai/dsh-tool-bash'
                disabled: !!js process.platform === 'win32'
              - id: tool-pwsh
                name: '@deepseek-ai/dsh-tool-pwsh'
                disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          # 任务等待超时转后台:job 结束唤醒 worker 并带结果(SA worker 同值)。
          - id: tool-jobs
