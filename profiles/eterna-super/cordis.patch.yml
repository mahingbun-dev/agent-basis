    # 走查实证);compaction 引擎由展平的 standard 预设提供到宿主树,宿主注入可达。
    - id: eterna-compaction-admin
      name: '@eterna/compaction/admin-plugin'
    # 记忆插件宿主载具行(M-M3 T12 前端四件,2026-11-14):设置分区「记忆」/
