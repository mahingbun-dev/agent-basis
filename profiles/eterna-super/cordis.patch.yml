      config:
        realm: Mr.Ma
    # ── tasks 双角色 preset(R22 接线,2026-11-21;40 号 S-3 纪律 2 的 restatement)──
    # 下面两行 = packages/tasks/cordis.patch.yml 两组 @deepseek-ai/dsh-agent-preset 的
