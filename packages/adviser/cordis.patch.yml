# @eterna/adviser bundle:参谋面板双面插件(一行两面)。
# 装载形态:insert 语义插入基础树(裸 id 行只覆写既有行,基础树无 eterna-adviser
# 行会被 applyPatches 丢弃;与 @eterna/panel / @eterna/attachments 同款)。
# - Host 半边:name 解析到本包 exports "."(src/index.ts)——
#   ① idle 装载载具(客户端双面包需宿主 Loader 条目才能进浏览器花名册);
#   ② P3 起承载服务面:参谋会话创建/冷恢复/多开登记与 inject|followup 双通道投递
#      (P1/P2 阶段仅 idle)。
# - 浏览器半边:本包 package.json 声明 dsh.client(platform: web)且导出
#   ./client(lib/client.js),宿主 client-modules 扫描把该行组进
#   window.__DSH_BOOT__ 浏览器花名册,注册 sidebar.right.pane.tab「参谋」tab。
#
# 参谋会话是 subagent child,provider = **spawn**(不是 fork)。P4 实测定谳:
# fork 的 capabilities.agentPreset=false 且 inheritsParentContext=true,给 fork 传
# request.agentPreset 会抛 UNSUPPORTED_CAPABILITY——即「继承父对话」与「独立只读
# preset」结构互斥。参谋选只读纪律优先,故用 spawn;不继承父对话由「按需读父」
# 补偿(预设里的 tool-session-query:同 cwd 即可读父会话,跨 cwd 被拒,均已实测)。
# 宿主插件经 ctx.subagents.startActivation({provider:'spawn', label, childId,
# request:{parent, prompt, agentPreset}, signal, delivery:'caller'}) 程序化创建
# (非模型工具路径),child 进父 catalog 且 header.origin==='subagent'(客户端
# ui-workspace tree.ts:235 据此把它硬过滤出普通会话列表)。
# 详见 docs/design/54-adviser-P0-probe.md §11。
- insert:
    - id: eterna-adviser
      name: '@eterna/adviser'

# ── eterna-adviser preset(54 号 P2)───────────────────────────────────────────
# 参谋会话的 agent 组合:只读工具面 + 独立压缩组。
#
# 只读纪律由「工具面缺失」硬保证,不靠提示词(提示词纪律随 54 号 P8 与 D1 三分叉
# 一并落地):
#   - 不挂 tool-bash / tool-pwsh / shell 组 → 无命令执行;
#   - tool-fs 关 write/edit/applyPatch → 只读文件;
#   - 不挂 tool-subagent / tool-subagent-control → 不能委派、不能寻址其他会话;
#   - 不挂 tool-jobs / tool-schedule / tool-goal / tool-todo → 无后台动作;
#   - 不挂 glue 的 knowledge 行 → knowledge_propose 是写操作,而 glue 一次性注册
#     全部四工具且无 per-tool 开关(knowledge-plugin.ts:191)。知识库只读检索靠下方
#     tool-guard 白名单放行 glue **全局**注册的 knowledge_search/read/status(自动继承
#     其租户分库路由),本包不另写封装(见 P4 收尾与 tool-guard.ts 头注)。
#
# ⚠ 「不挂该行」只挡住**预设自己的工具**,挡不住**根 ctx 上注册的全局工具**:
# 上游 ToolsService.view(scope) 的可见集 = 全局层 ∪ 作用域链层(index.ts:220-236)。
# 真实部署(eterna-web/eterna-super)的 glue 在根 ctx 全局注册 knowledge_propose /
# memory_write / memory_forget,access 全局注册 install_personal_plugin——2026-11-24
# 实机探针(probe-global-leak.mjs)实测**它们全部漏进了参谋**。P4 记录的「只读 11/11」
# 是在不含 glue 的最小探针 profile 里测的,不覆盖生产形态。
# 因此本 preset 末尾必须挂**守门行** `@eterna/adviser/tool-guard`(动态 deny =
# 全部全局工具 − 只读白名单,并订阅 tools/change 追捕晚注册)。见 tool-guard.ts 头注。
#
# 读父会话能力(dsh-tool-session-query 五个只读工具):跨会话授权要求目标会话 cwd
# 与调用者**精确匹配**,且搜索排除调用者会话本身——参谋读父会话正好落在该语义内
# (spawn 子会话继承父会话 cwd,参谋读的不是自己)。P4 实测:同 cwd 命中 1 条(授权
# 通过)、标记词可读;跨 cwd 命中 0(正确拒绝)。**该面即 P4 要求的读父能力,无需
# 另写 adviser_read_parent 封装**(54 号 §11.5)。
#
# 压缩组照 28 号 §3 的分层顺序(stale L2 → basic L3 → command → pruner L1),
# 参数取宿主缺省,不复制 orchestrator 特化值(53 号 D2 是主会话专属拍板,
# 参谋上下文天然短、话题单一,无需更早压缩)。
- insert:
    - id: eterna-adviser-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: eterna-adviser
        name: Eterna 参谋
        description: "会话内辅助对话(参谋)专用 preset:只读工具面——读主会话历史、读工作区文件、检索;无写盘、无命令执行、无委派、无工单。"
        order: 92
        plugins:
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          # 只读文件面(write/edit/applyPatch 全关;read/read_image 保留)。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              write: false
              edit: false
              applyPatch: false
          # 工作区发现:glob + grep(只读)。sampleOverCapGlobResults 是必填项
          # (dsh-tool-fs-search Config 非可选),取上游 base 同值 false。
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          # 会话历史读取:五个只读工具(search/read/trace)。跨会话授权按 cwd 精确匹配,
          # 参谋与父会话同 cwd 故可读父会话;搜索天然排除调用者自身。
          - id: tool-session-query
            name: '@deepseek-ai/dsh-tool-session-query'
          # 技能面(只读载入技能文本;无副作用)。
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          # ── 压缩组(28 号 §3 分层顺序;参数取缺省,见上方注)────────────────────
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
              staleToolResultPruner: true
            config:
              - id: stale-tool-result-pruner      # 行序保留:先陈旧清理泄压,后摘要压缩(28 §3 原注)
                name: '@eterna/compaction/stale-plugin'
                config:
                  keepGroups: 5
                  minSavingsTokens: 4096
                  thresholdRatio: 0.7
              - id: compaction-basic
                name: '@eterna/compaction/basic-plugin'
                # 摘要模型成对置空 = 跟随会话模型(22a §4 拍板 Q1 结论 A;
                # basic/config.ts validateSummarizationPair 要求成对)。
                config:
                  summarizationProvider: ''
                  summarizationModel: ''
              - id: command-compact
                name: '@eterna/compaction/command-plugin'
              - id: tool-result-pruner
                name: '@eterna/compaction/pruner-plugin'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          # ── 注:工单工具不在 preset 里(P4 收尾)──────────────────────────────
          # adviser_tickets 由**宿主半边**在创建参谋后注册到子会话 ctx(见
          # src/host.ts 的 startActivation 与 src/ticket-tools.ts 头注)。
          # 为什么不能放这里:预设 scope 是 isolate 的,预设内
          # `ctx.reflect.get('tasks', false)` 恒 undefined —— 真实 eterna-super
          # 实机诊断实证(根 ctx 读得到、预设内读不到)。base 形态 tasks 缺席 →
          # 宿主侧直接不注册(优雅缺席,不给模型一个必失败的坏工具)。
          # 另:orchestrator_read 也不能用 —— 它是 Tier2(tasks)的工具,参谋属 Tier1
          # (packctl TIER001),且注册时带主会话白名单谓词。
          # ── 全局工具守门(P4 收尾;必须最后一行)──────────────────────────────
          # 动态 deny = 当前全部**全局**工具 − 只读白名单(ADVISER_ALLOWED_GLOBAL_TOOLS),
          # 并订阅 tools/change 追捕晚注册。它挡的是根 ctx 注册的 knowledge_propose /
          # memory_write / install_personal_plugin 等写工具——预设「不挂该行」挡不住
          # 全局层,见本文件上方 ⚠ 段与 tool-guard.ts 头注。
          # 白名单里已放行 knowledge_search/read/status(glue 全局注册的只读三件),
          # 参谋因此继承 glue 的租户分库路由,无需另写封装。
          - id: tool-guard
            name: '@eterna/adviser/tool-guard'
