# tenant realm 配置模板:@eterna/extra(T13)
# 规范见同包 docs/tenant-realm.md;本文件可被 loadTenantRealmConfig() 原样加载校验。
#
# 结构:{ industries: [ { slug: 行业, customers: [客户...] } ] }
# - slug / 客户名:小写字母数字 + 连字符分段(^[a-z0-9]+(-[a-z0-9]+)*$)
# - 行业间互不可见;同行业客户间互不可见;客户可见行业共享物
# - realm key 由加载器推导:ind:<行业> 与 ind:<行业>:cust:<客户>
#
# 示例取自设计文档 13 号《活动策划领域包 v0 草案》的行业与示例客户。

industries:
  # 行业 1:活动策划(L2 @event/pack 首个领域)
  - slug: event-planning
    customers:
      - acme          # 示例客户 A
      - beta-corp     # 示例客户 B
  # 行业 2:法律咨询(占位,示范多行业并存)
  - slug: legal-consulting
    customers: []

