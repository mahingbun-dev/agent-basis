# @eterna/attachments bundle:附件入口双面插件(一行两面)。
# 装载形态:insert 语义插入基础树(裸 id 行只覆写既有行,基础树无 eterna-attachments
# 行会被 applyPatches 丢弃;与 @eterna/panel 同款)。
# - Host 半边:name 解析到本包 exports "."(src/index.ts,idle 装载载具——客户端
#   双面包需宿主 Loader 条目,数据面全在上游 file-upload/ui-attachment,本包无服务)。
# - 浏览器半边:本包 package.json 声明 dsh.client(platform: web)且导出
#   ./client(lib/client.js),宿主 client-modules 扫描把该行组进
#   window.__DSH_BOOT__ 浏览器花名册,注入 conversation.input.left「附件」按钮。
- insert:
    - id: eterna-attachments
      name: '@eterna/attachments'
