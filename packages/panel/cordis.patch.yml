# @basis/panel bundle:基座面板双面插件(一行两面)。
# 装载形态:insert 语义插入基础树(裸 id 行只覆写既有行,基础树无 basis-panel
# 行会被 applyPatches 丢弃;与 @basis/glue 同款,见 glue/cordis.patch.yml 注释)。
# - Host 半边:name 解析到本包 exports "."(src/index.ts)→ BasisPanelGateway
#   (Typert SRC 端点 basisPanel/snapshot)。
# - 浏览器半边:本包 package.json 声明 dsh.client(platform: web)且导出
#   ./client(lib/client.js),宿主 client-modules 扫描把该行组进
#   window.__DSH_BOOT__ 浏览器花名册(dsh-repo docs/subsystems/client-modules.md)。
- insert:
    - id: basis-panel
      name: '@basis/panel'
