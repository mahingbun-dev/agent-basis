<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Eterna Companion 设置</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #ffffff;
        --surface: #ffffff;
        --surface-2: #f7f7f7;
        --fg: #080808;
        --fg-2: #363636;
        --muted: #5a5a5a;
        --border: #d8d8d8;
        --accent: #146ef5;
        --accent-hover: #0055d4;
        --accent-on: #ffffff;
        --success: #00a81a;
        --radius: 4px;
        --focus-ring: 0 0 0 3px color-mix(in oklab, var(--accent), transparent 70%);
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #080808;
          --surface: #101010;
          --surface-2: #161616;
          --fg: #f5f5f5;
          --fg-2: #d4d4d4;
          --muted: #a3a3a3;
          --border: #2a2a2a;
          --accent: #3b89ff;
          --accent-hover: #6aa6ff;
          --accent-on: #ffffff;
          --success: #35e35f;
        }
      }
      body {
        max-width: 560px;
        margin: 48px auto;
        padding: 0 20px;
        background: var(--bg);
        color: var(--fg);
        font-size: 16px;
        line-height: 1.6;
        font-weight: 500;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 32px;
        line-height: 1.15;
        font-weight: 600;
        letter-spacing: 0;
      }
      p {
        color: var(--fg-2);
      }
      label {
        display: block;
        margin-top: 20px;
        font-size: 14px;
        font-weight: 600;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        margin-top: 6px;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--bg);
        color: var(--fg);
        font: inherit;
      }
      input:focus-visible {
        outline: none;
        border-color: var(--accent);
        box-shadow: var(--focus-ring);
      }
      button {
        margin-top: 24px;
        padding: 12px 18px;
        border: none;
        border-radius: var(--radius);
        background: var(--accent);
        color: var(--accent-on);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 150ms cubic-bezier(0.2, 0, 0, 1);
      }
      button:hover:not(:disabled) {
        background: var(--accent-hover);
      }
      button:focus-visible {
        outline: none;
        box-shadow: var(--focus-ring);
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .status {
        margin-top: 20px;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface-2);
        color: var(--fg-2);
        font-size: 14px;
      }
      .hint {
        margin-top: 8px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }
      .saved {
        color: var(--success);
        font-size: 14px;
      }
      @media (prefers-reduced-motion: reduce) {
        button { transition: none; }
      }
    </style>
  </head>
  <body>
    <h1>Eterna Companion 设置</h1>
    <p>把你的浏览器作为 eterna agent 的执行面。填写中继服务地址后，agent 即可在<strong>你的浏览器</strong>里打开页面、复用你的登录态。</p>

    <label for="relay-url">中继地址</label>
    <input id="relay-url" type="text" spellcheck="false" placeholder="ws://127.0.0.1:9310/extension" />
    <p class="hint">开发模式默认连接本机回环地址；远端地址由服务端部署后提供。</p>

    <label for="relay-token">访问令牌（可选）</label>
    <input id="relay-token" type="password" spellcheck="false" placeholder="服务端设置 RELAY_TOKEN 时填写" />

    <button id="save" type="button">保存</button>
    <span id="saved" class="saved" role="status"></span>

    <div class="status" id="status" aria-live="polite">读取连接状态中…</div>

    <script type="module" src="options.js"></script>
  </body>
</html>
