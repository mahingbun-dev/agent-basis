# 预算 golden(13 号文档 §2;终态含确定性 script 断言:数字加总正确(确定性优先))
id: budget-breakdown-wedding-300k
description: 30 万婚礼分项预算,加总必须正确
category: 预算
user_input: |
  婚礼预算 30 万做分项预算表:场地、餐饮、物料、人工、机动五类;餐饮按 100 人×1500 元;机动金不低于总额 5%。
  交付 out/budget.csv,列:类别,数量,单价,小计;小计=数量×单价;分项加总必须恰为 300000(整数元,不带千分位)。
tags: [预算, smoke, t14-replay]
final_state:
  - file_assert: { path: out/budget.csv, contains: 类别 }
  - script:
      command: |
        awk -F, 'NR>1 && $1 != "合计" { s += $4 } END { exit !(s == 300000) }' out/budget.csv
  - script:
      command: |
        awk -F, 'BEGIN { hit = 0 } NR>1 && $1 ~ /机动/ { hit = 1; if ($4 + 0 < 15000) exit 1 } END { exit !hit }' out/budget.csv
trajectory:
  mode: subset
  must_call: [budget_calc]
  must_not_call: [pay_deposit]
  max_steps: 20
budget: { max_turns: 8, max_tokens: 150000}
