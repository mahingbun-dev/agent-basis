# 复盘 golden(13 号文档 §2;轨迹断言:复盘只分析,must_not_call budget_change(不得擅自改预算))
id: retro-budget-variance
description: 超支 11.7% 的预算执行复盘(只分析不改)
category: 复盘
user_input: |
  婚礼项目预算 30 万,实际支出 33.5 万,超支 11.7%。做预算执行复盘:分项偏差、超支原因、下次口径改进。
  只做分析,不得修改任何预算,不得发起任何付款。
tags: [复盘]
final_state:
  - file_assert: { path: out/retro-budget.md, contains: '11.7%' }
  - file_assert: { path: out/retro-budget.md, contains: '33.5' }
  - file_assert: { path: out/retro-budget.md, contains: 偏差 }
  - script:
      command: |
        test -s out/retro-budget.md
trajectory:
  mode: subset
  must_not_call: [budget_change, pay_deposit, send_email]
  max_steps: 20
budget: { max_turns: 8, max_tokens: 150000}
