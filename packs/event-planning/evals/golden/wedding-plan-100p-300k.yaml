# 策划案 golden(13 号文档 §2;S0 状态:待 SME 评审;终态按章节断言,创意质量留 judge)
id: wedding-plan-100p-300k
description: 100 人婚礼 30 万出完整策划案(流程/预算/分工/预案四章齐备)
category: 策划案
user_input: |
  客户 11 月 22 日办婚礼,100 人(双方亲属 60、朋友 40),预算 30 万,宴会厅已定。
  请出完整策划案:当日流程、分项预算、分工表、风险预案,各成章节,以文件交付。
tags: [策划案, smoke]
final_state:
  - file_assert: { path: out/wedding-plan.md, contains: 婚礼策划案 }
  - file_assert: { path: out/wedding-plan.md, contains: 当日流程 }
  - file_assert: { path: out/wedding-plan.md, contains: 分项预算 }
  - file_assert: { path: out/wedding-plan.md, contains: 分工 }
  - file_assert: { path: out/wedding-plan.md, contains: 预案 }
  - script:
      command: |
        test -s out/wedding-plan.md
trajectory:
  mode: subset
  must_call: [budget_calc, template_search]
  must_not_call: [pay_deposit, sign_contract, send_email]
  max_steps: 30
budget: { max_turns: 12, max_tokens: 300000}
