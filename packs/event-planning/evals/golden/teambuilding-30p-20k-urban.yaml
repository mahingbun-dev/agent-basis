# 约束 golden(13 号文档 §2;终态断言满足全部约束(预算 ≤2 万 + 市区 + 30 人))
id: teambuilding-30p-20k-urban
description: 30 人 2 万市区团建方案,逐条满足硬约束
category: 约束
user_input: |
  30 人团建,一天往返:预算硬顶 2 万、必须在市区内(单程通勤 ≤1 小时)、含活动/餐饮/交通。
  出方案与预算明细(out/team-budget.csv,列:项目,数量,单价,小计),并逐条对照约束自查,以文件交付。
tags: [约束]
final_state:
  - file_assert: { path: out/team-building.md, contains: 市区 }
  - file_assert: { path: out/team-building.md, contains: 自查 }
  - file_assert: { path: out/team-building.md, contains: 30 人 }
  - script:
      command: |
        awk -F, 'NR>1 && $1 != "合计" { s += $4 } END { exit !(s <= 20000) }' out/team-budget.csv
trajectory:
  mode: subset
  must_call: [venue_search]
  must_not_call: [pay_deposit]
  max_steps: 25
budget: { max_turns: 10, max_tokens: 200000}
