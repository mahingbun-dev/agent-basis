# guard-rules.yml —— 合规红线(@basis/governance 规则引擎消费;deny 优先、fail-closed)。
# 格式对齐 @basis/governance PolicyDocument:{ rules: [{ id, effect, tools, argsContains?, reason? }], default }。
# 本包四条红线(plans/2026-11-06-dsh企业agent路线定案.md §11.7 自建清单,T3-1 落地):
#   ① 达梦业务库只读,写权限仅限预警记录表(alert_records 单点白名单)——静默写库=失败,golden 钉住;
#   ② 数据与知识层只经 MCP 访问(工具面只放行经 MCP 的查询类工具,不出现直连库凭据类工具);
#   ③ 对外发送(通报/报告/短信/邮件)必须确认(R2,withhold-或-补偿);
#   ④ deny 优先、fail-closed:deny 命中优先于 allow/ask;default: ask 兜底,规则未放行即拦。
#   本包无资金/合同类工具:pay_*/sign_* 等出现在规则面即为越界,直接 deny。
rules:
  # 红线①:预警记录表之外的任何达梦/库表写动作,deny(不给 ask 机会,升级也不放行执行)。
  - id: industrial-deny-dm-write-beyond-alert-table
    effect: deny
    tools: ['dm_insert_*', 'dm_update_*', 'dm_delete_*', 'db_write_*', 'db_update_*', 'db_delete_*', 'insert_*', 'update_*', 'delete_*', 'drop_*', 'truncate_*', 'alter_*']
    reason: 达梦业务库只读,写权限仅限预警记录表(alert_records 单点白名单);静默写库=失败
  # 红线④:资金/合同类工具本包不存在,出现即越界(deny 优先于一切)。
  - id: industrial-deny-finance-and-contract
    effect: deny
    tools: ['pay_*', 'sign_*', 'transfer_*', 'contract_*', 'approve_*']
    reason: 本包无资金/合同类工具;出现即越界,deny 优先
  # 红线②知识侧(T10a):知识层只经 Knowledge MCP(pgvector+图谱,不经公网)访问——
  # 向量库/图库直连客户端类工具出现即越界;deny 优先于下方 allow 的 *_query/*_search,
  # 堵住绕 MCP 的直连口。「知识结论无出处」属内容面,规则引擎(工具名+参数子串)不可判定:
  # 由 knowledge-qa skill 纪律 + 金集(motor-vib-maintenance-qa / kb-no-hit-no-fabrication)
  # 的 file_assert(出处/版本/无命中话术)钉住。
  - id: industrial-deny-knowledge-store-direct-access
    effect: deny
    tools: ['pgvector_*', 'neo4j_*', 'vector_db_*', 'graph_db_*', 'knowledge_graph_*', 'kb_direct_*', 'kb_write_*', 'kb_delete_*']
    reason: 知识层只经 Knowledge MCP(pgvector+图谱)访问,向量库/图库直连即越界;知识结论必须带出处与版本,检索无命中明说,禁止编造条文
  # 红线②:只读查询/检索(R0 档)——TDengine 时序、预警列表、知识检索都经 MCP。
  - id: industrial-allow-readonly-via-mcp
    effect: allow
    tools: ['timeseries_query', 'alert_list', '*_query', '*_list', '*_search', 'read_*', 'list_*']
    reason: 只读检索与确定性查询(R0 档;数据与知识层只经 MCP 访问)
  # 红线①白名单单点:预警记录表写入是唯一放行的达梦写路径(R1 档,静默+事后变更卡片)。
  - id: industrial-allow-alert-record-write
    effect: allow
    tools: ['alert_records']
    reason: 预警记录表写入(唯一放行的达梦写路径,R1 档,事后变更卡片)
  # 报告异步任务(T10b,图纸⑦):提交/进度/产物引用是 R1 档可逆写(产物落对象存储桩,
  # 可删);submit 处由桩 fail-closed 校验出处与时间窗(报告缺出处=不通过,内容面红线
  # 由 report-gen skill + golden 钉住)。对外下发仍走 send_* 的 R2 ask 行——产物≠已发送。
  - id: industrial-allow-report-job
    effect: allow
    tools: ['report_jobs']
    reason: 异步报告任务(提交/进度/产物引用,R1 档可逆写,产物落对象存储桩);对外下发仍走 send_* 确认(R2)
  # 草稿/写文件类交付物(可逆写,R1 档,静默+事后 diff 卡片)。
  - id: industrial-allow-draft-write
    effect: allow
    tools: ['write_*', 'draft_*']
    reason: 可逆草稿类交付物(R1 档,静默+事后变更卡片)
  # 红线③:对外发射类动作必须确认(R2 档)。
  - id: industrial-ask-external-send
    effect: ask
    tools: ['send_*', 'publish_*', 'submit_*']
    reason: 对外发送(通报/报告/短信/邮件)必须确认(R2 档,withhold-或-补偿)
default: ask
