name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  # 每日双形态 boot 门禁(33 号 §5 矩阵「每日(CI schedule)」列、§6 缺口 13;
  # 40 号 S-7/§9 Q8 暂定双轨:PR/push 面进 verify job,定时面独立 daily-boot-gate job。
  # cron 时点为实现自由度(Q8:任一固定时刻即可,不构成行为设计)。
  schedule:
    - cron: '19 21 * * *'
  # 发布说明截图流水线(55 号 §3.3 D5):手动触发,产物走 artifact,不自动提交。
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify(oxlint + tsc strict + vitest,20 包)
        run: pnpm -w run verify

      # 仓库卫生:DSH_HOME 运行态与凭据文件不得入库(2026-11-19 事故的护栏)。
      # 放在 verify 之后、boot 门禁之前——它比真启动便宜,却直接决定 G1-2 能否起。
      - name: 运行态目录与凭据入库扫描(runtime-home)
        run: node scripts/lint-no-runtime-home.mjs

      # 升级重渲染的用户配置移植回归(2026-11-19 生产事故:设置页新增的 LLM provider
      # 在模板变更重渲染后静默消失,存量会话逐轮 NO_ADAPTER)。剧本=entrypoint 同款
      # docker/profile/transplant-profile.mjs,node --test 零依赖。
      - name: profile 升级移植回归(transplant-profile)
        run: node --test docker/profile/transplant-profile.test.mjs

      # 双形态门禁三步(40 号 S-7,33 号 §6 缺口 13):与本地命令逐字同款
      # (G4-4 互证纪律:本地绿+CI 红先怀疑环境差异不许硬并,本地红就地修)。
      - name: 双形态依赖方向与挂载一致(form-check,G0-6)
        run: node tools/packctl/bin/packctl.mjs form-check

      - name: eterna-base 真启动门禁(G1-1)
        run: node scripts/verify-eterna-web.mjs

      - name: eterna-super 真启动门禁(G1-2)
        run: node scripts/verify-eterna-super.mjs

      - name: Lint 所有领域包(packs/*,逐包循环)
        run: |
          for d in packs/*/; do
            echo "== packctl lint $d"
            node tools/packctl/bin/packctl.mjs lint "$d"
          done

      - name: 隔离铁律扫描(packages/*,tenant-scan)
        run: node tools/packctl/bin/packctl.mjs tenant-scan

      - name: 提示词登记扫描(patch 键/section 使用/packs persona,prompt-scan)
        run: node tools/packctl/bin/packctl.mjs prompt-scan

      # 发布说明门禁(55 号 §5.3 ②):VERSION 与 releases/<v>/release.json 的存在、
      # 文案字数、图片尺寸/哈希/孤儿资产、announce 语义——12 条全过才允许合入。
      - name: 发布说明门禁(55 号,G-RN-01..12)
        run: node scripts/release-notes-gate.mjs

      - name: 评测 replay 冒烟(dsh-evals,t14-replay 子集)
        run: node tools/evals/bin/dsh-evals.mjs run --pack packs/event-planning --subset t14-replay --adapter replay

  # 每日双形态 boot 门禁(31 号 §4-2「双 boot 门禁进 CI」;33 号 §5 矩阵每日列、
  # §6 缺口 13;40 号 S-7):与 verify job 的三步逐字同款,每天固定时刻复跑——
  # 每 PR 是最低线,每日面捕获非 PR 路径(如上游依赖漂移)。
  daily-boot-gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: 双形态依赖方向与挂载一致(form-check,G0-6)
        run: node tools/packctl/bin/packctl.mjs form-check

      - name: eterna-base 真启动门禁(G1-1)
        run: node scripts/verify-eterna-web.mjs

      - name: eterna-super 真启动门禁(G1-2)
        run: node scripts/verify-eterna-super.mjs

  # 路由金集压缩态回放(nightly;35 号 G2-A9、53 号 §4-P1;28 号 §5 口径):
  # 判例(packages/tasks/tests/route-golden/entries.ts,20 条)生成式包装为 dsh-evals
  # replay pack,压缩前后各一遍,diff-pass-rate 差值 ≤2pp 判无衰减;节奏与 §12-10
  # 「挂 CI 还是发布门禁」的落位拍板联动,当前按 nightly 口径挂在本 schedule 面。
  # 现状(F2 复审修复后口径):压缩态回放需真实会话态(DSH 会话 + 压缩后 context
  # 重放器 + LLM 摘要),离线不可跑——第二遍暂为同口径复跑作管线保活。两遍 run 各落
  # run.json 口径指纹(pack+adapter+subset sha256,tools/evals/src/runner.ts),diff-pass-rate
  # 对指纹相同的恒真对比缺省拒绝判定(退出码 3「门禁未武装」),本 job 以
  # --allow-same-caliber 显式放行保活——衰减门禁在压缩态腿(指纹天然不同)就位前是
  # 显式豁免而非形似恒真;重放器就位后替换第二遍为压缩态 run,门禁自动武装,
  # 无需改本 job 与 diff-pass-rate。
  route-golden-nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: 判例生成 replay pack(route-golden → dsh-evals pack 契约)
        run: node scripts/route-golden-pack.mjs --out dsh-evals-out/route-golden-pack

      - name: 干净态回放一遍(dsh-evals,记录裁决面,20 条全过为门禁)
        run: node tools/evals/bin/dsh-evals.mjs run --pack dsh-evals-out/route-golden-pack --adapter replay --out dsh-evals-out/route-golden-baseline

      - name: 第二遍(重放器就位前为同口径保活;就位后替换为压缩态 run)
        run: node tools/evals/bin/dsh-evals.mjs run --pack dsh-evals-out/route-golden-pack --adapter replay --out dsh-evals-out/route-golden-compacted

      - name: 通过率差值门禁(≤2pp 无衰减,28 §5;超标退出码 1;同口径恒真对比退出码 3——保活期显式豁免)
        run: node scripts/diff-pass-rate.mjs dsh-evals-out/route-golden-baseline dsh-evals-out/route-golden-compacted --threshold 2 --allow-same-caliber

  # 发布说明截图流水线(55 号 §3.3 D5「截图 CI 自动化」)。
  # 逻辑=本地同一条命令:真启动隔离实例 → Chrome 按 shots.plan.json 走界面 →
  # Playwright 原生 webp → 产物 artifact。**不比对像素**(跨机器字体渲染天然有差异),
  # 也**不自动提交**截图(落库属发布动作);合规性由 release-notes-gate 断言。
  # 依赖:playwright-core 随 packages/browser-relay 已装,无需新增依赖。
  release-shots:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 截图所需的客户端工件:全仓逐包构建(任一缺 lib/client.js,对应行在浏览器里不激活)
      - name: 构建客户端工件(全仓 build:client)
        run: pnpm -r --if-present run build:client

      # runner 自带 Google Chrome;这一步兜住「channel:chrome 不可用」的环境差异
      - name: 安装 Chromium(playwright-core 自带 CLI)
        run: pnpm --filter @eterna/browser-relay exec playwright-core install chromium

      # super = 生产形态(任务工坊等行只在 super 模板里);base 见本地 --form=base
      - name: 自动截图(真启动 + 1440×900 浅色 + webp)
        run: node scripts/release-shots.mjs --version="$(tr -d '[:space:]' < VERSION)" --form=super --out .release-shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-shots
          path: .release-shots
          if-no-files-found: warn

  # 升级门禁(SOP 见 docs/upgrade-gate.md):上游 @deepseek-ai/dsh-* 升版时,
  # 本地先跑同款四步(docs/upgrade-gate.md §本地门禁),CI 复跑互证后才裁决放行/回滚。
  # dsh-evals 退出码:0=放行(全过) / 1=质量不达标(存在失败) / 2=基础设施错误(用法错误或无 case 可跑)。
  upgrade-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install(frozen-lockfile,锁文件与清单必须一致)
        run: pnpm install --frozen-lockfile

      - name: Verify(oxlint + tsc strict + vitest,20 包)
        run: pnpm -w run verify

      - name: Lint 所有领域包(packs/*)
        run: |
          for d in packs/*/; do
            echo "== packctl lint $d"
            node tools/packctl/bin/packctl.mjs lint "$d"
          done

      - name: 评测 replay 全量(dsh-evals,与本地命令一致,CI/本地互证)
        run: node tools/evals/bin/dsh-evals.mjs run --pack packs/event-planning --adapter replay

  # v1 自持线独立车道(B11 / 50 §3.3;验收 RC5-V1-001..007):core/{cordis,contracts,runtime}
  # + basis.yml + 六个 @basis/* 插件,与产品 profile 不同运行入口、不依赖 dsh 安装。
  # 路径过滤:只在 PR 触及 v1 源(含 workspace/lock 与本文件)时真跑,push 恒跑,
  # schedule 由 job 级 if 跳过——既有 verify/upgrade-gate/daily-boot-gate 语义不变。
  v1-line:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 变更检测需要 base...head 历史;默认 fetch-depth 1 拿不到 origin/<base>。
          fetch-depth: 0

      - name: v1 范围检测(PR 按改动过滤;push 恒跑)
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "match=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # diff 失败按“相关”处理(fail-open),不允许静默跳过 v1 门禁。
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD" || echo "__diff_failed__")
          echo "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(core/|basis\.yml$|packages/(system-prompt|session|tools|llm|approval-cli|agent-loop)/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/ci\.yml$|__diff_failed__$)'; then
            echo "match=true" >> "$GITHUB_OUTPUT"
          else
            echo "match=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.match == 'true'

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.match == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install(与主 verify 同锁)
        if: steps.scope.outputs.match == 'true'
        run: pnpm install --frozen-lockfile

      # 消费方(contracts/runtime/六插件)经 exports.types 吃 core/cordis/lib/types;
      # 该目录 gitignored,CI 必须先产声明,否则回落到 lib 源码按消费方严格度报错。
      - name: cordis 声明出口(lib/types,gitignored)
        if: steps.scope.outputs.match == 'true'
        run: pnpm --filter @core/cordis declarations

      - name: cordis vendor typecheck + smoke(RC5-V1-003/004)
        if: steps.scope.outputs.match == 'true'
        run: |
          pnpm --filter @core/cordis typecheck
          pnpm --filter @core/cordis test

      - name: contracts/runtime typecheck + test(RC5-V1-005)
        if: steps.scope.outputs.match == 'true'
        run: |
          pnpm --filter @core/contracts typecheck
          pnpm --filter @core/contracts test
          pnpm --filter @core/runtime typecheck
          pnpm --filter @core/runtime test

      - name: 六插件 typecheck + test
        if: steps.scope.outputs.match == 'true'
        run: |
          for d in system-prompt session tools llm approval-cli agent-loop; do
            echo "== @basis/$d typecheck/test"
            pnpm --filter "./packages/$d" typecheck
            pnpm --filter "./packages/$d" test
          done

      - name: v1 源不依赖产品线 dsh 包(RC5-V1-007)
        if: steps.scope.outputs.match == 'true'
        run: |
          if grep -RIn --include='*.ts' --include='*.mjs' '@deepseek-ai/dsh' \
            core packages/system-prompt packages/session packages/tools \
            packages/llm packages/approval-cli packages/agent-loop; then
            echo "v1 源出现产品线 @deepseek-ai/dsh 依赖(白名单:cosmokit/standard-schema)" >&2
            exit 1
          fi

      - name: basis.yml 六插件装载冒烟(chat EOF 退出;V1-005)
        if: steps.scope.outputs.match == 'true'
        run: node core/runtime/bin/basis.mjs chat --bundle basis.yml </dev/null

      - name: basis CLI 单 turn 冒烟(stub fixture)
        if: steps.scope.outputs.match == 'true'
        run: node core/runtime/bin/basis.mjs run "ping" --bundle core/runtime/tests/fixtures/basis-run.yml --json
