# Eterna Agent 本机容器部署(云端 agent:NAS 反代 → 本容器)。
#
# 首次启动:
#   1. cp deploy/env.production.example .env 并填 DEEPSEEK_API_KEY/MIMO_API_KEY/BIGMODEL_API_KEY
#      与管理员账号(ETERNA_ACCESS_ADMIN_USER / ETERNA_ACCESS_ADMIN_PASSWORD,首启自动播种),
#      并设 ETERNA_DATA_ROOT=<宿主绝对路径>(48 §5.1;缺省 $HOME/eterna-data)
#   2. bash deploy/init-data-dirs.sh
#   3. docker compose up -d --build
#   4. 访问 http://<本机局域网IP>:3210/login 用管理员账号登录(无需 token)
#
# 外网(用户自行配置 NAS 反代后):在 .env 设
#   ETERNA_PUBLIC_URL=https://eternity-electricity.cn:<端口>
#   ETERNA_TRUSTED_HOST=eternity-electricity.cn:<端口>
#   ETERNA_ACCESS_SECURE=1        # 反代终结 TLS 时(Secure cookie)
# 再 `docker compose up -d`(重渲染 profile,热生效)。
#
# 数据面(2026-11-20 rc.5,48 §4/§5;T43):
#   会话/存储/审计/用户库/agents 全部落宿主 bind 目录
#   `${ETERNA_DATA_ROOT:-$HOME/eterna-data}/<实例>`(默认实例名 super),升级镜像不丢数据。
#   缺省 `$HOME/eterna-data`(48 §5.1 的缺省口径;2026-11-20 W4 门禁修复把原 `:?`
#   硬必填改为缺省——否则无 .env 时 `docker compose config` 直接失败)。生产仍应在
#   .env 显式设绝对路径;「/data 未挂载」由 entrypoint mountpoint 预检 fail-closed。
#   容器内路径恒为 `/data`(48 §5.2:只换宿主源,不换容器目标)。
#
# 参数化(测试容器/多实例;50 §7.2):
#   ETERNA_CONTAINER_NAME  容器名(默认 eterna-agent)
#   ETERNA_PORT            web 宿主端口(默认 3210;测试用 3108,不撞生产)
#   ETERNA_RELAY_PORT      companion 中继宿主端口(默认 9310;测试换一个)
#   ETERNA_INSTANCE        数据根下实例目录(默认 super)
#   ETERNA_DATA_ROOT       宿主数据区根(绝对路径;缺省 $HOME/eterna-data)
#   ETERNA_IMAGE           镜像 tag(默认 eterna-agent:0.2.4)
#   ETERNA_FORM            web 服务形态(默认 super;仅 base|super——ACP 走独立 service,
#                          不要把 acp 设进 web 服务:它无 stdin/无 acp 模板挂载)

services:
  eterna-agent:
    build:
      context: .
      # 构建期 apt 换源逃生口(2026-11-20 构建事故):缺省空 = 走 Dockerfile 基镜像
      # 自带的 http://deb.debian.org(行为不变)。出口被墙时在 .env 里设
      # DEBIAN_MIRROR=https://mirrors.aliyun.com 再 `docker compose build`。
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
    image: ${ETERNA_IMAGE:-eterna-agent:0.2.4}
    container_name: ${ETERNA_CONTAINER_NAME:-eterna-agent}
    # cwd=数据根:审计/治理规则/记忆库默认落 $cwd/.eterna → 持久化在 bind 数据根
    working_dir: /data
    ports:
      - "${ETERNA_PORT:-3210}:8080"
      # companion 中继（浏览器执行面）：扩展 ws 连入腿。生产经 NAS 反代把
      # wss://域名/<前缀>/extension 转发到 本机:9310/extension（见 deploy/README.md）。
      - "${ETERNA_RELAY_PORT:-9310}:9310"
    environment:
      # 形态(2026-11-19 用户指令「把 superagent 加入恒灵」;31 号 §2.5 super=base⊕…,
      # 40 号 S-4):生产 3210 切 super 形态——同一镜像/端口/数据根,挂载面=base 全部 24 行
      # ⊕ super 专属 6 行(workbench/tasks/channels/interact/toolkit/tasks-access-bridge)。
      # entrypoint 据此选 cordis.super.patch.yml.template 渲染 $DSH_HOME/profiles/eterna-super,
      # 并守卫式补 @eterna/tasks|channels|interact|workbench|toolkit symlink。
      # 回退:设 ETERNA_FORM=base 或删本行(缺省=base)即回 eterna-web 形态。
      ETERNA_FORM: ${ETERNA_FORM:-super}
      # rc.5:容器内 home 恒为 /data(48 §5.2);用户级 AGENTS/skills 落 /data/agents(48 §6.2)
      DSH_HOME: /data
      DSH_AGENTS_HOME: /data/agents
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MIMO_API_KEY: ${MIMO_API_KEY:-}
      BIGMODEL_API_KEY: ${BIGMODEL_API_KEY:-}
      # OpenDesign(Go 套餐)直连(2026-11-12):llm-pi-ai opendesign 路由 apiKeyEnv
      OPENDESIGN_API_KEY: ${OPENDESIGN_API_KEY:-}
      ETERNA_PUBLIC_URL: ${ETERNA_PUBLIC_URL:-}
      ETERNA_TRUSTED_HOST: ${ETERNA_TRUSTED_HOST:-}
      # companion 中继鉴权与公网展示地址（红线 9）：TOKEN 缺省自动生成落卷
      # /data/relay-token；PUBLIC_URL=扩展实际连接地址（如
      # wss://eternity-electricity.cn/relay/extension），guide 页/报错文案按它展示
      ETERNA_RELAY_TOKEN: ${ETERNA_RELAY_TOKEN:-}
      ETERNA_RELAY_PUBLIC_URL: ${ETERNA_RELAY_PUBLIC_URL:-}
      # 账号门禁(eterna-access):admin 首启播种(表空时);SECRET 缺省自动生成落卷
      ETERNA_ACCESS_ADMIN_USER: ${ETERNA_ACCESS_ADMIN_USER:-}
      ETERNA_ACCESS_ADMIN_PASSWORD: ${ETERNA_ACCESS_ADMIN_PASSWORD:-}
      ETERNA_ACCESS_SECRET: ${ETERNA_ACCESS_SECRET:-}
      ETERNA_ACCESS_SECURE: ${ETERNA_ACCESS_SECURE:-}
      # 历史首屏分页预算(2026-11-24):每次历史请求的消息条数,缺省 30。
      # 上游客户端写死 500 条/至少 2 turn,长会话首屏一次取回近乎整份日志
      # (生产实测最坏 14.22 MB,前端长时间停在「载入历史…」);access 插件在
      # Host 侧把 events/page/follow 入参收到本值(只降不升、轮次跳转页放行),
      # 「加载更早」按同预算续页。留空=用缺省 30。
      ETERNA_HISTORY_PAGE_MESSAGES: ${ETERNA_HISTORY_PAGE_MESSAGES:-}
      # 插件市场一键发布(submit_plugin_to_market,2026-11-19):clone 目录/远端/
      # token(凭据只进 .env,绝不入被跟踪文件);TOKEN 缺席=发布停在 push 降级。
      ETERNA_MARKET_REPO_URL: ${ETERNA_MARKET_REPO_URL:-}
      ETERNA_MARKET_REPO_DIR: ${ETERNA_MARKET_REPO_DIR:-}
      ETERNA_MARKET_GITHUB_TOKEN: ${ETERNA_MARKET_GITHUB_TOKEN:-}
      # 个人 MCP(rc.5 B14/T26;生产接线 2026-11-20 W5):主密钥**只从 .secrets 文件**
      # 读(不进 env/argv/镜像);文件缺席=整面 fail-closed(设置页报不可用,系统层
      # 与其它功能不受影响)。生成:
      #   mkdir -p $ETERNA_DATA_ROOT/<实例>/.secrets
      #   openssl rand -base64 32 > .../.secrets/mcp-master-key && chmod 600 ...
      # 管理员目录(catalog)为空=不提供 stdio 模板,普通用户仍可自建 HTTP 服务器;
      # personalHttpHosts 留空=放行(http/私网可用,元数据地址仍拒——47 D22/H16 已拍板)。
      ETERNA_MCP_PERSONAL_ENABLED: ${ETERNA_MCP_PERSONAL_ENABLED:-true}
      ETERNA_MCP_MASTER_KEY_FILE: ${ETERNA_MCP_MASTER_KEY_FILE:-/data/.secrets/mcp-master-key}
      ETERNA_MCP_PERSONAL_CATALOG: ${ETERNA_MCP_PERSONAL_CATALOG:-}
      ETERNA_MCP_PERSONAL_HTTP_HOSTS: ${ETERNA_MCP_PERSONAL_HTTP_HOSTS:-}
      # 技能市场(2026-11-26):http 来源白名单(逗号分隔主机名;空=只允许 https)。
      # 公网市场(SkillHub)走 https,无需配置;内网自定义索引若只有 http 才需要。
      ETERNA_SKILL_MARKET_HTTP_HOSTS: ${ETERNA_SKILL_MARKET_HTTP_HOSTS:-}
    volumes:
      # 数据根 bind(48 §5.1;T43):宿主 `${ETERNA_DATA_ROOT}/<实例>` 整树挂 /data。
      # 缺省 `$HOME/eterna-data`(与 deploy/README.md §2、init-data-dirs.sh 一致)。
      # 2026-11-20 W4 门禁修复:原 `:?` 硬必填让 `docker compose config` 在无 .env 时
      # 直接报错(门禁三份 config 全红),故改为带缺省;「不静默写进仓库目录」由缺省值
      # 落在 $HOME 保证,「/data 未挂载」仍由 entrypoint 的 mountpoint 预检 fail-closed。
      - ${ETERNA_DATA_ROOT:-$HOME/eterna-data}/${ETERNA_INSTANCE:-super}:/data
      # 模板免重建挂载(2026-11-12):entrypoint 按模板哈希门控渲染卷内 profile
      # (模板未变保留用户文件,插件启停/模型设置跨重启持久;变更才重渲染+移植),
      # 镜像内烘焙的是构建时副本;挂载后模板改动 up -d 即生效,镜像重建(COPY . .)
      # 后内容一致,挂载可撤。
      - ./docker/profile/cordis.patch.yml.template:/repo/docker/profile/cordis.patch.yml.template:ro
      # super 形态模板(2026-11-19;ETERNA_FORM=super 时 entrypoint 选它):同款只读挂载,
      # 模板改动 up -d 即生效。base 模板挂载保留,支持随时回退。
      - ./docker/profile/cordis.super.patch.yml.template:/repo/docker/profile/cordis.super.patch.yml.template:ro
    restart: unless-stopped

  # ── ACP stdio 服务(2026-11-20 rc.5;T31/T43;47 B17 / 49 §5.7 / 50 §3.7)──────
  # ACP 是自动化客户端的**受信 stdio 面**,不是 Web 功能:
  #   - profiles:["acp"] → 缺省 `docker compose up` 不启动,只有显式 --profile acp 才起;
  #   - stdin_open + tty:false → 客户端拿到的 stdout 只有 dsh 的 JSON-RPC 帧;
  #   - 无 ports:只允许管理员/运维在本机用 `docker compose --profile acp run --rm -T` 驱动;
  #   - 与 web 共享同一 /data 实例根(47 §B17:不同会话可并行;entrypoint 的 flock
  #     串行化 profile 渲染,不并发写 manifest/patch);
  #   - 镜像沿用 web 服务的 build/tag(不单独 COPY);healthcheck 关闭(无 8080)。
  # ACP 客户端可指定容器内绝对 cwd 与 stdio/HTTP MCP:只在本机受信运行,勿接终端用户。
  eterna-agent-acp:
    image: ${ETERNA_IMAGE:-eterna-agent:0.2.4}
    container_name: ${ETERNA_CONTAINER_NAME:-eterna-agent}-acp
    profiles: ["acp"]
    stdin_open: true
    tty: false
    working_dir: /data
    # 无 ports(ACP 不监听网络);镜像级 HEALTHCHECK 探 8080,对 ACP 无意义,关掉。
    healthcheck:
      disable: true
    environment:
      ETERNA_FORM: acp
      DSH_HOME: /data
      DSH_AGENTS_HOME: /data/agents
      # ACP 模板 llm-pi-ai/acp 行走 MiMo 直连(50 §3.7),只需要 MiMo 密钥;
      # 不注入 DEEPSEEK/BIGMODEL(最小权限,ACP 模板已禁 llm-deepseek 系行)。
      MIMO_API_KEY: ${MIMO_API_KEY:-}
    volumes:
      # 与 web 同一实例根(47 B17「与 web 共享 /data」):会话/日志跨进程可见。
      # 与 web 同一实例根(47 B17「与 web 共享 /data」):会话/日志跨进程可见。
      - ${ETERNA_DATA_ROOT:-$HOME/eterna-data}/${ETERNA_INSTANCE:-super}:/data
      # ACP patch 模板只读挂载(同 web 先例):模板改动 up -d 即生效。
      - ./docker/profile/cordis.acp.patch.yml.template:/repo/docker/profile/cordis.acp.patch.yml.template:ro
    # stdio 服务由调用方持有生命周期,不做自动重启。
    restart: "no"