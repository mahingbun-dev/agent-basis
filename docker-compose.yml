# Eterna Agent 本机容器部署(云端 agent:NAS 反代 → 本容器)。
#
# 首次启动:
#   1. cp .env.example .env 并填 DEEPSEEK_API_KEY/MIMO_API_KEY/BIGMODEL_API_KEY 与管理员账号
#      (ETERNA_ACCESS_ADMIN_USER / ETERNA_ACCESS_ADMIN_PASSWORD,首启自动播种)
#   2. docker compose up -d --build
#   3. 访问 http://<本机局域网IP>:3210/login 用管理员账号登录(无需 token)
#
# 外网(用户自行配置 NAS 反代后):在 .env 设
#   ETERNA_PUBLIC_URL=https://eternity-electricity.cn:<端口>
#   ETERNA_TRUSTED_HOST=eternity-electricity.cn:<端口>
#   ETERNA_ACCESS_SECURE=1        # 反代终结 TLS 时(Secure cookie)
# 再 `docker compose up -d`(重渲染 profile,热生效)。
#
# 会话/存储/审计/用户库全部落 named volume eterna-home,升级镜像不丢数据。

services:
  eterna-agent:
    build: .
    image: eterna-agent:0.1.0
    container_name: eterna-agent
    # cwd=卷根:审计/治理规则/记忆库默认落 $cwd/.eterna → 持久化在 eterna-home 卷
    working_dir: /data
    ports:
      - "3210:8080"
      # companion 中继（浏览器执行面）：扩展 ws 连入腿。生产经 NAS 反代把
      # wss://域名/<前缀>/extension 转发到 本机:9310/extension（见 deploy/README.md）。
      - "9310:9310"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MIMO_API_KEY: ${MIMO_API_KEY:-}
      BIGMODEL_API_KEY: ${BIGMODEL_API_KEY:-}
      # OpenDesign(Go 套餐)直连(2026-11-12):llm-pi-ai opendesign 路由 apiKeyEnv
      OPENDESIGN_API_KEY: ${OPENDESIGN_API_KEY:-}
      ETERNA_PUBLIC_URL: ${ETERNA_PUBLIC_URL:-}
      ETERNA_TRUSTED_HOST: ${ETERNA_TRUSTED_HOST:-}
      # companion 中继鉴权与公网展示地址（红线 9）：TOKEN 缺省自动生成落卷
      # /data/relay-token；PUBLIC_URL=扩展实际连接地址（如
      # wss://eternity-electricity.cn/relay/extension），guide 页/报错文案按它展示
      ETERNA_RELAY_TOKEN: ${ETERNA_RELAY_TOKEN:-}
      ETERNA_RELAY_PUBLIC_URL: ${ETERNA_RELAY_PUBLIC_URL:-}
      # 账号门禁(eterna-access):admin 首启播种(表空时);SECRET 缺省自动生成落卷
      ETERNA_ACCESS_ADMIN_USER: ${ETERNA_ACCESS_ADMIN_USER:-}
      ETERNA_ACCESS_ADMIN_PASSWORD: ${ETERNA_ACCESS_ADMIN_PASSWORD:-}
      ETERNA_ACCESS_SECRET: ${ETERNA_ACCESS_SECRET:-}
      ETERNA_ACCESS_SECURE: ${ETERNA_ACCESS_SECURE:-}
    volumes:
      - eterna-home:/data
      # 模板免重建挂载(2026-11-12):entrypoint 每次启动 cp 本文件渲染卷内 profile,
      # 镜像内烘焙的是构建时副本;挂载后模板改动 up -d 即生效,镜像重建(COPY . .)
      # 后内容一致,挂载可撤。
      - ./docker/profile/cordis.patch.yml.template:/repo/docker/profile/cordis.patch.yml.template:ro
    restart: unless-stopped

volumes:
  eterna-home:
