packages:
  # L1 基座插件(governance / memory / interact / evals / knowledge / observe / evolve / channels / cache-guard / extra / prompt-studio / audit)
  - packages/*
  # 跨行业工具与 CLI(packctl / evals CLI 等)及约定载体包
  - tools/*
  # 自持内核与 seam 契约(@core/cordis / @core/contracts / @core/runtime),packages/* 以 workspace:* 引用
  - core/*

allowBuilds:
  '@google/genai': true
  protobufjs: true
  '@deepseek-ai/dsh-subprocess-local': true
  esbuild: true
  koffi: true
  node-pty: true

# 依赖版本单一事实源:所有包用 "catalog:" 引用,升级只改这里。
# @deepseek-ai/dsh-* 钉在与 deepseek-harness 相同的 0.2.2-alpha.2(seam 类型即取自该版本)。
catalog:
  '@deepseek-ai/cordis': 4.0.6-alpha.1
  # @core/cordis(vendor 自 4.0.6-alpha.1)运行时依赖:与上游同版约束
  '@deepseek-ai/cosmokit': ~1.8.7-alpha.1
  '@standard-schema/spec': ^1.1.0
  '@deepseek-ai/dsh-agent': 0.2.2-alpha.2
  # extra(T13):reviewer preset 产物的行形态与 persona/子代理委派 seam 类型
  # compaction(2026-11-12 fork 的上下文压缩家族)补齐同族钉版:seam 契约包、
  # 值工具与命令 seam 类型;schemastery 与 llm-openai 同线,供配置 schema 使用。
  '@deepseek-ai/dsh-commands': 0.2.2-alpha.2
  '@deepseek-ai/dsh-compaction': 0.2.2-alpha.2
  '@deepseek-ai/dsh-token-meter': 0.2.2-alpha.2
  '@deepseek-ai/dsh-util-values': 0.2.2-alpha.2
  '@deepseek-ai/schemastery': ~3.19.0
  '@deepseek-ai/dsh-agent-preset': 0.2.2-alpha.2
  '@deepseek-ai/dsh-llm': 0.2.2-alpha.2
  '@deepseek-ai/dsh-message-feedback': 0.2.2-alpha.2
  '@deepseek-ai/dsh-permission-presets': 0.2.2-alpha.2
  # extra(T13):persona 行(reviewer persona 模板)与 subagent 委派(挂 reviewer preset)
  '@deepseek-ai/dsh-persona': 0.2.2-alpha.2
  '@deepseek-ai/dsh-sandbox': 0.2.2-alpha.2
  '@deepseek-ai/dsh-subagent': 0.2.2-alpha.2
  '@deepseek-ai/dsh-session': 0.2.2-alpha.2
  '@deepseek-ai/dsh-storage': 0.2.2-alpha.2
  # memory:systemPrompt.section 注入 seam 的 PromptSection 类型
  '@deepseek-ai/dsh-system-prompt': 0.2.2-alpha.2
  '@deepseek-ai/dsh-storage-domain': 0.2.2-alpha.2
  '@deepseek-ai/dsh-tools': 0.2.2-alpha.2
  # tools/evals(T4)以 catalog: 引用;补齐同一 0.2.2-alpha.2 钉版家族,否则全仓 install 失败
  '@deepseek-ai/dsh-user-approval': 0.2.2-alpha.2
  '@deepseek-ai/dsh-user-questions': 0.2.2-alpha.2
  # panel(T19):Host 半边 EternaPanelGateway 的 Remote/TypertRemoteService 基类
  '@deepseek-ai/dsh-typert-protocol': 0.2.2-alpha.2
  # panel(T19):浏览器半边 bundle 构建(esbuild)与 React(运行时 react 由 dsh web
  # 壳基线模块表注入,这里仅构建期装载与单测执行使用)
  esbuild: 0.28.2
  react: 18.3.1
  '@types/react': 18.3.31
  '@stylistic/eslint-plugin': ^5.10.0
  '@types/node': ^24.10.1
  'eslint-plugin-sonarjs': ^4.2.0
  # channels:仅取其类型定义(SMTP transport 形态),不建真实连接
  nodemailer: 10.3.1
  # tasks(35 号 A4):策略/准入/设置面的 schema 纪律用 zod(.strict()+.describe()+默认值,
  # 34 §2 通用要点⑥);钉 SA dsh-superagent-prototype 同版 4.4.3(schema API 语义同源)。
  zod: 4.4.3
  oxlint: 1.81.0
  oxlint-tsgolint: 7.0.2001
  typescript: ^6.0.3
  vitest: ^4.1.11
  yaml: ^2.9.1

# pnpm 经典字段(与 allowBuilds 双保险):允许原生模块构建脚本
onlyBuiltDependencies:
  - esbuild
  - '@deepseek-ai/dsh-subprocess-local'
  - koffi
  - node-pty

# pnpm 11 权威设置位(2026-11-16):镜像构建期 -r run 前的 depsStatusCheck
# 子 install 会重解析 glue 新 peer 树,私有 optional 包公网 404 → 构建断。
# .npmrc 与 npm_config_* ENV 均拦不住,唯此处生效(容器实测)。
verifyDepsBeforeRun: false
