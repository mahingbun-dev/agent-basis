packages:
  # L1 基座插件(governance / memory / interact / evals / knowledge / observe / evolve / channels / cache-guard / extra)
  - packages/*
  # 跨行业工具与 CLI(packctl / evals CLI 等)及约定载体包
  - tools/*

allowBuilds:
  esbuild: true

# T21:glue/memory 面向插件市场(git 安装)声明了 git 钉标签的兄弟依赖 spec
# (#basis-pkgs → 指向包含本套修复的提交,见 market/index.json)。仓库内开发时用
# overrides 映回 workspace 链接——本地改动即时生效,发布语义留给 git 安装路径。
overrides:
  '@basis/governance': 'workspace:*'
  '@basis/knowledge': 'workspace:*'
  '@basis/memory': 'workspace:*'

# 依赖版本单一事实源:所有包用 "catalog:" 引用,升级只改这里。
# @deepseek-ai/dsh-* 钉在与 ../dsh-repo 相同的 0.2.2-alpha.2(seam 类型即取自该版本)。
catalog:
  '@deepseek-ai/cordis': 4.0.6-alpha.1
  '@deepseek-ai/dsh-agent': 0.2.2-alpha.2
  # extra(T13):reviewer preset 产物的行形态与 persona/子代理委派 seam 类型
  '@deepseek-ai/dsh-agent-preset': 0.2.2-alpha.2
  '@deepseek-ai/dsh-llm': 0.2.2-alpha.2
  '@deepseek-ai/dsh-message-feedback': 0.2.2-alpha.2
  '@deepseek-ai/dsh-permission-presets': 0.2.2-alpha.2
  # extra(T13):persona 行(reviewer persona 模板)与 subagent 委派(挂 reviewer preset)
  '@deepseek-ai/dsh-persona': 0.2.2-alpha.2
  '@deepseek-ai/dsh-sandbox': 0.2.2-alpha.2
  '@deepseek-ai/dsh-subagent': 0.2.2-alpha.2
  '@deepseek-ai/dsh-session': 0.2.2-alpha.2
  '@deepseek-ai/dsh-storage': 0.2.2-alpha.2
  # memory:systemPrompt.section 注入 seam 的 PromptSection 类型
  '@deepseek-ai/dsh-system-prompt': 0.2.2-alpha.2
  '@deepseek-ai/dsh-storage-domain': 0.2.2-alpha.2
  '@deepseek-ai/dsh-tools': 0.2.2-alpha.2
  # tools/evals(T4)以 catalog: 引用;补齐同一 0.2.2-alpha.2 钉版家族,否则全仓 install 失败
  '@deepseek-ai/dsh-user-approval': 0.2.2-alpha.2
  '@deepseek-ai/dsh-user-questions': 0.2.2-alpha.2
  # panel(T19):Host 半边 BasisPanelGateway 的 Remote/TypertRemoteService 基类
  '@deepseek-ai/dsh-typert-protocol': 0.2.2-alpha.2
  # panel(T19):浏览器半边 bundle 构建(esbuild)与 React(运行时 react 由 dsh web
  # 壳基线模块表注入,这里仅构建期装载与单测执行使用)
  esbuild: 0.28.2
  react: 18.3.1
  '@types/react': 18.3.31
  '@stylistic/eslint-plugin': ^5.10.0
  '@types/node': ^24.10.1
  'eslint-plugin-sonarjs': ^4.2.0
  # channels:仅取其类型定义(SMTP transport 形态),不建真实连接
  nodemailer: 10.3.1
  oxlint: 1.81.0
  oxlint-tsgolint: 7.0.2001
  typescript: ^6.0.3
  vitest: ^4.1.11
  yaml: ^2.9.1
