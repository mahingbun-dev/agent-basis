<!DOCTYPE html>
<html lang="zh-CN" data-zcode-design>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #111110;
    --bg-subtle: #191918;
    --surface: #1e1e1d;
    --surface-raised: #252524;
    --border: rgba(255,255,255,0.06);
    --border-hover: rgba(255,255,255,0.12);
    --accent: #c89b6c;
    --accent-dim: rgba(200,155,108,0.15);
    --text: #e8e6e3;
    --text-secondary: rgba(232,230,227,0.6);
    --text-tertiary: rgba(232,230,227,0.32);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.35), 0 2px 6px rgba(0,0,0,0.25);
    --shadow-lg: 0 12px 40px rgba(0,0,0,0.45), 0 4px 12px rgba(0,0,0,0.3);
    --shadow-drag: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1.5px var(--accent);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-xl: 20px;
    --font-sans: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --font-mono: "SF Mono", "Fira Code", "JetBrains Mono", "Cascadia Code", monospace;
    --note-bg: #2a2520;
    --note-border: rgba(200,155,108,0.2);
    --transition-fast: 120ms cubic-bezier(0.25, 0.1, 0.25, 1);
    --transition-normal: 200ms cubic-bezier(0.25, 0.1, 0.25, 1);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: var(--font-sans);
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* grain overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 9999;
    pointer-events: none;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 512px 512px;
    mix-blend-mode: overlay;
  }

  /* ===== canvas viewport ===== */
  .canvas-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    cursor: grab;
  }
  .canvas-viewport.panning { cursor: grabbing; }

  .canvas-world {
    position: absolute;
    left: 0; top: 0;
    width: 20000px; height: 20000px;
    transform-origin: 0 0;
    will-change: transform;
  }

  /* ===== dot grid ===== */
  .canvas-viewport {
    --grid-color: rgba(255,255,255,0.04);
  }

  /* ===== draggable elements ===== */
  .canvas-el {
    position: absolute;
    cursor: grab;
    transition: box-shadow var(--transition-normal), transform var(--transition-fast);
  }
  .canvas-el:hover { z-index: 10; }
  .canvas-el.dragging {
    cursor: grabbing;
    z-index: 999;
    box-shadow: var(--shadow-drag) !important;
    transform: scale(1.01);
    transition: none;
  }

  /* ===== section header ===== */
  .section-header {
    position: absolute;
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 16px;
    white-space: nowrap;
  }
  .section-header .section-num {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--accent);
    opacity: 0.8;
  }
  .section-header .section-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-tertiary);
  }
  .section-header .section-line {
    flex: none;
    width: 48px;
    height: 1px;
    background: linear-gradient(90deg, var(--accent) 0%, transparent 100%);
    opacity: 0.3;
  }

  /* ===== title ===== */
  .canvas-title {
    position: absolute;
    pointer-events: none;
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.025em;
    color: var(--text);
  }

  /* ===== text block ===== */
  .canvas-text {
    position: absolute;
    line-height: 1.7;
    letter-spacing: 0.005em;
    color: var(--text-secondary);
    min-width: 200px;
    max-width: 560px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* ===== tag ===== */
  .canvas-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 14px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--text-secondary);
    background: var(--surface);
    border: 1px solid var(--border);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: border-color var(--transition-fast), background var(--transition-fast);
    white-space: nowrap;
  }
  .canvas-tag:hover {
    border-color: var(--border-hover);
    background: var(--surface-raised);
  }
  .canvas-tag .tag-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  /* ===== context card ===== */
  .context-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    min-width: 220px;
    transition: border-color var(--transition-normal), box-shadow var(--transition-normal);
  }
  .context-card:hover {
    border-color: var(--border-hover);
    box-shadow: var(--shadow-md);
  }
  .context-card .card-head {
    padding: 16px 20px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .context-card .card-head .head-indicator {
    width: 3px;
    height: 16px;
    border-radius: 2px;
    background: var(--accent);
    flex-shrink: 0;
  }
  .context-card .card-head h3 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--text);
  }
  .context-card .card-content {
    padding: 0 20px 20px;
    font-size: 13px;
    line-height: 1.7;
    color: var(--text-secondary);
  }
  .context-card .card-content ul {
    list-style: none;
    padding: 0;
  }
  .context-card .card-content li {
    padding: 4px 0;
    padding-left: 12px;
    position: relative;
  }
  .context-card .card-content li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 11px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--text-tertiary);
  }

  /* ===== design system card ===== */
  .ds-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    transition: border-color var(--transition-normal), box-shadow var(--transition-normal);
  }
  .ds-card:hover {
    border-color: var(--border-hover);
    box-shadow: var(--shadow-md);
  }
  .ds-card .ds-head {
    padding: 16px 20px 12px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-tertiary);
  }
  .ds-card .ds-body {
    padding: 0 20px 20px;
  }

  /* color type */
  .ds-card .color-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(48px, 1fr));
    gap: 8px;
  }
  .ds-card .color-chip {
    aspect-ratio: 1;
    border-radius: var(--radius-sm);
    position: relative;
    transition: transform var(--transition-fast);
  }
  .ds-card .color-chip:hover { transform: scale(1.08); }
  .ds-card .color-chip .chip-label {
    position: absolute;
    bottom: -18px;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-tertiary);
    white-space: nowrap;
  }

  /* typography type */
  .ds-card .type-stack {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .ds-card .type-row {
    display: flex;
    align-items: baseline;
    gap: 16px;
  }
  .ds-card .type-label {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-tertiary);
    min-width: 36px;
    flex-shrink: 0;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .ds-card .type-sample {
    color: var(--text);
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ===== color swatch (standalone) ===== */
  .color-swatch-group {
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    gap: 20px;
  }
  .swatch-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .swatch-circle {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,0.08);
    transition: transform var(--transition-fast), box-shadow var(--transition-fast);
  }
  .swatch-circle:hover {
    transform: scale(1.1);
    box-shadow: var(--shadow-md);
  }
  .swatch-name {
    font-size: 10px;
    font-weight: 500;
    color: var(--text-secondary);
    text-align: center;
  }
  .swatch-hex {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-tertiary);
    text-align: center;
  }

  /* ===== type sample (standalone) ===== */
  .type-sample-group {
    display: flex;
    flex-direction: column;
    gap: 20px;
    min-width: 400px;
  }
  .type-sample-row {
    display: flex;
    align-items: baseline;
    gap: 20px;
  }
  .type-sample-meta {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-tertiary);
    min-width: 48px;
    flex-shrink: 0;
    letter-spacing: 0.04em;
  }
  .type-sample-text {
    color: var(--text);
    line-height: 1.25;
  }

  /* ===== note (sticky) ===== */
  .canvas-note {
    background: var(--note-bg);
    border: 1px solid var(--note-border);
    border-radius: var(--radius-md);
    padding: 16px 18px;
    min-width: 200px;
    max-width: 300px;
    box-shadow: var(--shadow-sm);
    transition: box-shadow var(--transition-normal), transform var(--transition-fast);
  }
  .canvas-note:hover {
    box-shadow: var(--shadow-md);
  }
  .canvas-note .note-tag {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    opacity: 0.7;
    margin-bottom: 8px;
  }
  .canvas-note .note-body {
    font-size: 13px;
    line-height: 1.65;
    color: var(--text-secondary);
  }

  /* ===== design page ===== */
  .design-page {
    background: #fff;
    border-radius: var(--radius-md);
    overflow: hidden;
    box-shadow: var(--shadow-lg);
    transition: box-shadow var(--transition-normal);
  }
  .design-page:hover {
    box-shadow: 0 16px 56px rgba(0,0,0,0.5), 0 6px 16px rgba(0,0,0,0.35);
  }
  .design-page .page-content {
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  .page-label {
    position: absolute;
    bottom: -32px;
    left: 0;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--text-tertiary);
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .page-label .label-num {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--accent);
    opacity: 0.6;
  }

  /* ===== diagram ===== */
  .canvas-diagram {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .canvas-diagram .diagram-content {
    width: 100%;
    height: 100%;
    padding: 20px;
  }

  /* ===== zoom controls ===== */
  .zoom-controls {
    position: fixed;
    bottom: 24px; right: 24px;
    display: flex;
    align-items: center;
    gap: 1px;
    z-index: 100;
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
    box-shadow: var(--shadow-md);
  }
  .zoom-btn {
    width: 36px; height: 36px;
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background var(--transition-fast), color var(--transition-fast);
  }
  .zoom-btn:hover {
    background: rgba(255,255,255,0.06);
    color: var(--text);
  }
  .zoom-btn:active {
    background: rgba(255,255,255,0.03);
  }
  .zoom-label {
    min-width: 50px; height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-tertiary);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }

  /* ===== coord indicator ===== */
  .coord-indicator {
    position: fixed;
    bottom: 28px; left: 24px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.04em;
    color: var(--text-tertiary);
    z-index: 100;
    padding: 4px 10px;
    background: rgba(17,17,16,0.85);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  /* ===== keyboard hint ===== */
  .kbd-hint {
    position: fixed;
    top: 20px; right: 24px;
    z-index: 100;
    font-size: 10px;
    color: var(--text-tertiary);
    display: flex;
    gap: 12px;
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }
  .canvas-viewport:hover ~ .kbd-hint { opacity: 1; }
  .kbd-hint kbd {
    font-family: var(--font-mono);
    padding: 2px 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 10px;
  }
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="canvas-viewport" id="viewport">
  <div class="canvas-world" id="world"></div>
</div>

<div class="zoom-controls">
  <button class="zoom-btn" id="zoomOut" aria-label="">&#8722;</button>
  <div class="zoom-label" id="zoomLabel">100%</div>
  <button class="zoom-btn" id="zoomIn" aria-label="">+</button>
  <button class="zoom-btn" id="zoomReset" title="" aria-label="">&#8962;</button>
</div>

<div class="coord-indicator" id="coordIndicator">0, 0</div>

<div class="kbd-hint" id="kbdHint"></div>

<script>
(() => {
  // ═══════════════════════════════════════════════════════════
  // LOCALIZE: instantiating agent MUST translate every value in
  // UI_STRINGS to the user's conversation language. Machine fields
  // (id/class/data-*) remain English.
  // ═══════════════════════════════════════════════════════════
  const UI_STRINGS = {
    docTitle: '实时评测 · 设计与原型 · EternaAgent',
    demoTitle: 'Agent 实时评测',
    projectDescription: '基于当前会话轨迹的在线评测：规则随事件即时更新，每轮结束后增量出裁判分，会话空闲后整条终评。面向结果与面向过程并存，通用指标与业务指标并列，业务指标在前端配置、保存即生成 YAML。',
    tags: ['结果 + 过程', '业务指标前端可配', '保存即生成 YAML', '不建独立页面'],
    contextCards: {
      problem: { title: '要解决的问题', items: ['会话跑完才知道好坏，问题发现得太晚', '只有离线金集，看不到线上单个会话的表现', '业务红线（审批、禁语）没有逐会话的可视证据'] },
      choices: { title: '关键取舍', items: ['结果指标判通过；过程指标只做诊断', '规则全量零成本；裁判抽样、异步、可重试', '「评不了」单独成态，绝不记 0 分'] },
      cadence: { title: '三档时机', items: ['L0 即时：确定性指标随事件流更新', 'L1 轮末：抽样步骤级裁判出分', 'L2 终评：会话空闲后整条评结果'] }
    },
    notes: {
      review: { tag: '评审提示', body: '每屏截图取自真实渲染的原型（同目录 06-实时评测-可交互原型.html）。深浅两套主题、1440 / 900 / 390 三个视口均已实测。' },
      boundary: { tag: '边界', body: '不做同步拦截与运行时干预；不做数据集管理与红队。那些属于离线门禁与平台侧，不在本功能范围。' }
    },
    sections: { context: '01 项目背景', designSystem: '02 设计系统', deliverables: '03 屏幕与流转' },
    zoom: { zoomIn: '放大', zoomOut: '缩小', reset: '重置视图' },
    kbdHints: [['滚动', '平移'], ['Ctrl / ⌘ + 滚动', '缩放'], ['Ctrl / ⌘ + Z', '撤销']]
  };

  // Chrome strings live in UI_STRINGS too — applied here so the static HTML
  // above carries no visible copy at all (machine-checkable invariant).
  document.title = UI_STRINGS.docTitle;
  document.getElementById('zoomIn').setAttribute('aria-label', UI_STRINGS.zoom.zoomIn);
  document.getElementById('zoomOut').setAttribute('aria-label', UI_STRINGS.zoom.zoomOut);
  document.getElementById('zoomReset').setAttribute('aria-label', UI_STRINGS.zoom.reset);
  document.getElementById('kbdHint').innerHTML = UI_STRINGS.kbdHints
    .map(([keys, action]) => `<span><kbd>${keys}</kbd> ${action}</span>`)
    .join('');

  const viewport = document.getElementById('viewport');
  const world = document.getElementById('world');
  const zoomLabel = document.getElementById('zoomLabel');
  const coordIndicator = document.getElementById('coordIndicator');

  /* ===== canvas state ===== */
  let panX = 0, panY = 0, zoom = 1;
  const MIN_ZOOM = 0.05, MAX_ZOOM = 8;

  function updateTransform() {
    world.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
    zoomLabel.textContent = Math.round(zoom * 100) + '%';
    updateGrid();
  }

  /* ===== dot grid ===== */
  function updateGrid() {
    const g = 40 * zoom;
    const ox = panX % g, oy = panY % g;
    viewport.style.backgroundImage = `radial-gradient(circle, var(--grid-color) 0.8px, transparent 0.8px)`;
    viewport.style.backgroundSize = `${g}px ${g}px`;
    viewport.style.backgroundPosition = `${ox}px ${oy}px`;
  }

  /* ===== panning ===== */
  let isPanning = false, panSX, panSY;

  viewport.addEventListener('pointerdown', (e) => {
    if (e.target === viewport || e.target === world) {
      isPanning = true;
      panSX = e.clientX - panX;
      panSY = e.clientY - panY;
      viewport.classList.add('panning');
      viewport.setPointerCapture(e.pointerId);
      e.preventDefault();
    }
  });
  viewport.addEventListener('pointermove', (e) => {
    if (!isPanning) return;
    panX = e.clientX - panSX;
    panY = e.clientY - panSY;
    updateTransform();
  });
  viewport.addEventListener('pointerup', () => {
    isPanning = false;
    viewport.classList.remove('panning');
  });

  /* ===== wheel: trackpad scroll = pan, pinch/ctrl+scroll = zoom ===== */
  viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = viewport.getBoundingClientRect();

    if (e.ctrlKey || e.metaKey) {
      const mx = e.clientX - rect.left, my = e.clientY - rect.top;
      const wx = (mx - panX) / zoom, wy = (my - panY) / zoom;
      const factor = e.deltaY > 0 ? 0.95 : 1.05;
      zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));
      panX = mx - wx * zoom;
      panY = my - wy * zoom;
    } else {
      const hasX = Math.abs(e.deltaX) > 0.5;
      if (hasX || Math.abs(e.deltaX) > Math.abs(e.deltaY) * 0.3) {
        panX -= e.deltaX;
        panY -= e.deltaY;
      } else {
        const mx = e.clientX - rect.left, my = e.clientY - rect.top;
        const wx = (mx - panX) / zoom, wy = (my - panY) / zoom;
        const factor = e.deltaY > 0 ? 0.95 : 1.05;
        zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));
        panX = mx - wx * zoom;
        panY = my - wy * zoom;
      }
    }
    updateTransform();
  }, { passive: false });

  /* ===== zoom buttons ===== */
  function zoomAt(factor) {
    const r = viewport.getBoundingClientRect();
    const cx = r.width / 2, cy = r.height / 2;
    const wx = (cx - panX) / zoom, wy = (cy - panY) / zoom;
    zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));
    panX = cx - wx * zoom;
    panY = cy - wy * zoom;
    updateTransform();
  }

  document.getElementById('zoomOut').onclick = () => zoomAt(0.8);
  document.getElementById('zoomReset').onclick = () => { zoom = 1; panX = 0; panY = 0; updateTransform(); };

  /* ===== coord indicator ===== */
  viewport.addEventListener('pointermove', (e) => {
    if (isPanning) return;
    const r = viewport.getBoundingClientRect();
    coordIndicator.textContent = `${Math.round((e.clientX - r.left - panX) / zoom)}, ${Math.round((e.clientY - r.top - panY) / zoom)}`;
  });

  /* ===== touch gestures ===== */
  let lastPinchDist = null, lastPinchCenter = null;

  viewport.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      const t0 = e.touches[0], t1 = e.touches[1];
      lastPinchDist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
      lastPinchCenter = { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 };
      e.preventDefault();
    }
  }, { passive: false });

  viewport.addEventListener('touchmove', (e) => {
    if (e.touches.length !== 2) return;
    e.preventDefault();
    const t0 = e.touches[0], t1 = e.touches[1];
    const dist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
    const center = { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 };
    if (lastPinchDist > 0) {
      const r = viewport.getBoundingClientRect();
      const mx = center.x - r.left, my = center.y - r.top;
      const wx = (mx - panX) / zoom, wy = (my - panY) / zoom;
      zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * Math.pow(dist / lastPinchDist, 0.6)));
      panX = mx - wx * zoom;
      panY = my - wy * zoom;
    }
    if (lastPinchCenter) {
      panX += center.x - lastPinchCenter.x;
      panY += center.y - lastPinchCenter.y;
    }
    lastPinchDist = dist;
    lastPinchCenter = center;
    updateTransform();

  /* ===== undo ===== */
  const undoStack = [];
  function saveUndo() {
    const s = [];
    world.querySelectorAll('.canvas-el').forEach(el => {
      s.push({ id: el.id, left: el.style.left, top: el.style.top });
    });
    undoStack.push({ panX, panY, zoom, assets: s });
    if (undoStack.length > 60) undoStack.shift();
  }
  function undo() {
    if (!undoStack.length) return;
    const st = undoStack.pop();
    panX = st.panX; panY = st.panY; zoom = st.zoom;
    st.assets.forEach(a => {
      const el = document.getElementById(a.id);
      if (el) { el.style.left = a.left; el.style.top = a.top; }

    let dragging = false, sx, sy, ox, oy;
    el.addEventListener('pointerdown', (e) => {

      dragging = true;
      el.classList.add('dragging');
      saveUndo();
      sx = e.clientX; sy = e.clientY;
      ox = parseFloat(el.style.left); oy = parseFloat(el.style.top);
      el.setPointerCapture(e.pointerId);
      e.stopPropagation();
    });
    el.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      el.style.left = (ox + (e.clientX - sx) / zoom) + 'px';
      el.style.top = (oy + (e.clientY - sy) / zoom) + 'px';

    });

    const r3Start = maxY([colorCard, typeCard, compCard], 80);
    addSection(r3Start, UI_STRINGS.sections.deliverables);
    const pagesY = r3Start + 50;
    const W = 720, H = 450, GAP_X = 40, GAP_Y = 56;
    const shots = [
      ['01-会话内评测-浅-1440', '会话内评测面板 · 结论与分项（浅）'],
      ['02-指标库-浅-1440', '设置 › 指标库（内置与业务）'],
      ['03-指标编辑器与YAML-浅-1440', '指标编辑器 · 右侧实时 YAML'],
      ['04-导入YAML-浅-1440', '导入 YAML · 解析后进编辑器'],
      ['05-生效规则-浅-1440', '生效规则 · 时机与采样'],
      ['06-裁判模型与试跑-浅-1440', '裁判模型 · 自检与试跑'],
      ['07-裁判校准-浅-1440', '校准 · 一致率与混淆矩阵'],
      ['08-评测总览-浅-1440', '评测总览 · 通过率与成本'],
      ['09-终评完成-浅-1440', '终评完成态'],
      ['10-评测失败-浅-1440', '评测失败态 · 不记 0 分'],
      ['12-指标编辑器与YAML-深-1440', '编辑器（深色主题）'],
      ['18-会话-深-390', '窄屏 390 · 深色'],
      ['11-会话内评测-深-1440', '会话内评测（深色）'],
      ['13-指标库-深-1440', '指标库（深色）'],
      ['15-会话-浅-900', '平板 900 · 右栏收为抽屉'],
      ['17-指标编辑器-浅-390', '窄屏 390 · 编辑器单列']
    ];
    const cols = 4;
    shots.forEach((s, i) => {
      const col = i % cols, row = Math.floor(i / cols);
      const x = 100 + col * (W + GAP_X);
      const y = pagesY + row * (H + GAP_Y);
      addPage(x, y, W, H, s[1], `<img src="prototype-shots/${s[0]}.png" alt="${s[1]}" style="display:block;width:100%;height:100%;object-fit:cover;object-position:top left;">`);
    });

  }

  initDemo();

  const r = viewport.getBoundingClientRect();
  panX = r.width * 0.04;
  panY = r.height * 0.04;
  updateTransform();
})();
</script>
