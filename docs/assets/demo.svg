<svg xmlns="http://www.w3.org/2000/svg" width="880" height="490" viewBox="0 0 880 490" role="img" aria-labelledby="dTitle dDesc">
  <title id="dTitle">EternaAgent 一次真实会话骨架</title>
  <desc id="dDesc">终端风格:用户要求把偏好写入记忆,agent 调 memory_write,sqlite memory_entity 落库一行,memory_search 命中;下方为 L2 领域包 / L1 基座插件 / DSH 宿主的架构条,并标注 12 包、776 tests、ai-evo 门禁 PASSED。</desc>
  <defs>
    <linearGradient id="segG1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="segG2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8957e5" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8957e5" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="segG3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ea043" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#2ea043" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <rect width="880" height="490" rx="14" fill="#0d1117"/>

  <!-- ══ 终端窗口 ══ -->
  <rect x="28" y="26" width="824" height="300" rx="10" fill="#161b22" stroke="#30363d"/>
  <circle cx="52" cy="46" r="5.5" fill="#ff5f57"/>
  <circle cx="72" cy="46" r="5.5" fill="#febc2e"/>
  <circle cx="92" cy="46" r="5.5" fill="#28c840"/>
  <text x="440" y="50" text-anchor="middle" fill="#8b949e" font-size="12" font-family="'SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono','Courier New',monospace">EternaAgent · 一次真实会话(骨架)· dsh headless</text>
  <line x1="28" y1="64" x2="852" y2="64" stroke="#30363d"/>

  <!-- ① 用户 -->
  <text x="52" y="94" font-size="13" font-family="'SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono','Courier New',monospace">
    <tspan fill="#7ee787" font-weight="700">❯ 你</tspan><tspan fill="#8b949e"> · </tspan><tspan fill="#e6edf3" font-weight="600">把偏好写入记忆</tspan>
  </text>

  <!-- ② agent 调 memory_write -->
  <text x="52" y="124" font-size="13" font-family="'SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono','Courier New',monospace">
    <tspan fill="#e3b341" font-weight="700">agent</tspan><tspan fill="#8b949e"> → tool </tspan><tspan fill="#79c0ff" font-weight="700">memory_write</tspan><tspan fill="#a5d6ff"> subject:"user:me" key:"meeting-preference"</tspan>
  </text>
  <text x="76" y="150" font-size="13" font-family="'SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono','Courier New',monospace">
    <tspan fill="#a5d6ff">content:"用户偏好周五下午开会" confidence:0.8</tspan><tspan fill="#7ee787"> → ✓ 已入库</tspan>
  </text>

  <!-- ③ sqlite 落库行 -->
  <text x="52" y="182" font-size="13" font-family="'SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono','Courier New',monospace">
    <tspan fill="#d2a8ff" font-weight="700">sqlite · memory_entity</tspan><tspan fill="#8b949e">(长期记忆 · forget = 逆闭包真删)</tspan>
  </text>
  <rect x="52" y="190" width="780" height="32" rx="6" fill="#1a1626" stroke="#8957e5" stroke-opacity="0.55"/>
  <text x="66" y="211" font-size="13" font-family="'SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono','Courier New',monospace">
    <tspan fill="#d2a8ff">id=1</tspan><tspan fill="#8b949e"> │ </tspan><tspan fill="#e6edf3">user:me</tspan><tspan fill="#8b949e"> │ </tspan><tspan fill="#e6edf3">meeting-preference</tspan><tspan fill="#8b949e"> │ </tspan><tspan fill="#e6edf3">用户偏好周五下午开会</tspan><tspan fill="#8b949e"> │ </tspan><tspan fill="#a5d6ff">conf=0.8</tspan><tspan fill="#8b949e"> │ </tspan><tspan fill="#7ee787">invalid_at=NULL ✓存活</tspan>
  </text>

  <!-- ④ memory_search 命中 -->
  <text x="52" y="252" font-size="13" font-family="'SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono','Courier New',monospace">
    <tspan fill="#e3b341" font-weight="700">agent</tspan><tspan fill="#8b949e"> → tool </tspan><tspan fill="#79c0ff" font-weight="700">memory_search</tspan><tspan fill="#a5d6ff"> query:"开会"</tspan>
  </text>
  <text x="52" y="280" font-size="13" font-family="'SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono','Courier New',monospace">
    <tspan fill="#7ee787" font-weight="700">✓ 命中 1 条</tspan><tspan fill="#8b949e"> · </tspan><tspan fill="#e6edf3">用户偏好周五下午开会</tspan><tspan fill="#8b949e">(user:me/meeting-preference · conf 0.8)</tspan>
  </text>
  <text x="52" y="308" font-size="13" font-family="'SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono','Courier New',monospace">
    <tspan fill="#8b949e"># 写入全过 PII 门禁(governance)· 记忆索引只注入 key+摘要 ≤500 token</tspan>
  </text>

  <!-- ══ 架构一行 ══ -->
  <rect x="28" y="354" width="250" height="48" rx="8" fill="url(#segG1)" stroke="#388bfd" stroke-opacity="0.6"/>
  <text x="44" y="375" font-size="13" font-weight="700" fill="#79c0ff" font-family="'SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono','Courier New',monospace">L2 领域包</text>
  <text x="44" y="392" font-size="11" fill="#8b949e" font-family="'SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono','Courier New',monospace">packs/&lt;行业&gt; · 金集 + 审批红线</text>

  <text x="290" y="385" font-size="16" fill="#8b949e" text-anchor="middle" font-family="'SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono','Courier New',monospace">→</text>

  <rect x="314" y="354" width="300" height="48" rx="8" fill="url(#segG2)" stroke="#ab7df8" stroke-opacity="0.6"/>
  <text x="330" y="375" font-size="13" font-weight="700" fill="#d2a8ff" font-family="'SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono','Courier New',monospace">L1 基座插件 @eterna/*</text>
  <text x="330" y="392" font-size="11" fill="#8b949e" font-family="'SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono','Courier New',monospace">治理·记忆·交互·知识·观测·进化·通道·缓存</text>

  <text x="626" y="385" font-size="16" fill="#8b949e" text-anchor="middle" font-family="'SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono','Courier New',monospace">→</text>

  <rect x="650" y="354" width="202" height="48" rx="8" fill="url(#segG3)" stroke="#3fb950" stroke-opacity="0.6"/>
  <text x="666" y="375" font-size="13" font-weight="700" fill="#7ee787" font-family="'SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono','Courier New',monospace">DSH 官方宿主</text>
  <text x="666" y="392" font-size="11" fill="#8b949e" font-family="'SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono','Courier New',monospace">零内核改动 · seam 钉住</text>

  <!-- ══ 标注徽条 ══ -->
  <rect x="28" y="426" width="86" height="36" rx="18" fill="#0f2340" stroke="#388bfd" stroke-opacity="0.8"/>
  <text x="71" y="449" text-anchor="middle" font-size="13" font-weight="700" fill="#79c0ff" font-family="'SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono','Courier New',monospace">12 包</text>

  <rect x="126" y="426" width="118" height="36" rx="18" fill="#1c1433" stroke="#ab7df8" stroke-opacity="0.8"/>
  <text x="185" y="449" text-anchor="middle" font-size="13" font-weight="700" fill="#d2a8ff" font-family="'SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono','Courier New',monospace">776 tests</text>

  <rect x="256" y="426" width="236" height="36" rx="18" fill="#0f2a19" stroke="#3fb950" stroke-opacity="0.8"/>
  <text x="374" y="449" text-anchor="middle" font-size="13" font-weight="700" fill="#7ee787" font-family="'SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono','Courier New',monospace">ai-evo 门禁 PASSED ✓</text>
</svg>
