# Tier 真值源(33 号 G0-6 ①;40 号 S-1):packctl form-check 的唯一事实源,新包落地时登记。
# tier1 条目必须实际存在(packages/<名> 或 tools/<名>;不存在 → form-check 退出码 2 用法错误);
# tier2 允许登记未落地包(登记先于落地:tasks、workbench 为 31 号 §2.2 点名的 Tier2)。
# toolkit 登记(2026-11-19 merge 裁决):宿主半边已落地(super 模板挂载行
# verify-eterna-super 断言 active),按「新包落地时登记」入 tier1 参与 TIER001 扫描;
# 归属值随 D1 改判联动(31 号 §5,如有异议随时改)。
# tier1 = packages/ 25 + tools/ 3(「tools」是目录分组名不是包,原表误列已除;
# agent-loop/approval-cli/llm/session/system-prompt 五名在途未落地,按「tier2 允许登记
# 未落地包」暂列 tier2,各自落地 PR 时按「新包落地时登记」移回 tier1;
# bundle-core/ 无 package.json 不算包),逐名列出、不用通配——真值源必须显式。
# adviser 登记(2026-11-24):同「新包落地时登记」纪律——54 号(参谋面板)双面包已落地
# (packages/adviser,insert 行 + dsh.client),入 tier1 参与 TIER001 扫描。
# 设计依据 docs/design/54-adviser-P0-probe.md。
